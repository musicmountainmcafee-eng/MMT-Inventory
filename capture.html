<!doctype html>
<meta charset="utf-8">
<title>MMT Capture</title>
<body style="margin:0;background:#000">
<video id="v" autoplay muted playsinline
 style="width:100vw;height:100vh;object-fit:contain"></video>
<script>
async function go(){
  try{
    v.srcObject = await navigator.mediaDevices.getUserMedia(
      {video:{width:1920,height:1080,frameRate:30}});
  }catch(e){ setTimeout(go,3000); }
}
go();
</script>
