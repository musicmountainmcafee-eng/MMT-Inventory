<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>MMT Cast Sheet</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f8f7f4; --surface: #fff; --text: #1a1a1a; --muted: #6b6b6b; --border: rgba(0,0,0,.12); --bar: #18181b; --bar-ink: #fff; --me: #534AB7; --me-soft: #EEEDFE; --chip: #f1f0ec; }
  [data-theme="dark"] { --bg: #0e0e12; --surface: #1a1a21; --text: #f1f1f3; --muted: #a1a1aa; --border: rgba(255,255,255,.14); --bar: #2a2a33; --bar-ink: #fff; --me: #a5a0f5; --me-soft: #2b2850; --chip: #26262e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 'DM Sans', system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; cursor: pointer; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bar); color: var(--bar-ink); padding: calc(10px + env(safe-area-inset-top)) 14px 0; }
  .h-top { display: flex; align-items: center; gap: 10px; }
  .h-name { flex: 1; min-width: 0; } .h-name b { display: block; font-size: 17px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .h-name small { font-size: 12px; opacity: .75; }
  .h-btn { border: 1px solid rgba(255,255,255,.3); background: transparent; color: #fff; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; min-height: 36px; white-space: nowrap; }
  nav { display: flex; gap: 4px; margin-top: 10px; }
  nav button { flex: 1; border: 0; background: transparent; color: #fff; opacity: .65; padding: 10px 4px 9px; font-weight: 600; font-size: 14px; border-bottom: 3px solid transparent; }
  nav button.on { opacity: 1; border-bottom-color: #fff; }
  main { padding: 14px 14px calc(70px + env(safe-area-inset-bottom)); max-width: 760px; margin: 0 auto; }
  .who-bar { display: flex; align-items: center; gap: 10px; background: var(--me-soft); border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; }
  .who-bar span { flex: 1; min-width: 0; } .who-bar b { color: var(--me); }
  .btn { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; min-height: 40px; }
  .tbl-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  table.cs { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 14px; }
  table.cs th { text-align: left; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 8px 7px; border-bottom: 1px solid var(--border); border-left: 1px solid var(--border); }
  table.cs th:first-child, table.cs td:first-child { border-left: 0; }
  table.cs td { padding: 10px 8px; vertical-align: top; border-top: 1px solid var(--border); overflow-wrap: anywhere; }
  table.cs tr.first td { border-top: 2px solid var(--text); } table.cs tr.sc + tr td { border-top: 0; }
  table.cs tr.sc td { background: #121214; color: #fff; font-weight: 700; font-size: 13px; letter-spacing: .03em; text-transform: uppercase; padding: 8px 10px; border-top: 0; scroll-margin-top: 120px; }
  table.cs tr.sc td span { float: right; font-weight: 500; font-size: 11px; text-transform: none; opacity: .85; }
  table.cs td.n { font-weight: 700; white-space: nowrap; } table.cs td.pg { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  table.cs td.piece b { font-weight: 700; } table.cs tr.me td { background: var(--me-soft); } table.cs tr.me td.n { box-shadow: inset 4px 0 0 var(--me); }
  table.cs td.who i { font-style: normal; font-weight: 700; color: var(--me); }
  table.cs td.none { background: #d4d4d8 !important; } [data-theme="dark"] table.cs td.none { background: #3f3f46 !important; }
  table.cs .ph { display: none; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .chip { display: flex; gap: 6px; align-items: flex-start; margin-bottom: 4px; } .chip svg { flex: none; margin-top: 2px; } .chip b { font-weight: 700; display: block; line-height: 1.2; } .chip small { color: var(--muted); font-size: 11.5px; }
  th.c-n { width: 52px; } th.c-pg { width: 62px; } th.c-act { width: 84px; } th.c-wing { width: 92px; } th.c-who { width: 15%; } th.c-cue { width: 17%; } th.c-sp { width: 17%; } th.c-notes { width: 16%; }
  main.wide { max-width: 1100px; }
  @media (max-width: 720px) {
    table.cs .w { display: none; } table.cs .ph { display: block; } table.cs { font-size: 13.5px; }
    th.c-n { width: 40px; } th.c-cue { width: 24%; } th.c-who { width: 19%; } th.c-sp { width: 26%; }
    table.cs td { padding: 9px 6px; } main { padding-left: 8px; padding-right: 8px; }
    .chip { flex-direction: column; gap: 3px; }
  }
  .empty { color: var(--muted); padding: 24px 4px; text-align: center; }
  .pick { display: flex; flex-direction: column; gap: 8px; }
  .pick button { display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 12px 14px; min-height: 52px; font-size: 16px; font-weight: 600; }
  .pick button small { margin-left: auto; font-weight: 400; color: var(--muted); font-size: 13px; }
  .pick button.on { border-color: var(--me); box-shadow: inset 0 0 0 1px var(--me); }
  h2 { font-size: 18px; margin: 4px 0 4px; } .sub { color: var(--muted); margin: 0 0 14px; font-size: 14px; }
  .sc-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--border); background: transparent; padding: 12px 4px; min-height: 48px; font-size: 15px; }
  .sc-row:first-child { border-top: 0; } .sc-row b { flex: 1; min-width: 0; font-weight: 600; } .sc-row .pg { color: var(--muted); font-size: 13px; font-family: 'DM Mono', monospace; }
  .dot { flex: none; min-width: 22px; height: 22px; border-radius: 999px; background: var(--me); color: #fff; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px; }
  .dot.none { background: transparent; }
  .demo { background: #b45309; color: #fff; text-align: center; font-size: 12.5px; font-weight: 600; padding: 5px 10px; }
  #build-tag { position: fixed; right: 8px; bottom: calc(6px + env(safe-area-inset-bottom)); font: 11px 'DM Mono', monospace; color: var(--muted); opacity: .7; pointer-events: none; z-index: 9; }
</style>
</head>
<body>
<div id="app"></div>
<div id="build-tag">11.14 v3 dev</div>
<script>
// ── MMT CAST SHEET ───────────────────────────────────────────────────────────
// The link the cast opens: one show's set changes, read only, on a phone.
// Three views: My moves (pick your name once), Whole plot, Scenes.
//   cast-dev.html            → asks which show, and remembers it
//   cast-dev.html?show=<id>  → that show only (the link sent to one cast)
//   cast-dev.html?show=<id>&s=<sheet>  → the same, without asking the script
// Each show's moves come from its own cast Google Sheet (written by the cue
// sheet after every save), read straight from Google (the Sheet's "Set
// Changes" tab), so a full cast on their phones never touches the dashboard's
// script. The script is only asked once, for the list of shows, and not at all
// on a per-show link that carries its sheet. Until the script has its cast
// update (or with ?demo=1) the page runs on the sample shows below, and says
// so. Nothing here writes anywhere.
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzVONJuSlGzl04FZCzd3h45V2AsKC3HkqI6eeaujMetaDGkeGctL9IolMkJNBeJA7BaBg/exec';
const Q = new URLSearchParams(location.search);
const LOCKED = Q.get('show') || '';
const REFRESH_MS = 30000;
const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} return null; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ── sample data (stands in for the cast Sheets) ──
const SAMPLE = {
  shows: [{ id: 'sample-main', name: 'Sample Mainstage Show', stage: 'Mainstage' }, { id: 'sample-kids', name: "Sample Children's Show", stage: "Children's Theatre" }],
  data: {
    'sample-main': { name: 'Sample Mainstage Show', scenes: [
      { label: 'Scene 1: The Counting House', page: 3, changes: [
        { num: '5', page: 6, cue: '“Bah! Humbug!”', moves: [
          { piece: "Scrooge's desk", action: 'Strike', wing: 'CS → SR 2', who: ['Kyle B', 'Molly R'], notes: 'Lift, don’t drag', sp: { s: [['Counting house', 'Red', '#d7262e', '']], t: '' } },
          { piece: 'Counting stool', action: 'Strike', wing: 'CS → SR 2', who: ['Dana'] },
          { piece: 'Bed', action: 'On', wing: 'SL 3 → CS', who: ['Tristan', 'Ally K'], notes: 'Head upstage', sp: { s: [['Bedroom', 'Yellow', '#f5c518', '']], t: '' } }] }] },
      { label: 'Scene 2: Scrooge’s Bedroom', page: 9, changes: [
        { num: '9', page: 14, cue: 'Clock strikes one', moves: [
          { piece: 'Bed', action: 'Turn', wing: 'CS', who: ['Tristan', 'Ally K'] },
          { piece: 'Door unit', action: 'On', wing: 'SR 1 → SR', who: ['Kyle B'], sp: { n: 1 } }] }] },
      { label: 'Scene 3: Fezziwig’s', page: 18, changes: [
        { num: '14', page: 18, cue: 'Lights shift warm', moves: [
          { piece: 'Bed', action: 'Strike', wing: 'CS → SL 3', who: ['Tristan', 'Ally K'] },
          { piece: 'Fezziwig table', action: 'On', wing: 'SR 2 → CS', who: ['Kyle B', 'Molly R', 'Dana'] },
          { piece: 'Benches (2)', action: 'On', wing: 'SL 1 → CS', who: ['Louis T', 'Ally K'] }] },
        { num: '17', page: 24, cue: 'End of the dance', moves: [
          { piece: 'Fezziwig table', action: 'Strike', wing: 'CS → SR 2', who: ['Kyle B', 'Molly R'] },
          { piece: 'Benches (2)', action: 'Strike', wing: 'CS → SL 1', who: ['Louis T', 'Dana'] }] }] },
      { label: 'Intermission', page: 30, changes: [] },
      { label: 'Scene 4: The Cratchits', page: 31, changes: [
        { num: '21', page: 31, cue: 'Top of Act 2', moves: [
          { piece: 'Cratchit wagon', action: 'On', wing: 'SL 2 → CS', who: ['Tristan', 'Louis T', 'Molly R'], notes: 'Brakes on once it lands' }] }] }] },
    'sample-kids': { name: "Sample Children's Show", scenes: [
      { label: 'Scene 1: The Forest', page: 1, changes: [
        { num: '2', page: 4, cue: '“Follow the path!”', moves: [
          { piece: 'Tree (large)', action: 'On', wing: 'SR → CS', who: ['Sam', 'Priya'] },
          { piece: 'Log', action: 'On', wing: 'SL → DSL', who: ['Jo'] }] }] },
      { label: 'Scene 2: The Cottage', page: 8, changes: [
        { num: '6', page: 8, cue: 'Blackout', moves: [
          { piece: 'Tree (large)', action: 'Strike', wing: 'CS → SR', who: ['Sam', 'Priya'] },
          { piece: 'Cottage flat', action: 'On', wing: 'SL → CS', who: ['Jo', 'Sam'] }] }] }] }
  }
};
// Ask Google for something as a script tag (works from any page, no sign-in).
let _jp = 0;
function jsonp(url, cbParam) {
  return new Promise((res, rej) => {
    const cb = '__cast' + (++_jp) + Date.now().toString(36), el = document.createElement('script');
    const done = (f, v) => { clearTimeout(t); try { delete window[cb]; } catch (e) { window[cb] = undefined; } el.remove(); f(v); };
    const t = setTimeout(() => done(rej, new Error('timeout')), 20000);
    window[cb] = d => done(res, d); el.onerror = () => done(rej, new Error('load'));
    el.src = url.replace('%CB%', cb) + (cbParam ? '&' + cbParam + '=' + cb : ''); document.head.appendChild(el);
  });
}
// A cast Sheet's "Set Changes" tab → scenes, each with its changes and moves.
function readTable(t) {
  let cols = ((t && t.cols) || []).map(c => String(c.label || '').trim()), rows = ((t && t.rows) || []).map(r => (r.c || []).map(c => c && c.v != null ? String(c.v) : ''));
  if (cols.indexOf('Scene') < 0 && rows.length && rows[0].indexOf('Scene') >= 0) cols = rows.shift().map(v => v.trim());   // heading row came through as data
  const at = n => cols.indexOf(n), g = (r, n) => at(n) >= 0 ? (r[at(n)] || '').trim() : '';
  if (at('Scene') < 0 || at('Piece') < 0) throw new Error('Not a cast sheet');
  const scenes = []; let sc = null, ch = null, updated = 0;
  rows.forEach(r => {
    const u = g(r, 'Updated'); if (u && !updated) updated = Date.parse(u) || 0;
    const label = g(r, 'Scene'), sp = g(r, 'Scene page');
    if (!sc || sc.label !== label || sc.page !== sp) { sc = { label, page: sp, changes: [] }; scenes.push(sc); ch = null; }
    const piece = g(r, 'Piece'), action = g(r, 'Action'); if (!piece && !action) return;
    const num = g(r, 'Cue').replace(/^#/, ''), page = g(r, 'Page'), cue = g(r, 'Cue line');
    if (!ch || ch.num !== num || ch.page !== page || ch.cue !== cue) { ch = { num, page, cue, moves: [] }; sc.changes.push(ch); }
    let spk = null; try { spk = JSON.parse(g(r, 'Spike data') || 'null'); } catch (e) {}
    ch.moves.push({ piece, action, wing: g(r, 'Wing'), who: g(r, 'Who').split(',').map(x => x.trim()).filter(Boolean), notes: g(r, 'Notes'), spike: g(r, 'Spike'), sp: spk });
  });
  return { scenes, updated };
}
// Where the data comes from: the cast Sheets, or the samples.
const Sample = {
  demo: true,
  shows() { return Promise.resolve(SAMPLE.shows); },
  show(id) { const d = SAMPLE.data[id]; return d ? Promise.resolve(Object.assign({ updated: Date.now() }, d)) : Promise.reject(new Error('No such show')); }
};
const Live = {
  demo: false, list: null,
  index() {
    return jsonp(SCRIPT_URL + '?action=getCastIndex&_=' + Date.now(), 'callback').then(d => {
      if (!d || !d.cast) throw Object.assign(new Error('old'), { old: true });
      Live.list = (d.shows || []).filter(x => x.sheet).map(x => ({ id: String(x.show), name: x.name || 'Show', sheet: x.sheet }));
      ls('mmt_cast_index', JSON.stringify(Live.list)); return Live.list;
    });
  },
  shows() { return Live.index().catch(e => { if (e.old) throw e; try { Live.list = JSON.parse(ls('mmt_cast_index') || 'null'); } catch (x) {} if (!Live.list) throw e; return Live.list; }); },
  sheetOf(id) {
    if (LOCKED && id === LOCKED && Q.get('s')) return Promise.resolve({ sheet: Q.get('s'), name: Q.get('n') || '' });
    const hit = l => (l || []).find(x => x.id === id);
    return hit(Live.list) ? Promise.resolve(hit(Live.list)) : Live.shows().then(l => hit(l) || Promise.reject(new Error('No such show')));
  },
  show(id) {
    return Live.sheetOf(id).then(e => jsonp('https://docs.google.com/spreadsheets/d/' + encodeURIComponent(e.sheet) + '/gviz/tq?tqx=out:json;responseHandler:%CB%&sheet=Data&headers=1&_=' + Date.now())
      .then(d => { if (!d || d.status === 'error' || !d.table) throw new Error('read'); const t = readTable(d.table);
        return { name: e.name || (hit => hit ? hit.name : '')((Live.list || []).find(x => x.id === id)) || ls('mmt_cast_name_' + id) || 'Cast Sheet', scenes: t.scenes, updated: t.updated || Date.now() }; }));
  }
};
let Source = Q.get('demo') === '1' ? Sample : Live;

// ── state ──
let shows = [], showId = LOCKED || ls('mmt_cast_show') || '', data = null, view = ls('mmt_cast_view') || 'mine', me = '', picking = false, err = '', lastOk = 0;
let theme = ls('mmt_cast_theme') || (matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
document.documentElement.dataset.theme = theme;

const people = () => { const n = {}; (data ? data.scenes : []).forEach(s => s.changes.forEach(c => c.moves.forEach(m => (m.who || []).forEach(w => { n[w] = n[w] || new Set(); n[w].add(c.num + '|' + s.label); })))); return Object.keys(n).sort((a, b) => a.localeCompare(b)).map(name => ({ name, n: n[name].size })); };
const mine = c => c.moves.filter(m => (m.who || []).indexOf(me) >= 0);
const ago = t => { const s = Math.round((Date.now() - t) / 1000); return s < 50 ? 'just now' : s < 3600 ? Math.round(s / 60) + ' min ago' : new Date(t).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); };

function load(first) {
  if (!showId) return;
  Source.show(showId).then(d => {
    const changed = JSON.stringify(d.scenes) !== JSON.stringify(data && data.scenes);
    data = d; err = ''; lastOk = Date.now(); ls('mmt_cast_data_' + showId, JSON.stringify(d)); if (d.name && d.name !== 'Cast Sheet') ls('mmt_cast_name_' + showId, d.name);
    if (me && !people().some(p => p.name === me)) { me = ''; }
    if (first || changed) render(); else stamp();
  }).catch(() => {
    // no signal backstage: keep showing the last copy this phone has
    if (!data) { try { data = JSON.parse(ls('mmt_cast_data_' + showId) || 'null'); } catch (e) {} }
    err = data ? 'No signal. Showing the last copy on this phone.' : "Couldn't load this show. Check your signal and try again.";
    render();
  });
}
function openShow(id) { showId = id; if (!LOCKED) ls('mmt_cast_show', id); data = null; me = ls('mmt_cast_me_' + id) || ''; picking = false; render(); load(true); }
function stamp() { const el = document.getElementById('upd'); if (el && data) el.textContent = (err ? 'Offline · ' : '') + 'Updated ' + ago(data.updated || lastOk); }

// ── drawing ──
function render() {
  const app = document.getElementById('app'), demo = Source.demo ? '<div class="demo">Sample data. This is a preview of the cast page, not a real show.</div>' : '';
  if (!Source.demo && showsErr && !showId) { app.innerHTML = `<header><div class="h-top"><div class="h-name"><b>MMT Cast Sheet</b></div></div><nav></nav></header><main><p class="empty">${esc(showsErr)}</p><p class="empty"><button class="btn" data-a="reshows">Try again</button></p></main>`; return; }
  if (!showId || (!data && !err && !shows.length && !LOCKED)) { app.innerHTML = demo + chooserHTML(); return; }
  if (!showId) { app.innerHTML = demo + chooserHTML(); return; }
  if (!data) { app.innerHTML = demo + `<header><div class="h-top"><div class="h-name"><b>Cast Sheet</b></div></div><nav></nav></header><main><p class="empty">${esc(err || 'Loading…')}</p>${err ? `<p class="empty"><button class="btn" data-a="retry">Try again</button>${LOCKED ? '' : ' <button class="btn" data-a="shows">Pick a show</button>'}</p>` : ''}</main>`; return; }
  const tabs = [['mine', 'My moves'], ['plot', 'Whole plot'], ['scenes', 'Scenes']];
  app.innerHTML = demo + `<header><div class="h-top"><div class="h-name"><b>${esc(data.name)}</b><small id="upd"></small></div>
      ${LOCKED ? '' : '<button class="h-btn" data-a="shows">Shows</button>'}<button class="h-btn" data-a="theme" aria-label="Switch light or dark">${theme === 'dark' ? 'Light' : 'Dark'}</button></div>
    <nav role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${view === k}" class="${view === k ? 'on' : ''}" data-a="view" data-v="${k}">${l}</button>`).join('')}</nav></header>
    <main class="${view === 'scenes' || (view === 'mine' && (!me || picking)) ? '' : 'wide'}">${err ? `<p class="who-bar"><span>${esc(err)}</span></p>` : ''}${view === 'mine' ? mineHTML() : view === 'plot' ? plotHTML() : scenesHTML()}</main>`;
  stamp();
}
function chooserHTML() {
  return `<header><div class="h-top"><div class="h-name"><b>MMT Cast Sheet</b><small>Music Mountain Theatre</small></div></div><nav></nav></header>
    <main><h2>Which show are you in?</h2><p class="sub">This phone will remember it. You can switch any time.</p>
    <div class="pick">${shows.length ? shows.map(s => `<button data-a="show" data-v="${esc(s.id)}">${esc(s.name)}<small>${esc(s.stage || '')}</small></button>`).join('') : `<p class="empty">${showsLoaded ? 'No show has a cast sheet yet.' : 'Loading shows…'}</p>`}</div></main>`;
}
// The same table as the cue sheet: # · cue · pg · piece · action · wing · who ·
// spike · notes, a black bar for each scene, a heavier line where the next
// change starts. On a phone the page, action/wing and notes tuck under their
// neighbours, as the cue sheet does.
function whoLine(m) { return (m.who || []).map(w => w === me ? `<i>${esc(w)}</i>` : esc(w)).join(', '); }
function swatch(c1, c2) {
  const a = esc(c1 || '#9ca3af'), b = esc(c2 || c1 || '#9ca3af');
  return `<svg width="30" height="15" viewBox="0 0 32 16" aria-hidden="true"><rect width="32" height="16" rx="3" fill="#262626"/><path d="M4 12V4h9" stroke="${a}" stroke-width="3.5" fill="none"/><path d="M19 4h9v8" stroke="${b}" stroke-width="3.5" fill="none"/></svg>`;
}
function spikeHTML(m) {
  const d = m.sp;
  if (d && d.n) return '';
  if (d && (d.s || d.t)) return (d.s || []).map(x => `<div class="chip">${swatch(x[2], x[3])}<span><b>${esc(x[0])}</b>${x[1] ? `<small>${esc(x[1])}</small>` : ''}</span></div>`).join('') + (d.t ? `<div>${esc(d.t)}</div>` : '');
  return esc(m.spike && m.spike !== 'No spike' ? m.spike : '');
}
const isNone = m => !!(m.sp && m.sp.n) || m.spike === 'No spike';
function rowHTML(c, m, first, only) {
  const isMe = !only && me && (m.who || []).indexOf(me) >= 0, sub = [m.action, m.wing].filter(Boolean).join(' · ');
  return `<tr class="${first ? 'first' : ''}${isMe ? ' me' : ''}"><td class="n">#${esc(c.num)}</td>
    <td class="cue">${esc(c.cue || '')}${c.page ? `<div class="ph">pg. ${esc(c.page)}</div>` : ''}</td><td class="pg w">${c.page ? 'pg. ' + esc(c.page) : ''}</td>
    <td class="piece"><b>${esc(m.piece)}</b>${sub ? `<div class="ph">${esc(sub)}</div>` : ''}</td><td class="w">${esc(m.action || '')}</td><td class="w">${esc(m.wing || '')}</td>
    <td class="who">${whoLine(m)}</td><td class="spike${isNone(m) ? ' none' : ''}">${spikeHTML(m)}${m.notes ? `<div class="ph">${esc(m.notes)}</div>` : ''}</td><td class="w">${esc(m.notes || '')}</td></tr>`;
}
// The scene bar spans the columns that are showing (5 on a phone, 9 wide).
const NARROW = matchMedia('(max-width: 720px)');
(NARROW.addEventListener ? NARROW.addEventListener.bind(NARROW, 'change') : NARROW.addListener.bind(NARROW))(() => { if (data) render(); });
function tableHTML(only) {
  let body = '', n = 0;
  data.scenes.forEach((s, i) => {
    const cs = only ? s.changes.filter(c => mine(c).length) : s.changes;
    if (only && !cs.length) return;
    body += `<tr class="sc" id="sc-${i}"><td colspan="${NARROW.matches ? 5 : 9}">${esc(s.label)}${s.page ? `<span>pg. ${esc(s.page)}</span>` : ''}</td></tr>`;
    cs.forEach((c, ci) => (only ? mine(c) : c.moves).forEach((m, mi) => { n++; body += rowHTML(c, m, mi === 0 && ci > 0, only); }));
  });
  return { n, html: `<div class="tbl-wrap"><table class="cs"><thead><tr><th class="c-n">#</th><th class="c-cue">Cue</th><th class="c-pg w">Pg</th><th>Piece</th><th class="c-act w">Action</th><th class="c-wing w">Wing</th><th class="c-who">Who</th><th class="c-sp"><span class="w">Spike</span><span class="ph" style="margin:0;font-size:inherit">Spike / notes</span></th><th class="c-notes w">Notes</th></tr></thead><tbody>${body}</tbody></table></div>` };
}
function pickHTML() {
  const p = people();
  return `<h2>Who are you?</h2><p class="sub">Pick your name to see only your moves. Not on the list? You have no set changes yet. Use Whole plot or Scenes.</p>
    <div class="pick">${p.map(x => `<button class="${x.name === me ? 'on' : ''}" data-a="me" data-v="${esc(x.name)}">${esc(x.name)}<small>${x.n} change${x.n === 1 ? '' : 's'}</small></button>`).join('') || '<p class="empty">No one is assigned to a set change yet.</p>'}</div>`;
}
function mineHTML() {
  if (!me || picking) return pickHTML();
  const t = tableHTML(true);
  return `<div class="who-bar"><span>Moves for <b>${esc(me)}</b></span><button class="btn" data-a="pick">Change</button></div>` + (t.n ? t.html : '<p class="empty">You have no set changes in this show right now.</p>');
}
function plotHTML() { return tableHTML(false).html; }
function scenesHTML() {
  return `<h2>Scenes</h2><p class="sub">${me ? 'The number shows how many changes you’re in. ' : ''}Tap a scene to see its set changes.</p><div class="chg" style="padding:0 10px">` +
    data.scenes.map((s, i) => { const k = me ? s.changes.filter(c => mine(c).length).length : 0; return `<button class="sc-row" data-a="scene" data-v="${i}"><span class="dot${k ? '' : ' none'}">${k || ''}</span><b>${esc(s.label)}</b><span class="pg">p. ${esc(s.page)}</span></button>`; }).join('') + '</div>';
}

document.addEventListener('click', ev => {
  const b = ev.target.closest && ev.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, v = b.dataset.v;
  if (a === 'show') openShow(v);
  else if (a === 'shows') { showId = ''; data = null; ls('mmt_cast_show', null); render(); }
  else if (a === 'view') { view = v; picking = false; ls('mmt_cast_view', v); render(); window.scrollTo(0, 0); }
  else if (a === 'me') { me = v; picking = false; ls('mmt_cast_me_' + showId, v); render(); window.scrollTo(0, 0); }
  else if (a === 'pick') { picking = true; render(); }
  else if (a === 'theme') { theme = theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = theme; ls('mmt_cast_theme', theme); render(); }
  else if (a === 'scene') { view = 'plot'; ls('mmt_cast_view', 'plot'); render(); const el = document.getElementById('sc-' + v); if (el) el.scrollIntoView(); }
  else if (a === 'retry') { err = ''; render(); load(true); }
  else if (a === 'reshows') { showsErr = ''; render(); getShows(); }
});
setInterval(() => { if (!document.hidden && showId) load(false); else stamp(); }, REFRESH_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden && showId) load(false); });

// The list of shows. If the dashboard's script doesn't have its cast update
// yet, fall back to the samples (and say so).
let showsErr = '', showsLoaded = false;
function getShows() {
  return Source.shows().then(s => { shows = s; showsLoaded = true; if (!showId) render(); })
    .catch(e => { if (e && e.old) { Source = Sample; if (!SAMPLE.data[showId]) showId = ''; data = null; return getShows(); } showsErr = "Couldn't load the list of shows. Check your signal and try again."; if (!showId) render(); });
}
if (showId && (Source.demo || Q.get('s'))) { me = ls('mmt_cast_me_' + showId) || ''; render(); load(true); if (!LOCKED) getShows(); }
else { render(); getShows().then(() => { if (showId) { me = ls('mmt_cast_me_' + showId) || ''; render(); load(true); } }); }
</script>
</body>
</html>
