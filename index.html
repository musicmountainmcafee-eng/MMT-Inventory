<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MMT Warehouse Catalogue</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green: #3B6D11; --purple: #534AB7; --blue: #185FA5;
    --green-light: #EAF3DE; --green-dark: #27500A;
    --purple-light: #EEEDFE; --purple-dark: #3C3489;
    --blue-light: #E6F1FB; --blue-dark: #0C447C;
    --red: #c0392b;
    --bg: #f8f7f4; --surface: #ffffff;
    --border: rgba(0,0,0,0.1);
    --text: #1a1a1a; --text-muted: #6b6b6b; --text-faint: #aaaaaa;
    --radius: 12px; --radius-sm: 8px;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 1100px; margin: 0 auto; }
  .header { background: linear-gradient(135deg, var(--green) 0%, var(--purple) 55%, var(--blue) 100%); border-radius: var(--radius); padding: 2.5rem 2rem; margin-bottom: 1.5rem; position: relative; overflow: hidden; }
  .header::before { content: ''; position: absolute; top: -40px; right: -40px; width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,0.05); pointer-events: none; }
  #staff-box { position: relative; z-index: 1; }
  /* Availability is for staff only. */
  body:not(.is-staff) .staff-only { display: none !important; }
  #staff-box .btn { background: rgba(255,255,255,0.16); color: #fff; border: 1px solid rgba(255,255,255,0.5); }
  #staff-box label { color: #1a1a1a; }
  .header h1 { color: white; font-size: 2rem; font-weight: 600; letter-spacing: -0.5px; }
  .header p { color: rgba(255,255,255,0.75); font-size: 0.95rem; margin-top: 6px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1rem; }
  .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .stat-val { font-size: 1.75rem; font-weight: 600; }
  .stat-val.green { color: var(--green); } .stat-val.purple { color: var(--purple); } .stat-val.blue { color: var(--blue); }
  .controls { display: flex; gap: 10px; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
  .search-wrap { flex: 1; min-width: 200px; position: relative; }
  .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-faint); pointer-events: none; width: 16px; height: 16px; }
  .controls input { width: 100%; padding: 10px 12px 10px 36px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; font-family: 'DM Sans', sans-serif; background: var(--surface); color: var(--text); outline: none; transition: border-color 0.15s; }
  .controls input:focus { border-color: var(--purple); }
  .controls select { padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; font-family: 'DM Sans', sans-serif; background: var(--surface); color: var(--text); outline: none; cursor: pointer; }
  .view-toggle { display: flex; gap: 4px; }
  .view-btn { padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text-muted); cursor: pointer; font-size: 16px; transition: all 0.15s; }
  .view-btn.active { background: var(--purple-light); color: var(--purple); border-color: var(--purple); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s; }
  .card:hover { border-color: var(--purple); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(83,74,183,0.12); }
  .card.in-cart { border-color: var(--green); background: #fafffe; }
  .card-img { width: 100%; height: 140px; background: var(--bg); overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--text-faint); flex-direction: column; gap: 6px; }
  .card-img img { width: 100%; height: 140px; object-fit: cover; }
  .card-img svg { width: 32px; height: 32px; opacity: 0.3; }
  .card-body { padding: 1rem; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card-name { font-size: 15px; font-weight: 600; line-height: 1.3; cursor: pointer; }
  .badge { font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 99px; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.3px; }
  .badge-in { background: var(--green-light); color: var(--green-dark); }
  .badge-out { background: var(--purple-light); color: var(--purple-dark); }
  .card-tag { font-size: 11px; color: var(--text-faint); font-family: 'DM Mono', monospace; }
  .cat-pill { display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 99px; background: var(--blue-light); color: var(--blue-dark); font-weight: 500; }
  .card-loc { display: flex; gap: 5px; align-items: center; font-size: 13px; color: var(--text-muted); }
  .card-loc svg { width: 13px; height: 13px; color: var(--purple); flex-shrink: 0; }
  .card-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid var(--border); margin-top: auto; gap: 6px; }
  .rental-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 2px; }
  .rental-val { font-size: 17px; font-weight: 600; }
  .more-chip { font-size: 11px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--border); color: var(--text-muted); background: transparent; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
  .more-chip:hover { background: var(--purple-light); color: var(--purple); border-color: var(--purple); }
  .cart-btn { font-size: 11px; padding: 4px 10px; border-radius: 99px; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 600; transition: all 0.15s; }
  .cart-btn-add { background: var(--green-light); color: var(--green-dark); }
  .cart-btn-add:hover { background: var(--green); color: white; }
  .cart-btn-remove { background: var(--purple-light); color: var(--purple-dark); }
  .cart-btn-remove:hover { background: var(--purple); color: white; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .list-row { display: flex; align-items: center; gap: 12px; padding: 10px 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); transition: border-color 0.15s; }
  .list-row.in-cart { border-color: var(--green); background: #fafffe; }
  .list-thumb { width: 42px; height: 42px; border-radius: 8px; background: var(--bg); overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--text-faint); cursor:pointer; }
  .list-thumb img { width: 42px; height: 42px; object-fit: cover; }
  .list-thumb svg { width: 18px; height: 18px; opacity: 0.3; }
  .list-name { flex: 1; font-size: 14px; font-weight: 600; cursor: pointer; }
  .list-tag { font-size: 11px; color: var(--text-faint); font-family: 'DM Mono', monospace; min-width: 120px; }
  .list-cat { min-width: 90px; }
  .list-loc { flex: 1; font-size: 13px; color: var(--text-muted); }
  .list-price { font-size: 14px; font-weight: 600; min-width: 55px; text-align: right; }
  .message { text-align: center; padding: 4rem 2rem; color: var(--text-muted); }

  /* CART BAR */
  .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 1rem 1.5rem; display: flex; align-items: center; gap: 12px; z-index: 100; box-shadow: 0 -4px 24px rgba(0,0,0,0.08); transform: translateY(100%); transition: transform 0.25s ease; }
  .cart-bar.visible { transform: translateY(0); }
  .cart-bar-count { font-size: 14px; font-weight: 600; flex: 1; }
  .cart-bar-items { font-size: 12px; color: var(--text-muted); }
  .btn { padding: 10px 20px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; border: none; transition: all 0.15s; }
  .btn-green { background: var(--green); color: white; }
  .btn-green:hover { background: var(--green-dark); }
  .btn-ghost { background: none; border: 1px solid var(--border); color: var(--text-muted); }
  .btn-ghost:hover { border-color: var(--purple); color: var(--purple); }
  .btn-purple { background: var(--purple); color: white; }
  .btn-purple:hover { background: var(--purple-dark); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* OVERLAYS */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 1rem; backdrop-filter: blur(2px); }
  .modal { background: var(--surface); border-radius: var(--radius); width: 100%; max-width: 500px; overflow: hidden; box-shadow: 0 24px 64px rgba(0,0,0,0.2); animation: slideUp 0.2s ease; max-height: 90vh; overflow-y: auto; }
  .modal-wide { max-width: 560px; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .modal-img { width: 100%; height: 240px; background: var(--bg); display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--text-faint); flex-direction: column; gap: 8px; }
  .modal-img img { width: 100%; height: 240px; object-fit: cover; }
  .modal-thumbs { display: flex; gap: 8px; padding: 10px 16px 0; overflow-x: auto; }
  .modal-thumbs:empty { display: none; }
  .modal-thumbs button { flex-shrink: 0; width: 64px; height: 48px; padding: 0; border: 2px solid transparent; border-radius: 8px; overflow: hidden; background: var(--bg); cursor: pointer; }
  .modal-thumbs button.on { border-color: var(--purple, #534ab7); }
  .modal-thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .modal-pnote { padding: 6px 16px 0; font-size: 13px; color: var(--text-muted); white-space: pre-line; }
  .modal-pnote:empty { display: none; }
  .modal-img svg { width: 48px; height: 48px; opacity: 0.2; }
  .modal-body { padding: 1.5rem; }
  .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.25rem; }
  .modal-title { font-size: 1.25rem; font-weight: 600; }
  .close-btn { background: var(--bg); border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; line-height: 1; }
  .close-btn:hover { background: var(--purple-light); color: var(--purple); }
  .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .mf { display: flex; flex-direction: column; gap: 4px; }
  .mf-label { font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.6px; font-weight: 500; }
  .mf-val { font-size: 14px; font-weight: 500; }
  .mf-val.mono { font-family: 'DM Mono', monospace; font-size: 12px; }
  .modal-divider { border: none; border-top: 1px solid var(--border); margin: 1.25rem 0; }
  .modal-footer { display: flex; gap: 10px; margin-top: 1.25rem; }
  .modal-footer .btn { flex: 1; text-align: center; }

  /* INQUIRY FORM */
  .form-section { margin-bottom: 1.25rem; }
  .form-section-title { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
  .field input, .field select, .field textarea { padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); outline: none; transition: border-color 0.15s; width: 100%; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--purple); background: white; }
  .field textarea { resize: vertical; min-height: 70px; }
  .required { color: var(--red); margin-left: 2px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .cart-summary { background: var(--bg); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 1.25rem; }
  .cart-summary-title { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .cart-item-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px solid var(--border); }
  .cart-item-row:last-child { border-bottom: none; }
  .note-box { background: var(--blue-light); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 12px; color: var(--blue-dark); margin-bottom: 1.25rem; line-height: 1.5; }

  /* SUCCESS */
  .success-wrap { text-align: center; padding: 2rem; }
  .success-icon { font-size: 48px; margin-bottom: 1rem; }
  .success-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 8px; }
  .success-msg { font-size: 14px; color: var(--text-muted); line-height: 1.6; }

  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .refresh-bar { display: flex; justify-content: flex-end; margin-bottom: 0.75rem; }
  .refresh-btn { font-size: 12px; color: var(--text-muted); background: none; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; display: flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: var(--radius-sm); }
  .refresh-btn:hover { background: var(--surface); color: var(--purple); }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
      <div>
        <h1>MMT Warehouse Catalogue</h1>
        <p>Browse available props, furniture &amp; scenic elements for rent</p>
      </div>
      <div id="staff-box" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;"></div>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-label">Total items</div><div class="stat-val purple" id="total-count">—</div></div>
    <div class="stat staff-only"><div class="stat-label">Available</div><div class="stat-val green" id="avail-count">—</div></div>
    <div class="stat staff-only"><div class="stat-label">Currently out</div><div class="stat-val blue" id="out-count">—</div></div>
    <div class="stat"><div class="stat-label">Categories</div><div class="stat-val" id="cat-count">—</div></div>
  </div>
  <div class="controls">
    <div class="search-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search" placeholder="Search items, categories, tags..." oninput="render()" />
    </div>
    <select id="cat-filter" onchange="render()"><option value="">All categories</option></select>
    <select id="status-filter" class="staff-only" onchange="render()">
      <option value="">All statuses</option>
      <option value="IN">Available</option>
      <option value="OUT">Out</option>
    </select>
    <div class="view-toggle">
      <button class="view-btn active" id="grid-btn" onclick="setView('grid')" title="Grid">&#9783;</button>
      <button class="view-btn" id="list-btn" onclick="setView('list')" title="List">&#9776;</button>
    </div>
  </div>
  <div class="refresh-bar" style="display:flex;align-items:center;gap:10px;">
    <span id="updated" style="font-size:12px;color:var(--text-muted);margin-right:auto;"></span>
    <button class="refresh-btn" onclick="loadData()">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      Refresh
    </button>
  </div>
  <div id="results"><div class="message"><p>Loading inventory...</p></div></div>
</div>

<!-- ITEM DETAIL MODAL -->
<div id="modal-overlay" class="overlay" style="display:none;" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-img" id="modal-img"></div>
    <div class="modal-thumbs" id="modal-thumbs"></div>
    <div class="modal-pnote" id="modal-pnote"></div>
    <div class="modal-body">
      <div class="modal-header">
        <div>
          <div class="modal-title" id="modal-name"></div>
          <div style="margin-top:5px;" id="modal-badge"></div>
        </div>
        <button class="close-btn" onclick="closeModal()" aria-label="Close">&times;</button>
      </div>
      <div class="modal-grid" id="modal-grid"></div>
      <div id="modal-staff"></div>
    </div>
  </div>
</div>

<!-- STAFF PIN -->
<div id="pin-overlay" class="overlay" style="display:none;" onclick="closePin(event)">
  <div class="modal" onclick="event.stopPropagation()" style="max-width:340px;">
    <div class="modal-body">
      <div class="modal-header"><div class="modal-title">Staff sign in</div><button class="close-btn" onclick="closePin()" aria-label="Close">&times;</button></div>
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">Same PIN as the dashboard.</p>
      <input id="pin-input" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN"
        style="width:100%;font-size:20px;letter-spacing:6px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);"
        onkeydown="if(event.key==='Enter')submitPin()" />
      <div id="pin-err" style="color:#c0392b;font-size:13px;min-height:18px;margin-top:6px;"></div>
      <div class="modal-footer"><button class="btn btn-green" style="flex:1;" onclick="submitPin()">Sign in</button></div>
    </div>
  </div>
</div>

<script>
// ── Where the inventory comes from ──────────────────────────────────────────
// The inventory script reads the Sheet live. The public get only what renters
// may see; with the staff PIN (the dashboard's) it sends everything. If the
// script can't be reached, the published copy of the Sheet is the fallback
// (it lags a few minutes).
const INV_URL = 'https://script.google.com/macros/s/AKfycbwtpTZGYMn_5JdVuBC37xfW5A6Dlu7hXvihbZfuB0U3AY4VPHf-EV1TCnVgz1rSKtijsA/exec';
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRupSW2TcKEhcXbsDg5FRWaQgRzjkgDKvRFduvVwpdwCsMers-HJRwK4lK1AmAH4qO74ZBrmvJzOO25/pub?gid=0&single=true&output=csv';
const REFRESH_MS = 60000;

let allItems = [], view = 'grid', staff = false, settings = { showRental: false }, loadedAt = 0, source = '';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function staffKey() { try { return localStorage.getItem('mmt_staff_key') || ''; } catch (e) { return ''; } }

function driveThumb(raw, w) {
  if (!raw) return '';
  if (raw.includes('cloudinary.com')) return raw.replace('/upload/', '/upload/w_' + (w || 400) + ',c_fill/');
  const m = raw.match(/id=([\w-]+)/) || raw.match(/\/d\/([\w-]+)/);
  return m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w' + (w || 400) : raw;
}
// Asked without Google sign-in cookies first (a phone signed into several
// Google accounts otherwise gets sent to the wrong one and can't open the
// script); the old way is the fallback.
function getJSON(url, ok, fail) {
  fetch(url, { credentials: 'omit', cache: 'no-store' }).then(r => r.json()).then(ok, () => jsonp(url, ok, fail));
}
function jsonp(url, ok, fail, ms) {
  const cb = 'cat_' + Date.now() + '_' + Math.floor(Math.random() * 1e6), el = document.createElement('script');
  let done = false;
  const end = () => { if (done) return false; done = true; clearTimeout(t); delete window[cb]; el.remove(); return true; };
  const t = setTimeout(() => { if (end()) fail(); }, ms || 20000);
  window[cb] = d => { if (end()) ok(d); };
  el.onerror = () => { if (end()) fail(); };
  el.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
  document.head.appendChild(el);
}
// A full CSV reader: quoted cells may hold commas, quotes and line breaks
// (the notes do, since check-ins add dated lines).
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  const head = (rows.shift() || []).map(h => h.trim());
  const col = (...names) => head.findIndex(h => names.some(n => h.toLowerCase() === n.toLowerCase()));
  const C = { id: col('Asset ID'), tag: col('Tag ID'), name: col('Name'), qty: col('Quantity'), photo: col('Photo'), cat: col('Category'),
    sub: col('Subcatagorey', 'Subcategory'), loc: col('Storage Location'), status: col('Status'), due: col('due back'), show: col('Current show'),
    rental: col('Rental Value'), repl: col('Replacement Value'), notes: col('Notes'), lastShow: col('Last Used Show') };
  const g = (r, k) => (C[k] > -1 ? String(r[C[k]] || '').trim() : '');
  return rows.filter(r => g(r, 'id') && g(r, 'name')).map(r => ({
    assetId: g(r, 'id'), tagId: g(r, 'tag'), name: g(r, 'name'), quantity: g(r, 'qty'), photo: g(r, 'photo'),
    category: g(r, 'cat'), subcategory: g(r, 'sub'), status: g(r, 'status').toUpperCase() === 'OUT' ? 'OUT' : 'IN', dueBack: g(r, 'due'),
    location: g(r, 'loc'), currentShow: g(r, 'show'), rental: g(r, 'rental'), replacement: g(r, 'repl'), notes: g(r, 'notes'), lastShow: g(r, 'lastShow') }));
}

function setItems(items) {
  allItems = items.map((it, idx) => Object.assign({}, it, { _idx: idx, status: it.status === 'OUT' ? 'OUT' : 'IN' }));
  const sel = document.getElementById('cat-filter'), cur = sel.value;
  const cats = [...new Set(allItems.map(i => i.category).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">All categories</option>' + cats.map(c => `<option>${esc(c)}</option>`).join('');
  if (cats.includes(cur)) sel.value = cur;
  loadedAt = Date.now();
  paintStaff(); render(); stamp();
}
function loadData(quiet) {
  if (!quiet) document.getElementById('results').innerHTML = allItems.length ? document.getElementById('results').innerHTML : '<div class="message"><p>Loading inventory...</p></div>';
  const key = staffKey();
  getJSON(INV_URL + '?action=catalog' + (key ? '&key=' + encodeURIComponent(key) : '') + '&_=' + Date.now(), d => {
    if (!d || !d.success) return loadCsv();
    staff = !!d.staff;
    if (key && !staff) { try { localStorage.removeItem('mmt_staff_key'); } catch (e) {} }   // PIN changed
    settings = d.settings || settings; source = 'live';
    setItems(d.items || []);
  }, loadCsv);
}
function loadCsv() {
  fetch(CSV_URL + '&_=' + Date.now()).then(r => r.text()).then(t => {
    let items = parseCSV(t);
    staff = false; source = 'copy';
    // Public view: only what renters may see.
    items = items.map(i => ({ assetId: i.assetId, tagId: i.tagId, name: i.name, quantity: i.quantity, photo: i.photo, category: i.category,
      subcategory: i.subcategory, rental: settings.showRental ? i.rental : '' }));
    setItems(items);
  }).catch(() => {
    if (!allItems.length) document.getElementById('results').innerHTML = '<div class="message"><p style="color:#c0392b;">Could not load the inventory. Check the connection and tap Refresh.</p></div>';
  });
}
function stamp() {
  const el = document.getElementById('updated'); if (!el || !loadedAt) return;
  const m = Math.round((Date.now() - loadedAt) / 60000);
  el.textContent = (source === 'live' ? 'Live from the inventory' : 'From the published copy (can lag a few minutes)') + ' · updated ' + (m < 1 ? 'just now' : m + ' min ago');
}
setInterval(() => { stamp(); if (document.visibilityState === 'visible' && Date.now() - loadedAt > REFRESH_MS) loadData(true); }, 15000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - loadedAt > 15000) loadData(true); });

// ── Staff ───────────────────────────────────────────────────────────────────
function paintStaff() {
  document.body.classList.toggle('is-staff', staff);
  const box = document.getElementById('staff-box');
  box.innerHTML = staff
    ? `<span style="font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:#ece9fb;color:#3c3489;">Staff view</span>
       <label style="display:flex;align-items:center;gap:6px;font-size:13px;padding:6px 10px;border:1px solid var(--border);border-radius:99px;background:var(--surface);cursor:pointer;">
         <input type="checkbox" ${settings.showRental ? 'checked' : ''} onchange="setShowRental(this.checked)" style="width:16px;height:16px;"> Show rental prices to the public</label>
       <button class="btn btn-ghost" onclick="signOut()">Sign out</button>`
    // The public see no sign-in. Staff get in by signing in to the dashboard
    // on this device, or by adding ?staff to the address.
    : (/[?&#]staff\b/.test(location.search + location.hash) ? `<button class="btn btn-ghost" onclick="openPin()">Staff sign in</button>` : '');
}
function openPin() { document.getElementById('pin-err').textContent = ''; document.getElementById('pin-input').value = ''; document.getElementById('pin-overlay').style.display = 'flex'; setTimeout(() => document.getElementById('pin-input').focus(), 50); }
function closePin(e) { if (e && e.target !== document.getElementById('pin-overlay')) return; document.getElementById('pin-overlay').style.display = 'none'; }
function submitPin() {
  const pin = document.getElementById('pin-input').value.trim();
  if (!pin) return;
  document.getElementById('pin-err').textContent = 'Checking…';
  // The script checks the PIN; it isn't kept in this page.
  getJSON(INV_URL + '?action=catalog&key=' + encodeURIComponent(pin) + '&_=' + Date.now(), d => {
    if (d && d.success && d.staff) {
      try { localStorage.setItem('mmt_staff_key', pin); } catch (e) {}
      staff = true; settings = d.settings || settings; source = 'live';
      document.getElementById('pin-overlay').style.display = 'none';
      setItems(d.items || []);
    } else document.getElementById('pin-err').textContent = 'That PIN didn’t work.';
  }, () => { document.getElementById('pin-err').textContent = 'Could not reach the inventory. Try again.'; });
}
function signOut() { try { localStorage.removeItem('mmt_staff_key'); } catch (e) {} staff = false; loadData(); }
function setShowRental(on) {
  const key = staffKey();
  fetch(INV_URL, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'catalogSet', key, showRental: !!on }) })
    .then(r => r.json()).then(d => {
      if (!d || !d.success) throw new Error((d && d.error) || 'Not saved');
      settings = d.settings || settings; paintStaff(); render();
    }).catch(() => { alert('Could not save that setting. Try again.'); paintStaff(); });
}

// ── Showing it ──────────────────────────────────────────────────────────────
function fmtDate(s) {
  if (!s) return '';
  const d = new Date(/^\d{4}-\d{2}-\d{2}$/.test(s) ? s + 'T12:00:00' : s);
  return isNaN(d) ? s : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function statusChip(i) {
  if (!staff) return '';
  return i.status === 'OUT'
    ? `<span style="display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:#fde8d7;color:#8a3b0b;">Out${i.dueBack ? ' · back ' + esc(fmtDate(i.dueBack)) : ''}</span>`
    : `<span style="display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:#dcf2e3;color:#1d6b39;">Available</span>`;
}
const money = v => { const n = String(v || '').replace(/^\$/, '').trim(); return n ? '$' + esc(n) : ''; };
const showPrice = i => (staff || settings.showRental) && i.rental;
function setView(v) {
  view = v;
  document.getElementById('grid-btn').classList.toggle('active', v === 'grid');
  document.getElementById('list-btn').classList.toggle('active', v === 'list');
  render();
}
const PHOTO_NONE = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" style="width:32px;height:32px;opacity:0.3;" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>';
function openModal(idx) {
  const i = allItems[idx]; if (!i) return;
  document.getElementById('modal-name').textContent = i.name;
  document.getElementById('modal-badge').innerHTML = statusChip(i);
  modalPhotos = (i.photos && i.photos.length) ? i.photos : (i.photo ? [{ url: i.photo }] : []);
  modalName = i.name;
  document.getElementById('modal-thumbs').innerHTML = modalPhotos.length > 1
    ? modalPhotos.map((p, k) => `<button aria-label="Photo ${k + 1}" onclick="showModalPhoto(${k})"><img src="${esc(driveThumb(p.url, 160))}" alt="" loading="lazy" /></button>`).join('') : '';
  showModalPhoto(0);
  const f = (label, val, mono) => `<div class="mf"><div class="mf-label">${label}</div><div class="mf-val${mono ? ' mono' : ''}">${val || '—'}</div></div>`;
  let g = f('Tag ID', esc(i.tagId), true) + f('Category', esc(i.category)) + f('Subcategory', esc(i.subcategory)) + f('Quantity', esc(i.quantity || '1'));
  if (showPrice(i)) g += f('Rental rate', money(i.rental) + ' per week');
  if (staff) g += f('Storage location', esc(i.location)) + f('Current show', esc(i.currentShow) || (i.lastShow ? 'last: ' + esc(i.lastShow) : '')) + f('Replacement value', money(i.replacement));
  document.getElementById('modal-grid').innerHTML = g;
  document.getElementById('modal-staff').innerHTML = staff
    ? `<hr class="modal-divider" /><div class="mf"><div class="mf-label">Notes</div><div class="mf-val" style="font-size:13px;color:var(--text-muted);font-weight:400;white-space:pre-line;">${esc(i.notes) || 'No notes on file.'}</div></div>`
    : '';
  document.getElementById('modal-overlay').style.display = 'flex';
}
let modalPhotos = [], modalName = '';
function showModalPhoto(k) {
  const p = modalPhotos[k];
  document.getElementById('modal-img').innerHTML = p
    ? `<img src="${esc(driveThumb(p.url, 800))}" alt="${esc(modalName)}" style="width:100%;height:260px;object-fit:cover;" />`
    : `${PHOTO_NONE}<span style="font-size:13px;">No photo yet</span>`;
  document.querySelectorAll('#modal-thumbs button').forEach((b, n) => b.classList.toggle('on', n === k));
  document.getElementById('modal-pnote').textContent = staff && p && p.note ? p.note : '';   // photo notes are staff only
}
function closeModal(e) { if (e && e.target !== document.getElementById('modal-overlay')) return; document.getElementById('modal-overlay').style.display = 'none'; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closePin(); } });

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const cat = document.getElementById('cat-filter').value;
  const status = document.getElementById('status-filter').value;
  const filtered = allItems.filter(i =>
    (!q || [i.name, i.tagId, i.assetId, i.category, i.subcategory, staff ? i.location : '', staff ? i.currentShow : ''].some(f => String(f || '').toLowerCase().includes(q))) &&
    (!cat || i.category === cat) && (!staff || !status || i.status === status));
  document.getElementById('total-count').textContent = allItems.length;
  document.getElementById('avail-count').textContent = allItems.filter(i => i.status === 'IN').length;
  document.getElementById('out-count').textContent = allItems.filter(i => i.status === 'OUT').length;
  document.getElementById('cat-count').textContent = [...new Set(allItems.map(i => i.category).filter(Boolean))].length;
  const box = document.getElementById('results');
  if (!allItems.length) { box.innerHTML = '<div class="message"><p>No items in the inventory yet.</p></div>'; return; }
  if (!filtered.length) { box.innerHTML = '<div class="message"><p>No items match your filters.</p></div>'; return; }
  const img = (i, w) => i.photo ? `<img src="${esc(driveThumb(i.photo, w))}" alt="${esc(i.name)}" loading="lazy" />` : PHOTO_NONE;
  if (view === 'grid') {
    box.innerHTML = '<div class="grid">' + filtered.map(i => `<div class="card" onclick="openModal(${i._idx})" style="cursor:pointer;">
        <div class="card-img">${img(i, 400)}</div>
        <div class="card-body">
          <div class="card-top"><span class="card-name">${esc(i.name)}</span></div>
          <span class="cat-pill">${esc(i.category)}${i.subcategory ? ' · ' + esc(i.subcategory) : ''}${+i.quantity > 1 ? ' · ×' + esc(i.quantity) : ''}</span>
          <div class="card-footer">
            <div>${showPrice(i) ? `<div class="rental-label">Rental rate</div><div class="rental-val">${money(i.rental)}<span style="font-size:12px;font-weight:500;opacity:.7;"> / week</span></div>` : ''}${staff && i.location ? `<div class="rental-label" style="margin-top:2px;">${esc(i.location)}</div>` : ''}</div>
            ${statusChip(i)}
          </div>
        </div>
      </div>`).join('') + '</div>';
  } else {
    box.innerHTML = '<div class="list">' + filtered.map(i => `<div class="list-row" onclick="openModal(${i._idx})" style="cursor:pointer;">
        <div class="list-thumb">${i.photo ? img(i, 120) : ''}</div>
        <span class="list-name">${esc(i.name)}</span>
        <span class="list-cat"><span class="cat-pill">${esc(i.category)}</span></span>
        <span class="list-loc">${staff ? esc(i.location || '—') : ''}</span>
        <span class="list-price">${showPrice(i) ? money(i.rental) + ' / week' : ''}</span>
        ${statusChip(i)}
      </div>`).join('') + '</div>';
  }
}

paintStaff();
loadData();
</script>
<div id="build-tag" style="position:fixed;bottom:4px;right:8px;font-size:11px;color:#999;z-index:999;pointer-events:none;background:white;padding:2px 6px;border-radius:4px;">10.16 v6</div>
</body>
</html>
