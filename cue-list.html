</script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   MMT Cue Sheet — read-only companion to the Scripts tab in app.html

   Laid out to match exportCueSheet(): four columns (CUE / ACTION / CUE LINE /
   NOTES), scene markers as dividers, page number travelling with each cue,
   zebra banding, and the crop used only as a fallback where no cue line was
   typed. Same data, same reading order, on a screen instead of on paper.

   Data comes from the Apps Script backend (listScripts / getCueData), not
   localStorage, so it works on a device that has never opened the dashboard.
   This page never writes to the Sheet. No saveCueData, ever.
   ═══════════════════════════════════════════════════════════════════════════ */

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzVONJuSlGzl04FZCzd3h45V2AsKC3HkqI6eeaujMetaDGkeGctL9IolMkJNBeJA7BaBg/exec';
const CORRECT_PIN = '1483';
const POLL_MS = 15000;

const SCENE_TYPE_ID = 'scene';
const SHIFT_TYPE_ID = 'shift';
const DEFAULT_CUE_TYPES = [
  { id:'lx',       name:'LX',       color:'#e74c3c' },
  { id:'sfx',      name:'SFX',      color:'#3498db' },
  { id:'fly',      name:'FLY',      color:'#2ecc71' },
  { id:'spot',     name:'SPOT',     color:'#f1c40f' },
  { id:'spot_out', name:'SPOT OUT', color:'#e67e22' },
  { id:'shift',    name:'SHIFT',    color:'#34495e' },
  { id:'scene',    name:'SCENE',    color:'#8e44ad' },
];
const RETIRED_CUE_TYPE_IDS = ['intermission'];

let cueTypes    = DEFAULT_CUE_TYPES.slice();
let cues        = [];
let annotations = {};
let scripts     = [];
let scriptId    = null;
let scriptName  = '';
let activeType  = null;
let query       = '';
let presets     = {};
let view        = 'cues';
let activeWho   = null;
let lastHash    = '';
let pendingScroll = null;
let expanded    = {};   // per-cue override; set changes default to open
let revealed    = {};   // per-cue "show this one photo" while photos are off
let showPhotos  = true;
let lastSig     = {};
let changedIds  = new Set();
let lastOk      = 0;
let pollTimer   = null;
let loadedRev   = null;   // _rev of the copy currently on screen
let wakeLock    = null;
let firstPaint  = true;

const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

const isScene = c => c && c.type === SCENE_TYPE_ID;

function lsGet(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

function jsonp(url, onSuccess, onError, timeoutMs){
  const cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random()*1e6);
  const script = document.createElement('script');
  let done = false;
  const timeout = setTimeout(() => { cleanup(); onError && onError('Timeout'); }, timeoutMs || 15000);
  window[cb] = data => { cleanup(); onSuccess(data); };
  function cleanup(){
    if (done) return;
    done = true;
    clearTimeout(timeout);
    delete window[cb];
    if (script.parentNode) script.parentNode.removeChild(script);
  }
  script.onerror = () => { cleanup(); onError && onError('Script load error'); };
  script.src = url + (url.indexOf('?') === -1 ? '?' : '&') + 'callback=' + cb;
  document.head.appendChild(script);
}

// ── PIN — same behaviour as app.html ────────────────────────────────────────
let pinEntry = '';
function updateDots(){
  for (let i = 0; i < 4; i++){
    const d = document.getElementById('d' + i);
    if (d) d.classList.toggle('filled', i < pinEntry.length);
  }
}
function pinPress(val){
  if (val === 'back'){ pinEntry = pinEntry.slice(0,-1); updateDots(); return; }
  if (pinEntry.length >= 4) return;
  pinEntry += val;
  updateDots();
  if (pinEntry.length === 4) setTimeout(checkPin, 120);
}
function pinClear(){ pinEntry = ''; updateDots(); document.getElementById('pin-error').textContent = ''; }
function checkPin(){
  if (pinEntry === CORRECT_PIN){ lsSet('mmt_cuelist_ok','1'); unlock(); }
  else {
    document.getElementById('pin-error').textContent = 'Incorrect PIN';
    pinEntry = ''; updateDots();
    setTimeout(() => { document.getElementById('pin-error').textContent = ''; }, 2000);
  }
}
function unlock(){
  document.getElementById('pin-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  start();
}

// ── Boot ────────────────────────────────────────────────────────────────────
function start(){
  setSize(parseInt(lsGet('mmt_cuelist_size','13'),10) || 13);
  setPhotos(lsGet('mmt_cuelist_photos','1') !== '0');
  applyTheme(currentTheme(), false);
  // Deep links from the dashboard's Show Hub:
  //   ?script=<driveId>   open that script rather than the last one used here
  //   &name=<label>       show name to display until the real one loads
  //   &type=shift         open filtered to set changes (the set change plot)
  //   &view=presets       open the Before House sheet
  // Anything absent falls back to what this page had remembered.
  let linkScript = null, linkName = '', linkType = null, linkView = null;
  try {
    const q = new URLSearchParams(location.search);
    linkScript = q.get('script');
    linkName   = q.get('name') || '';
    linkType   = q.get('type');
    linkView   = q.get('view');
  } catch(e) {}

  const savedView = linkView || lsGet('mmt_cuelist_view','cues');
  if (savedView === 'presets') setView('presets');

  if (linkScript) {
    scriptId   = linkScript;
    scriptName = linkName || lsGet('mmt_cuelist_scriptname', '');
    // Remember it, so a reload or a later visit without the link still lands here.
    try {
      lsSet('mmt_cuelist_script', scriptId);
      if (linkName) lsSet('mmt_cuelist_scriptname', linkName);
    } catch(e) {}
    pendingScroll = 0;
  } else {
    pendingScroll = parseInt(lsGet(scrollKey(), '0'), 10) || 0;
    scriptId   = lsGet('mmt_cuelist_script', null);
    scriptName = lsGet('mmt_cuelist_scriptname', '');
  }

  // Filter straight to set changes when asked. Checked against the real type
  // list so a bad value in the URL just shows everything.
  if (linkType && cueTypes.some(t => t.id === linkType)) activeType = linkType;
  if (scriptName) document.getElementById('show-name').textContent = cleanShowName(scriptName);

  renderCachedIfAny();
  // Edits that never reached the Sheet (connection dropped, tab closed mid-save)
  // are held on this device. Offer them back rather than letting them rot.
  try {
    const draft = getDraft();
    if (draft && draft.moves && Object.keys(draft.moves).length) {
      const n = Object.keys(draft.moves).length;
      const when = new Date(draft.at || Date.now()).toLocaleString('en-US',
        { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
      setTimeout(() => {
        if (confirm('There are unsaved set change edits on this device from ' + when
          + ' (' + n + ' set change' + (n !== 1 ? 's' : '') + ').\n\nOpen them for editing?')) {
          setEditMode(true);
          editBaseline = draft.baseline || {};
          Object.keys(draft.moves).forEach(id => {
            const c = cues.find(x => String(x.id) === String(id));
            if (c) { c.moves = draft.moves[id]; editedCues[id] = true; }
          });
          markDirty(); render();
        } else { clearDraft(); }
      }, 900);
    }
  } catch(e) {}
  loadScripts();
  if (scriptId) fetchCues(true);
  // Spike colours for the chips and the picker; cached, so this is just a refresh.
  spkLoad(() => { if (cues.length) render(); if (moveSheet) renderMoveSheet(); });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible'){ fetchCues(); schedulePoll(); reacquireWake(); }
    else if (pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  });
  window.addEventListener('focus', () => fetchCues());
  window.addEventListener('resize', measureHeader);
  window.addEventListener('orientationchange', () => setTimeout(measureHeader, 250));
  schedulePoll();
  setInterval(tickStatus, 1000);
}

function schedulePoll(){
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(() => { if (document.visibilityState === 'visible') fetchCues(); }, POLL_MS);
}

// Drive de-dupes filenames, so "…Script (1)" is a file artifact, not a title.
function cleanShowName(raw){
  let s = String(raw || '').replace(/\.[a-z0-9]{2,4}$/i, '');
  for (let i = 0; i < 4; i++){
    s = s.replace(/\s*\(\d+\)\s*$/,'')
         .replace(/\s*[-–—]?\s*(final|draft|copy|rev\.?\s*\d*|v\d+)\s*$/i,'')
         .replace(/\s*(script|libretto|pdf)\s*$/i,'');
  }
  return s.trim() || raw || 'Untitled';
}

// ── Data ────────────────────────────────────────────────────────────────────
function loadScripts(){
  jsonp(SCRIPT_URL + '?action=listScripts&_=' + Date.now(), d => {
    if (!d || !d.success || !d.scripts){ renderScriptList('Could not load the script list.'); return; }
    scripts = d.scripts;
    if (!scriptId && scripts.length){
      const newest = scripts.slice().sort((a,b) => new Date(b.date||0) - new Date(a.date||0))[0];
      pickScript(newest.id, newest.name, true);
    }
    renderScriptList();
  }, () => renderScriptList('Could not load the script list.'));
}

function pickScript(id, name, silent){
  scriptId = id; scriptName = name;
  lsSet('mmt_cuelist_script', id);
  lsSet('mmt_cuelist_scriptname', name);
  document.getElementById('show-name').textContent = cleanShowName(name);
  cues = []; annotations = {}; presets = {}; lastSig = {}; expanded = {};
  revealed = {}; activeWho = null; lastHash = ''; firstPaint = true;
  renderCachedIfAny();
  renderScriptList();
  fetchCues(true);
  if (!silent) closeSheet();
}

function fetchCues(showLoading){
  if (!scriptId) return;
  // A refresh landing mid-edit would wipe what's being typed.
  if (editMode || editSaving) return;
  if (showLoading) setStatus('loading…', 'stale');
  jsonp(SCRIPT_URL + '?action=getCueData&scriptId=' + encodeURIComponent(scriptId) + '&_=' + Date.now(),
    d => {
      if (!d || !d.success || !d.cueData){ setStatus('no cue data', 'stale'); render(); return; }
      const hash = JSON.stringify([d.cueData.cues, d.cueData.cueTypes, d.cueData.presets]);
      const same = hash === lastHash;
      applyPayload(d.cueData);
      loadedRev = (d.cueData._rev != null) ? d.cueData._rev : null;
      lastHash = hash;
      try { lsSet('mmt_cuelist_cache_' + scriptId, JSON.stringify(d.cueData)); } catch(e){}
      lastOk = Date.now();
      if (!same) render();
      tickStatus();
    },
    () => setStatus(lastOk ? 'offline — last copy' : 'could not connect', lastOk ? 'stale' : 'dead')
  );
}

function renderCachedIfAny(){
  if (!scriptId) return;
  try {
    const cached = JSON.parse(lsGet('mmt_cuelist_cache_' + scriptId, 'null'));
    if (cached){ applyPayload(cached); render(); setStatus('last saved copy', 'stale'); }
  } catch(e){}
}

function normalizePresets(v){
  const out = {};
  if (v && typeof v === 'object'){
    Object.keys(v).forEach(k => {
      const e = v[k];
      if (!e || typeof e !== 'object') return;
      out[k] = { piece: String(e.piece || k), location: String(e.location || ''),
                 notes: String(e.notes || ''), hidden: !!e.hidden };
    });
  }
  return out;
}

// Every distinct piece used anywhere in the show, first spelling wins — the
// piece list is derived from the plot, not stored, same as in the dashboard.
function allPieces(){
  const seen = new Map();
  cuesInScriptOrder().forEach(c => {
    if (c.type !== SHIFT_TYPE_ID) return;
    (c.moves || []).forEach(m => {
      const v = String(m.piece || '').trim();
      if (!v) return;
      const k = v.toLowerCase();
      if (!seen.has(k)) seen.set(k, v);
    });
  });
  return [...seen.entries()].map(([key, piece]) => ({ key, piece }))
    .sort((a,b) => a.piece.localeCompare(b.piece));
}

// Everyone named on a move, for the who filter.
function allWho(){
  const seen = new Map();
  cues.forEach(c => (c.moves || []).forEach(m => {
    const v = String(m.who || '').trim();
    if (!v) return;
    const k = v.toLowerCase();
    if (!seen.has(k)) seen.set(k, v);
  }));
  return [...seen.values()].sort((a,b) => a.localeCompare(b));
}

function applyPayload(data){
  cueTypes = mergeCueTypes(data.cueTypes);
  const incoming = Array.isArray(data.cues) ? data.cues : [];
  annotations = data.annotations || {};
  presets = normalizePresets(data.presets);

  changedIds = new Set();
  const nextSig = {};
  incoming.forEach(c => {
    const sig = JSON.stringify([c.type, c.number, c.action, c.cueLine, c.notes || c.description, c.page, c.moves]);
    nextSig[c.id] = sig;
    if (!firstPaint && lastSig[c.id] !== sig) changedIds.add(c.id);
  });
  lastSig = nextSig;
  cues = incoming;
  firstPaint = false;
}

function mergeCueTypes(saved){
  const result = (Array.isArray(saved) ? saved : [])
    .filter(t => t && !RETIRED_CUE_TYPE_IDS.includes(t.id));
  DEFAULT_CUE_TYPES.forEach(def => { if (!result.some(t => t.id === def.id)) result.push(def); });
  return result;
}

const typeOf = id => cueTypes.find(t => t.id === id) || { id, name: String(id||'?').toUpperCase(), color:'#999999' };

function cueRectPos(c){
  const a = (annotations[c.page] || []).find(x => x.type === 'cue' && x.cueId === c.id);
  if (!a || !a.rect) return null;
  return { y: a.rect.y, x: a.rect.x };
}
function cuesInScriptOrder(){
  return cues.slice().sort((a,b) => {
    if (a.page !== b.page) return a.page - b.page;
    const pa = cueRectPos(a), pb = cueRectPos(b);
    if (pa && pb){
      if (Math.abs(pa.y - pb.y) > 6) return pa.y - pb.y;
      return pa.x - pb.x;
    }
    if (pa && !pb) return -1;
    if (!pa && pb) return 1;
    return String(a.number||'').localeCompare(String(b.number||''), undefined, { numeric:true });
  });
}

// The chip already names the type, so drop it from the number itself:
// "SPOT OUT 2" -> "2". Same rule the PDF uses.
function shortNumber(c, chipLabel){
  const raw = String(c.number || '');
  const pattern = '^' + String(chipLabel).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*';
  return raw.replace(new RegExp(pattern, 'i'), '') || raw;
}

// ── Filtering ───────────────────────────────────────────────────────────────
function haystack(c){
  const parts = [c.number, c.action, c.cueLine, c.notes || c.description, typeOf(c.type).name, 'p' + c.page, 'pg ' + c.page];
  (c.moves || []).forEach(m => parts.push(m.piece, m.action, m.who, spkMoveText(m, scriptId), m.notes));
  return parts.filter(Boolean).join(' ').toLowerCase();
}
const onMove = (m, who) => String(m.who || '').trim().toLowerCase() === who;

function matches(c){
  if (activeType && c.type !== activeType) return false;
  // A who filter is a question about set changes, so it excludes everything
  // that isn't one rather than silently passing cues with no moves.
  if (activeWho && !(c.moves || []).some(m => onMove(m, activeWho))) return false;
  if (!query) return true;
  const h = haystack(c);
  return query.split(/\s+/).filter(Boolean).every(tok => h.includes(tok));
}

function onSearch(){
  query = document.getElementById('search').value.trim().toLowerCase();
  document.getElementById('search-clear').style.display = query ? 'block' : 'none';
  render();
}
function clearSearch(){
  document.getElementById('search').value = '';
  query = '';
  document.getElementById('search-clear').style.display = 'none';
  render();
}
function setType(id){
  activeType = (activeType === id) ? null : id;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function setWho(who){
  activeWho = (activeWho === who) ? null : who;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function setView(v){
  if (view === v) return;
  saveScroll();
  view = v;
  document.getElementById('tab-cues').classList.toggle('on', v === 'cues');
  document.getElementById('tab-presets').classList.toggle('on', v === 'presets');
  document.getElementById('search').placeholder = v === 'presets'
    ? 'Search pieces, locations, notes…' : 'Search cues, lines, notes…';
  lsSet('mmt_cuelist_view', v);
  pendingScroll = parseInt(lsGet(scrollKey(), '0'), 10) || 0;
  render();
}

// ── Render ──────────────────────────────────────────────────────────────────
function render(){
  renderTypeStrip();
  const isCues = view === 'cues';
  document.getElementById('type-strip').style.display = isCues ? 'flex' : 'none';
  document.getElementById('page-jump').style.display  = isCues ? 'block' : 'none';
  if (!isCues) return renderPresetSheet();

  const el = document.getElementById('sheet-body');
  const title = `<div class="sheet-title">
      <h2>${esc(cleanShowName(scriptName))} — Cue Sheet</h2>
      <div class="upd" id="upd">—</div>
    </div>`;

  if (!cues.length){
    el.innerHTML = title + '<div class="cs-empty"><b>No cues on this script yet.</b>Place cues in the Scripts tab and they appear here.</div>';
    measureHeader(); return;
  }

  const ordered = cuesInScriptOrder();
  const total = cues.filter(c => !isScene(c)).length;

  // Scene markers divide the sheet: each draws a divider row, and every cue
  // after it belongs to that scene until the next one. Anything before the
  // first marker still needs a home.
  const groups = [];
  let current = { label: null, page: null, items: [] };
  ordered.forEach(c => {
    if (isScene(c)){
      if (current.label || current.items.length) groups.push(current);
      current = { label: String(c.number || 'Scene'), page: c.page, items: [] };
    } else {
      current.items.push(c);
    }
  });
  groups.push(current);
  if (groups.length && groups[0].label === null && groups[0].items.length) groups[0].label = 'Top of Show';

  let shown = 0, band = false, body = '', firstBand = true;
  groups.forEach(g => {
    const visible = g.items.filter(matches);
    shown += visible.length;
    if (!visible.length) return;
    if (g.label){
      if (!firstBand) body += '<tr class="scene-gap"><td colspan="5"></td></tr>';
      body += `<tr class="scene"><td colspan="5">${esc(g.label)}${
        g.page != null ? `<span class="scene-pg">p.${esc(g.page)}</span>` : ''}</td></tr>`;
      band = false; firstBand = false;
    }
    visible.forEach(c => { body += cueRow(c, band); band = !band; });
  });

  if (!shown){
    const what = query ? 'Nothing matches that search.' : 'No ' + esc(typeOf(activeType).name) + ' cues.';
    const how  = query ? 'Try fewer words, or clear the type filter.' : 'Tap the type again for all cues.';
    el.innerHTML = title + `<div class="cs-empty"><b>${what}</b>${how}</div>`;
  } else {
    el.innerHTML = title + `<table class="cs">
      <colgroup>
        <col style="width:13%"><col style="width:30%"><col style="width:11%">
        <col class="c-line" style="width:20%"><col style="width:26%">
      </colgroup>
      <thead><tr>${editMode
        ? '<th>Cue</th><th>Move</th><th>Who</th><th class="h-line">Spike</th><th>Note</th>'
        : '<th>Cue</th><th>Action</th><th>Who</th><th class="h-line">Cue Line</th><th>Notes</th>'}</tr></thead>
      <tbody>${body}</tbody>
    </table>
    <div class="sheet-foot"><span>Music Mountain Theatre</span><span>${shown} of ${total} cues</span></div>`;
  }

  document.getElementById('status-count').textContent = shown + ' of ' + total + ' cues ·';
  renderPageJump();
  stampUpdated();
  measureHeader();
  restoreScroll();
}

// "Before house opens" — what's onstage or standing by when the doors open.
// Mirrors the section the set change plot prints: every piece in the show
// appears unless it's been switched off in the dashboard's Presets dialog, and
// a blank location is left visible because it's a gap someone should fill.
function renderPresetSheet(){
  const el = document.getElementById('sheet-body');
  const title = `<div class="sheet-title">
      <h2>${esc(cleanShowName(scriptName))} — Before House Opens</h2>
      <div class="upd" id="upd">—</div>
    </div>`;

  const rows = allPieces()
    .map(({ key, piece }) => ({ ...(presets[key] || {}), piece }))
    .filter(r => !r.hidden)
    .filter(r => {
      if (!query) return true;
      const h = [r.piece, r.location, r.notes].filter(Boolean).join(' ').toLowerCase();
      return query.split(/\s+/).filter(Boolean).every(tok => h.includes(tok));
    });

  if (!rows.length){
    const empty = query
      ? '<b>Nothing matches that search.</b>Try fewer words.'
      : '<b>No pieces yet.</b>Pieces appear here once set changes have moves.';
    el.innerHTML = title + `<div class="cs-empty">${empty}</div>`;
    document.getElementById('status-count').textContent = '';
    stampUpdated(); measureHeader(); return;
  }

  const gaps = rows.filter(r => !String(r.location || '').trim()).length;
  let band = false;
  el.innerHTML = title + `<table class="cs">
    <colgroup><col style="width:26%"><col style="width:34%"><col style="width:40%"></colgroup>
    <thead><tr><th>Piece</th><th>Preset Location</th><th>Notes</th></tr></thead>
    <tbody>
      <tr class="scene"><td colspan="3">Before house opens</td></tr>
      ${rows.map(r => {
        const cls = band ? ' class="band"' : '';
        band = !band;
        const loc = String(r.location || '').trim();
        return `<tr${cls}>
          <td class="mv-piece">${esc(r.piece)}</td>
          <td class="cs-action">${loc ? esc(loc) : '<span class="gap">not set</span>'}</td>
          <td class="cs-notes">${esc(r.notes || '')}</td>
        </tr>`;
      }).join('')}
    </tbody></table>
    <div class="sheet-foot"><span>Music Mountain Theatre</span>
      <span>${rows.length} piece${rows.length !== 1 ? 's' : ''}${gaps ? ' · ' + gaps + ' with no location' : ''}</span></div>`;

  document.getElementById('status-count').textContent =
    rows.length + ' piece' + (rows.length !== 1 ? 's' : '') + ' ·';
  stampUpdated(); measureHeader(); restoreScroll();
}

// ── SPIKE MAP (read side) ────────────────────────────────────────────────────
// The spike tape key lives in its own page (spike-map.html) and one KV blob,
// 'spikemap'. This is the read side: resolve a show's colours, draw a tape
// swatch, and describe a move's spike in words. The same block sits in
// app.html, cue-list.html and spike-map.html's drawing code — keep in step.
//
// A move keeps two things: spikeIds (colours picked from the map, linked, so a
// relabel on the map shows up everywhere) and spike (typed, for one-offs).
const SPK_STYLE_NAMES = { split: 'split corner', tab: 'stacked tab', side: 'side by side' };
let _spkData = null;

function spkData(){
  if (_spkData) return _spkData;
  try { _spkData = JSON.parse(localStorage.getItem('mmt_spike_cache') || 'null'); } catch (e) { _spkData = null; }
  return _spkData || { house: [], shows: {} };
}
function spkLoad(cb){
  jsonp(SCRIPT_URL + '?action=getKV&key=spikemap&_=' + Date.now(), d => {
    if (d && d.value && typeof d.value === 'object') {
      _spkData = d.value;
      try { localStorage.setItem('mmt_spike_cache', JSON.stringify(_spkData)); } catch (e) {}
    }
    if (cb) cb();
  }, () => { if (cb) cb(); });
}
// Every colour a show can see — house colours with this show's changes, then
// its own. Hidden ones are flagged rather than dropped, so a move tagged
// before a colour was hidden still draws.
function spkList(sid){
  const d = spkData();
  const rec = (sid && d.shows && d.shows[sid]) || {};
  const over = rec.over || {};
  const out = (d.house || []).map(h => Object.assign({}, h, over[h.id] || {}, { hidden: !!(over[h.id] && over[h.id].hidden) }));
  (rec.extra || []).forEach(x => out.push(Object.assign({}, x, { hidden: false })));
  return out;
}
function spkFind(sid, id){ return spkList(sid).find(e => e.id === id) || null; }
function spkIsDark(hex){
  const h = String(hex || '#000').replace('#', '');
  const n = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  return (0.299 * parseInt(n.slice(0, 2), 16) + 0.587 * parseInt(n.slice(2, 4), 16) + 0.114 * parseInt(n.slice(4, 6), 16)) < 60;
}
function spkInk(hex){
  const h = String(hex || '#000').replace('#', '');
  const n = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  return (0.299 * parseInt(n.slice(0, 2), 16) + 0.587 * parseInt(n.slice(2, 4), 16) + 0.114 * parseInt(n.slice(4, 6), 16)) > 150 ? '#141414' : '#ffffff';
}
function spkStyle(e){ return e.c2 ? (SPK_STYLE_NAMES[e.style] ? e.style : 'tab') : 'solid'; }
function spkTapeName(e){
  if (!e || !e.c1n) return '';
  const st = spkStyle(e);
  const base = st === 'solid' ? e.c1n : `${e.c1n} + ${e.c2n || '?'}, ${SPK_STYLE_NAMES[st]}`;
  return e.text ? `${base}, marked “${e.text}”` : base;
}
function spkLabel(e){ return (e && (e.label || spkTapeName(e))) || 'Spike'; }
const spkEsc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
// A top-down view of one spiked corner on a black deck.
function spkSVG(e, w, h){
  const A = e.c1 || '#888', B = e.c2 || A;
  const st = spkStyle(e);
  const txt = String(e.text || '').trim();
  const x = 9, y = 7, L = 46, H = 22, t = txt ? 13 : 7;
  const r = (rx, ry, rw, rh, c) => `<rect x="${rx}" y="${ry}" width="${rw}" height="${rh}" fill="${c}"${
    spkIsDark(c) ? ' stroke="rgba(255,255,255,0.45)" stroke-width="0.7"' : ''}/>`;
  let tape;
  if (st === 'split') tape = r(x, y, L, t, A) + r(x, y, 7, H, B);
  else if (st === 'side') tape = txt
    ? r(x, y, L, t, A) + r(x + 4, y + t, L - 4, 4, B) + r(x, y, 4, H, A) + r(x + 4, y + t, 4, H - t, B)
    : r(x, y, L, 4, A) + r(x, y, 4, H, A) + r(x + 4, y + 4, L - 4, 4, B) + r(x + 4, y + 4, 4, H - 4, B);
  else { tape = r(x, y, L, t, A) + r(x, y, 7, H, A); if (st === 'tab') tape += r(x + L - 15, y - 4, 6, t + 8, B); }
  const label = txt ? `<text x="${x + 7 + (L - 7 - (st === 'tab' ? 15 : 0)) / 2}" y="${y + t / 2 + 0.5}" text-anchor="middle"
    dominant-baseline="central" font-family="DM Sans, sans-serif" font-weight="700" font-size="${txt.length > 2 ? 8 : 10}" fill="${spkInk(A)}">${spkEsc(txt)}</text>` : '';
  return `<svg class="spk-tape" width="${w || 32}" height="${h || 16}" viewBox="0 0 64 32" aria-hidden="true">
    <rect x="0" y="0" width="64" height="32" rx="4" fill="#262626"/>${tape}${label}</svg>`;
}
// The spike entries a move points at, in the order they were picked. An id
// whose colour has since been deleted from the map comes back as null.
function spkOfMove(m, sid){
  return (Array.isArray(m && m.spikeIds) ? m.spikeIds : []).map(id => spkFind(sid, id));
}
// Chips for display: tape drawing + label, then anything typed.
function spkChipsHTML(m, sid){
  const chips = spkOfMove(m, sid).map(e => e
    ? `<span class="spk-chip" title="${spkEsc(spkTapeName(e))}">${spkSVG(e, 30, 15)}<span>${spkEsc(spkLabel(e))}</span></span>`
    : `<span class="spk-chip spk-gone">removed spike</span>`).join('');
  return chips + (m && m.spike ? `<span class="spk-typed">${spkEsc(m.spike)}</span>` : '');
}
// The same in words, for spreadsheets and anything else without pictures.
function spkMoveText(m, sid){
  const parts = spkOfMove(m, sid).filter(Boolean).map(e => e.label ? `${e.label} (${spkTapeName(e)})` : spkTapeName(e));
  if (m && m.spike) parts.push(String(m.spike));
  return parts.join('; ');
}
// Picker body: every colour this show uses as a toggle. Hidden colours only
// appear if this move already has them, so nothing silently disappears.
function spkPickerHTML(sid, selected, toggleFn){
  const sel = new Set(selected || []);
  const list = spkList(sid).filter(e => !e.hidden || sel.has(e.id));
  if (!list.length) return `<div class="spk-empty">No spike colors for this show yet.</div>`;
  return `<div class="spk-grid">${list.map(e => `<button type="button" class="spk-opt${sel.has(e.id) ? ' on' : ''}"
      onclick="${toggleFn}('${spkEsc(e.id)}')" aria-pressed="${sel.has(e.id)}">
      ${spkSVG(e, 44, 22)}<span><b>${spkEsc(spkLabel(e))}</b><small>${spkEsc(e.label ? spkTapeName(e) : '')}</small></span></button>`).join('')}</div>`;
}
function spkMapURL(sid, name){
  return 'spike-map.html' + (sid ? '?script=' + encodeURIComponent(sid) + (name ? '&name=' + encodeURIComponent(name) : '') : '');
}
// The colours on a typed-up plot, drawn with jsPDF: a small corner in tape
// colours, outlined so white tape shows on paper.
function spkDrawPDF(doc, e, x, y, w, h){
  const hex = c => { const n = String(c || '#888').replace('#', ''); const f = n.length === 3 ? n.split('').map(ch => ch + ch).join('') : n;
    return [parseInt(f.slice(0, 2), 16), parseInt(f.slice(2, 4), 16), parseInt(f.slice(4, 6), 16)]; };
  const A = hex(e.c1), B = hex(e.c2 || e.c1), st = spkStyle(e);
  const t = Math.max(1.8, h * 0.3);
  const box = (bx, by, bw, bh, c) => { doc.setFillColor(...c); doc.setDrawColor(120, 120, 128); doc.setLineWidth(0.3); doc.rect(bx, by, bw, bh, 'FD'); };
  if (st === 'split') { box(x, y, w, t, A); box(x, y, t, h, B); }
  else if (st === 'side') { const s = t * 0.6; box(x, y, w, s, A); box(x, y, s, h, A); box(x + s, y + s, w - s, s, B); box(x + s, y + s, s, h - s, B); }
  else { box(x, y, w, t, A); box(x, y, t, h, A); if (st === 'tab') box(x + w * 0.62, y - 1.2, t * 0.9, t + 2.4, B); }
}

function cueRow(c, band){
  const t = typeOf(c.type);
  const notes = c.notes || c.description || '';
  const isShift = c.type === SHIFT_TYPE_ID;
  let moves = isShift ? (c.moves || []) : [];
  if (editMode && isShift && !moves.length) moves = [{ piece:'', action:'', who:'', spike:'', notes:'' }];
  const open = (c.id in expanded) ? expanded[c.id] : true;
  const hasMoves = moves.length > 0;

  const useCrop = !c.cueLine && c.lineCrop && !/^data:/.test(c.lineCrop);
  const cropOn = showPhotos || revealed[c.id];
  let lineCell = '';
  if (c.cueLine) lineCell = esc(c.cueLine);
  else if (useCrop && cropOn) {
    lineCell = `<img class="cs-crop" src="${esc(c.lineCrop)}" alt="Script line" loading="lazy"
                     onclick="event.stopPropagation(); this.classList.toggle('zoom');"
                     onerror="this.style.display='none'">`;
  } else if (useCrop) {
    lineCell = `<button class="photo-chip" onclick="event.stopPropagation(); revealPhoto('${esc(c.id)}')">Show line photo</button>`;
  }

  const accent = ` style="--shift-accent:${esc(t.color)}"`;
  const cueCell = `<span class="cs-chip" style="background:${esc(t.color)}">${esc(t.name)}</span><span class="cs-num">${esc(shortNumber(c, t.name))}</span>
      <span class="cs-pg">p.${esc(c.page || '?')}</span>`;

  const rowCls = c2 => {
    const a = [];
    if (band) a.push('band');
    if (changedIds.has(c.id)) a.push('changed');
    if (c2) a.push(c2);
    return a.length ? ` class="${a.join(' ')}"` : '';
  };

  // Non-shift cues: one row, unchanged.
  if (!hasMoves){
    return `<tr${rowCls()} data-page="${esc(c.page || '')}">
      <td>${cueCell}</td>
      <td class="cs-action">${esc(c.action || '')}</td>
      <td class="cs-who"></td>
      <td class="cs-line">${lineCell}</td>
      <td class="cs-notes">${esc(notes)}</td>
    </tr>`;
  }

  // Set changes: the moves ARE the cue, so they become rows of this table
  // rather than a table inside a cell. Same columns, same rules, same borders —
  // which is what the plot export does on paper, and why the nested grid read
  // as something bolted on.
  const toggleAttr = ` onclick="toggle('${esc(c.id)}')"`;
  if (!open){
    return `<tr${rowCls('shift-top shift-only')}${accent} data-page="${esc(c.page || '')}"${toggleAttr}>
      <td>${cueCell}</td>
      <td class="cs-action">${esc(c.action || '')}<span class="moves-tag">${moves.length} move${moves.length !== 1 ? 's' : ''} ▾</span></td>
      <td class="cs-who"></td>
      <td class="cs-line">${lineCell}</td>
      <td class="cs-notes">${esc(notes)}</td>
    </tr>`;
  }

  return moves.map((m, i) => {
    const first = i === 0;
    const last  = i === moves.length - 1;
    const dim   = activeWho && !onMove(m, activeWho) ? ' mv-dim' : '';
    const pos   = (first ? ' shift-top' : '') + (last ? ' shift-end' : '') + dim;
    // who / spike / note share the Notes column; on the first row the cue's own
    // note leads, since it describes the change as a whole.
    const meta = [
      (m.spike || (m.spikeIds || []).length) ? `<span class="mv-spike spk-line">${spkChipsHTML(m, scriptId)}</span>` : '',
      m.notes ? `<span class="mv-note"><span class="mv-label">Note</span>${esc(m.notes)}</span>` : ''
    ].filter(Boolean).join('');

    if (editMode) {
      // Reads like the plot; tapping a move opens it in the sheet at the
      // bottom of the screen. No boxes on the page itself.
      const sel = moveSheet && moveSheet.cueId === String(c.id) && moveSheet.idx === i ? ' mv-sel' : '';
      const blank = !m.piece && !m.action && !m.who && !m.spike && !(m.spikeIds || []).length && !m.notes;
      return `<tr${rowCls('shift-row mv-edit' + pos.replace(' shift-end', '') + sel)}${accent} data-page="${esc(c.page || '')}"
              onclick="openMove('${esc(c.id)}', ${i})">
        <td class="shift-cue">${first ? cueCell : ''}</td>
        <td class="cs-action">${blank
            ? '<span class="mv-empty">Tap to add a move</span>'
            : `<span class="mv-piece">${esc(m.piece || '')}</span>${m.action ? `<span class="mv-act">${esc(m.action)}</span>` : ''}`}</td>
        <td class="cs-who">${esc(m.who || '')}</td>
        <td class="cs-line"><span class="mv-spike spk-line">${spkChipsHTML(m, scriptId)}</span></td>
        <td class="cs-notes">${m.notes ? `<span class="mv-note">${esc(m.notes)}</span>` : ''}</td>
      </tr>` + (last
        ? `<tr${rowCls('shift-row shift-end mv-addrow')}${accent}>
             <td class="shift-cue"></td>
             <td class="cs-action" colspan="4">
               <button class="mv-plus" onclick="event.stopPropagation(); sheetAddMove('${esc(c.id)}')">+ Add move</button>
             </td>
           </tr>` : '');
    }

    return `<tr${rowCls('shift-row' + pos)}${accent} data-page="${esc(c.page || '')}"${toggleAttr}>
      <td class="shift-cue">${first ? cueCell + (moves.length > 1
          ? `<span class="cs-pg">${moves.length} moves</span>` : '') : ''}</td>
      <td class="cs-action"><span class="mv-piece">${esc(m.piece || '')}</span>${
          m.action ? `<span class="mv-act">${esc(m.action)}</span>` : ''}${
          first && c.action ? `<span class="mv-cueact">${esc(c.action)}</span>` : ''}</td>
      <td class="cs-who">${esc(m.who || '')}</td>
      <td class="cs-line">${first ? lineCell : ''}</td>
      <td class="cs-notes">${first && notes ? `<span class="mv-note">${esc(notes)}</span>` : ''}${meta}</td>
    </tr>`;
  }).join('');
}


// ── EDIT MODE ───────────────────────────────────────────────────────────────
// This page is a backstage reference first, so editing is off by default and
// has to be switched on. While it's on, polling stops — a 15-second refresh
// landing mid-edit would wipe what you were typing.
//
// Saving does NOT push this page's whole copy of the show over the Sheet's.
// A day of set changes was lost that way once. Instead it re-reads the Sheet,
// and replaces only the moves of the set changes edited here, and only if
// nobody else has touched those same set changes in the meantime.
let editMode      = false;
let editBaseline  = {};        // cueId -> moves as they were when editing began
let editedCues    = {};        // cueId -> true
let editLoadedRev = null;
let editSaving    = false;

function draftKey(){ return 'mmt_cuelist_draft_' + scriptId; }

function saveDraft(){
  try {
    const out = {};
    Object.keys(editedCues).forEach(id => {
      const c = cues.find(x => String(x.id) === String(id));
      if (c) out[id] = c.moves || [];
    });
    lsSet(draftKey(), JSON.stringify({ at: Date.now(), rev: editLoadedRev, baseline: editBaseline, moves: out }));
  } catch(e) {}
}
function clearDraft(){ try { localStorage.removeItem(draftKey()); } catch(e) {} }
function getDraft(){ try { return JSON.parse(lsGet(draftKey(), 'null')); } catch(e) { return null; } }

function setEditMode(on){
  if (on && !scriptId) { alert('Pick a script first.'); return; }
  if (!on) closeMoveSheet(true);
  editMode = !!on;
  const btn = document.getElementById('edit-btn');
  if (btn){ btn.textContent = editMode ? 'Done' : 'Edit'; btn.classList.toggle('on', editMode); }
  document.body.classList.toggle('editing', editMode);

  if (editMode){
    editBaseline = {};
    editedCues = {};
    editLoadedRev = loadedRev;
    cues.forEach(c => { if (c.type === SHIFT_TYPE_ID) editBaseline[c.id] = JSON.parse(JSON.stringify(c.moves || [])); });
    if (pollTimer){ clearInterval(pollTimer); pollTimer = null; }
    render();
  } else {
    if (Object.keys(editedCues).length) saveMoveEdits();
    else { schedulePoll(); render(); }
  }
}

function mvField(cueId, idx, field, value){
  const c = cues.find(x => String(x.id) === String(cueId));
  if (!c || !c.moves || !c.moves[idx]) return;
  c.moves[idx][field] = value;
  editedCues[cueId] = true;
  saveDraft();
  markDirty();
}

function mvAddRow(cueId){
  const c = cues.find(x => String(x.id) === String(cueId));
  if (!c) return;
  c.moves = c.moves || [];
  c.moves.push({ piece:'', action:'', who:'', spike:'', notes:'' });
  editedCues[cueId] = true;
  saveDraft(); markDirty(); render();
}

function mvDelRow(cueId, idx){
  const c = cues.find(x => String(x.id) === String(cueId));
  if (!c || !c.moves) return;
  const m = c.moves[idx];
  const label = (m && (m.piece || m.action)) || 'this move';
  if (!confirm('Delete ' + label + '?')) return;
  c.moves.splice(idx, 1);
  editedCues[cueId] = true;
  saveDraft(); markDirty(); render();
}

function markDirty(){
  const el = document.getElementById('edit-state');
  if (!el) return;
  const n = Object.keys(editedCues).length;
  el.className = 'edit-state dirty';
  el.textContent = n ? n + ' change' + (n !== 1 ? 's' : '') + ' not saved yet' : '';
  measureHeader();
}

// ── The merge ───────────────────────────────────────────────────────────────
// Pure so it can be tested on its own. Applies our edited moves onto whatever
// the Sheet currently holds, one set change at a time, skipping any that
// someone else has altered since we started editing.
function mergeMoveEdits(fresh, baseline, ours){
  const out = JSON.parse(JSON.stringify(fresh));
  const applied = [], conflicts = [];
  out.cues = out.cues || [];
  Object.keys(ours).forEach(id => {
    const target = out.cues.find(c => String(c.id) === String(id));
    if (!target){ conflicts.push({ id, why: 'the set change no longer exists on the Sheet' }); return; }
    const theirs = JSON.stringify(target.moves || []);
    const base   = JSON.stringify(baseline[id] || []);
    if (theirs !== base){ conflicts.push({ id, why: 'someone else changed this set change' }); return; }
    target.moves = JSON.parse(JSON.stringify(ours[id]));
    applied.push(id);
  });
  return { data: out, applied, conflicts };
}

function saveMoveEdits(){
  if (editSaving) return;
  const ids = Object.keys(editedCues);
  if (!ids.length){ schedulePoll(); render(); return; }
  editSaving = true;

  const el = document.getElementById('edit-state');
  if (el){ el.className = 'edit-state saving'; el.textContent = 'Saving…'; }

  const ours = {};
  ids.forEach(id => {
    const c = cues.find(x => String(x.id) === String(id));
    if (c) ours[id] = JSON.parse(JSON.stringify(c.moves || []));
  });

  jsonp(SCRIPT_URL + '?action=getCueData&scriptId=' + encodeURIComponent(scriptId) + '&_=' + Date.now(), d => {
    if (!d || !d.success || !d.cueData){
      editSaving = false;
      if (el){ el.className = 'edit-state error'; el.textContent = 'Could not reach the Sheet — your edits are kept on this device'; }
      return;
    }
    const { data, applied, conflicts } = mergeMoveEdits(d.cueData, editBaseline, ours);
    data._rev = (d.cueData._rev || 0) + 1;
    data._savedAt = new Date().toISOString();

    fetch(SCRIPT_URL, {
      method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ action:'saveCueData', scriptId, cueData: data })
    }).then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      editSaving = false;
      applied.forEach(id => { delete editedCues[id]; });
      if (conflicts.length){
        // Our version of the clashing changes stays in the draft, so nothing
        // is thrown away — it just isn't pushed over someone else's work.
        if (el){ el.className = 'edit-state error';
          el.textContent = conflicts.length + ' set change' + (conflicts.length !== 1 ? 's' : '') + ' not saved — ' + conflicts[0].why; }
        alert('Saved ' + applied.length + ' set change' + (applied.length !== 1 ? 's' : '') + '.\n\n'
          + conflicts.length + ' could not be saved because ' + conflicts[0].why
          + '. Your version is still on this device — reopen Edit to see it.');
      } else {
        clearDraft();
        if (el){ el.className = 'edit-state saved'; el.textContent = 'Saved'; setTimeout(() => { if (el.textContent === 'Saved') el.textContent = ''; }, 2500); }
        editMode = false;
        const btn = document.getElementById('edit-btn');
        if (btn){ btn.textContent = 'Edit'; btn.classList.remove('on'); }
        document.body.classList.remove('editing');
      }
      loadedRev = data._rev;
      schedulePoll(); render();
    }).catch(() => {
      editSaving = false;
      if (el){ el.className = 'edit-state error'; el.textContent = 'Save failed — your edits are safe on this device, try Done again'; }
    });
  }, () => {
    editSaving = false;
    if (el){ el.className = 'edit-state error'; el.textContent = 'Could not reach the Sheet — your edits are kept on this device'; }
  });
}


// ── MOVE SHEET ──────────────────────────────────────────────────────────────
// One move at a time in a panel at the bottom of the screen, so the plot stays
// readable above it. Every keystroke goes through mvField like the old inline
// boxes did, so drafts, the "not saved yet" count and the safe merge on Done
// all work exactly as before. Nothing takes the cursor until you tap a box.
const MOVE_ACTIONS = ['In', 'Out', 'Set', 'Strike', 'Preset', 'Roll down', 'Fly in', 'Fly out', 'On', 'Off'];
let moveSheet = null;   // { cueId, idx, added }

const sheetCue = () => moveSheet && cues.find(x => String(x.id) === moveSheet.cueId);
const blankMove = m => !m || (!m.piece && !m.action && !m.who && !m.spike && !(m.spikeIds || []).length && !m.notes);

// Every move in script order, for the ‹ › arrows.
function allMoveRefs(){
  const out = [];
  cuesInScriptOrder().forEach(c => {
    if (c.type !== SHIFT_TYPE_ID || !matches(c)) return;
    (c.moves || []).forEach((m, i) => out.push({ cueId: String(c.id), idx: i }));
  });
  return out;
}

// A move the sheet created and nobody typed into isn't a change — drop it, and
// if that leaves the set change as it started, it isn't edited either.
function finalizeSheetMove(){
  if (!moveSheet || !moveSheet.added) return;
  const c = sheetCue();
  if (c && c.moves && blankMove(c.moves[moveSheet.idx])){
    c.moves.splice(moveSheet.idx, 1);
    const base = JSON.stringify(editBaseline[c.id] || []);
    if (JSON.stringify(c.moves) === base){ delete editedCues[c.id]; }
    saveDraft(); markDirty();
  }
}

function openMove(cueId, idx, added){
  if (!editMode) return;
  const id = String(cueId);
  if (moveSheet && !(moveSheet.cueId === id && moveSheet.idx === idx)) finalizeSheetMove();
  const c = cues.find(x => String(x.id) === id);
  if (!c) return;
  c.moves = c.moves || [];
  // An empty set change shows a "Tap to add a move" row with nothing behind it.
  if (!c.moves.length){ c.moves.push({ piece:'', action:'', who:'', spike:'', notes:'' }); idx = 0; added = true; }
  if (idx >= c.moves.length) idx = c.moves.length - 1;
  moveSheet = { cueId: id, idx, added: !!added };
  render();
  renderMoveSheet();
  document.getElementById('move-sheet').classList.add('open');
  document.body.classList.add('sheet-open');
  requestAnimationFrame(keepRowVisible);
}

function closeMoveSheet(silent){
  if (!moveSheet) return;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  finalizeSheetMove();
  moveSheet = null;
  const el = document.getElementById('move-sheet');
  if (el) el.classList.remove('open');
  document.body.classList.remove('sheet-open');
  if (!silent) render();
}

// Scroll so the move being edited sits above the sheet, not behind it.
function keepRowVisible(){
  const row = document.querySelector('tr.mv-sel');
  const sheet = document.querySelector('#move-sheet .ms-panel');
  if (!row || !sheet) return;
  const r = row.getBoundingClientRect();
  const top = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hdr')) || 0;
  const limit = window.innerHeight - sheet.offsetHeight - 12;
  if (r.bottom > limit) window.scrollBy(0, r.bottom - limit);
  else if (r.top < top + 8) window.scrollBy(0, r.top - top - 8);
}

function sheetStep(dir){
  const refs = allMoveRefs();
  const at = refs.findIndex(r => r.cueId === moveSheet.cueId && r.idx === moveSheet.idx);
  const next = refs[at + dir];
  if (next) openMove(next.cueId, next.idx);
}

function sheetAddMove(cueId){
  if (!editMode) return;
  const c = cues.find(x => String(x.id) === String(cueId));
  if (!c) return;
  if (moveSheet) finalizeSheetMove();
  moveSheet = null;
  c.moves = c.moves || [];
  // A lone blank placeholder is reused rather than stacking another blank.
  if (c.moves.length && blankMove(c.moves[c.moves.length - 1])) return openMove(c.id, c.moves.length - 1, true);
  c.moves.push({ piece:'', action:'', who:'', spike:'', notes:'' });
  openMove(c.id, c.moves.length - 1, true);
}

function sheetDelete(){
  const c = sheetCue();
  if (!c || !c.moves) return;
  const idx = moveSheet.idx;
  const m = c.moves[idx];
  if (moveSheet.added && blankMove(m)) return closeMoveSheet();
  const label = (m && (m.piece || m.action)) || 'this move';
  if (!confirm('Delete ' + label + '?')) return;
  c.moves.splice(idx, 1);
  editedCues[c.id] = true;
  saveDraft(); markDirty();
  moveSheet.added = false;
  if (c.moves.length) openMove(c.id, Math.min(idx, c.moves.length - 1));
  else closeMoveSheet();
}

function sheetField(field, value){
  if (!moveSheet) return;
  const c = sheetCue();
  if (!c || !c.moves || !c.moves[moveSheet.idx]) return;
  mvField(c.id, moveSheet.idx, field, value);
  if (field === 'action') syncActionPills(value);
  if (field === 'who') syncWhoPills(value);
  // Keep the row under the sheet in step without rebuilding the whole table.
  const row = document.querySelector('tr.mv-sel');
  const m = c.moves[moveSheet.idx];
  if (row){
    row.cells[1].innerHTML = blankMove(m) ? '<span class="mv-empty">Tap to add a move</span>'
      : `<span class="mv-piece">${esc(m.piece || '')}</span>${m.action ? `<span class="mv-act">${esc(m.action)}</span>` : ''}`;
    row.cells[2].textContent = m.who || '';
    row.cells[3].innerHTML = `<span class="mv-spike spk-line">${spkChipsHTML(m, scriptId)}</span>`;
    row.cells[4].innerHTML = m.notes ? `<span class="mv-note">${esc(m.notes)}</span>` : '';
  }
}

// Tap a swatch to add or remove that spike colour on this move.
function sheetSpike(id){
  const c = sheetCue();
  if (!c || !c.moves || !c.moves[moveSheet.idx]) return;
  const m = c.moves[moveSheet.idx];
  const cur = Array.isArray(m.spikeIds) ? m.spikeIds.slice() : [];
  const i = cur.indexOf(id);
  if (i >= 0) cur.splice(i, 1); else cur.push(id);
  mvField(c.id, moveSheet.idx, 'spikeIds', cur);
  const box = document.getElementById('ms-spikes');
  if (box) box.innerHTML = spkPickerHTML(scriptId, cur, 'sheetSpike');
  const row = document.querySelector('tr.mv-sel');
  if (row) {
    row.cells[1].innerHTML = blankMove(m) ? '<span class="mv-empty">Tap to add a move</span>'
      : `<span class="mv-piece">${esc(m.piece || '')}</span>${m.action ? `<span class="mv-act">${esc(m.action)}</span>` : ''}`;
    row.cells[3].innerHTML = `<span class="mv-spike spk-line">${spkChipsHTML(m, scriptId)}</span>`;
  }
}

function sheetPick(field, value){
  const input = document.getElementById('ms-' + field);
  if (!input) return;
  // Tapping the one that's already set clears it.
  const v = input.value.trim().toLowerCase() === String(value).toLowerCase() ? '' : value;
  input.value = v;
  sheetField(field, v);
}
function syncActionPills(v){
  const k = String(v || '').trim().toLowerCase();
  document.querySelectorAll('#ms-actions .ms-pill').forEach(b => b.classList.toggle('on', b.dataset.v.toLowerCase() === k));
}
function syncWhoPills(v){
  const k = String(v || '').trim().toLowerCase();
  document.querySelectorAll('#ms-whos .ms-pill').forEach(b => b.classList.toggle('on', b.dataset.v.toLowerCase() === k));
}

function renderMoveSheet(){
  const c = sheetCue();
  if (!c) return;
  const m = c.moves[moveSheet.idx] || {};
  const t = typeOf(c.type);
  const refs = allMoveRefs();
  const at = refs.findIndex(r => r.cueId === moveSheet.cueId && r.idx === moveSheet.idx);
  const pieces = allPieces().map(p => `<option value="${esc(p.piece)}"></option>`).join('');
  const whos = allWho();
  const inp = (field, ph, extra) => `<input id="ms-${field}" class="ms-in${extra || ''}" value="${esc(m[field] || '')}"
      placeholder="${esc(ph)}" autocomplete="off" oninput="sheetField('${field}', this.value)"${field === 'piece' ? ' list="ms-pieces"' : ''}>`;
  const pill = (field, v, on) => `<button type="button" class="ms-pill${on ? ' on' : ''}" data-v="${esc(v)}"
      onclick="sheetPick('${field}', this.dataset.v)">${esc(v)}</button>`;
  const actKey = String(m.action || '').trim().toLowerCase();
  const whoKey = String(m.who || '').trim().toLowerCase();

  document.getElementById('ms-body').innerHTML = `
    <div class="ms-head">
      <span class="cs-chip" style="background:${esc(t.color)}">${esc(t.name)}</span>
      <span class="ms-num">${esc(shortNumber(c, t.name))}</span>
      <span class="ms-of">· move ${moveSheet.idx + 1} of ${c.moves.length} · p.${esc(c.page || '?')}</span>
      <span style="flex:1"></span>
      <button class="ms-icon" aria-label="Previous move" onclick="sheetStep(-1)"${at <= 0 ? ' disabled' : ''}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="ms-icon" aria-label="Next move" onclick="sheetStep(1)"${at < 0 || at >= refs.length - 1 ? ' disabled' : ''}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="ms-grid ms-g2">
      <label class="ms-f"><span>Piece</span>${inp('piece', 'e.g. Main Curtain', ' strong')}</label>
      <label class="ms-f"><span>Action</span>${inp('action', 'e.g. In')}</label>
    </div>
    <datalist id="ms-pieces">${pieces}</datalist>
    <div class="ms-pills" id="ms-actions">${MOVE_ACTIONS.map(v => pill('action', v, v.toLowerCase() === actKey)).join('')}</div>
    <div class="ms-grid ms-g2 ms-even">
      <label class="ms-f"><span>Who</span>${inp('who', 'Who', ' strong')}</label>
      <label class="ms-f"><span>Note</span>${inp('notes', 'Note')}</label>
    </div>
    ${whos.length ? `<div class="ms-pills" id="ms-whos">${whos.map(v => pill('who', v, v.toLowerCase() === whoKey)).join('')}</div>` : ''}
    <div class="ms-spike-head"><span>Spike</span><a href="${spkMapURL(scriptId, scriptName)}" target="_blank" rel="noopener">Edit spike map ›</a></div>
    <div id="ms-spikes">${spkPickerHTML(scriptId, m.spikeIds, 'sheetSpike')}</div>
    <input id="ms-spike" class="ms-in" style="margin:8px 0 6px" value="${esc(m.spike || '')}" placeholder="Other spike, typed (optional)"
      autocomplete="off" oninput="sheetField('spike', this.value)">
    <div class="ms-btns">
      <button class="ms-btn danger" onclick="sheetDelete()">Delete move</button>
      <button class="ms-btn dashed" onclick="sheetAddMove('${esc(c.id)}')">+ Another move</button>
      <span style="flex:1"></span>
      <button class="ms-btn primary" onclick="closeMoveSheet()">Close</button>
    </div>`;
}

function toggle(id){ if (editMode) return; expanded[id] = !expanded[id]; render(); }

function renderTypeStrip(){
  const counts = {};
  cues.forEach(c => { if (!isScene(c)) counts[c.type] = (counts[c.type] || 0) + 1; });
  const total = cues.filter(c => !isScene(c)).length;

  let html = `<button class="type-row${!activeType ? ' on' : ''}" style="${!activeType ? 'background:var(--purple);' : ''}"
      onclick="setType(null)">All <span class="type-n">${total}</span></button>`;

  html += cueTypes
    .filter(t => t.id !== SCENE_TYPE_ID && counts[t.id])
    .map(t => {
      const on = activeType === t.id;
      return `<button class="type-row${on ? ' on' : ''}" style="${on ? 'background:' + esc(t.color) + ';' : ''}"
        onclick="setType('${esc(t.id)}')">
        <span class="type-color" style="background:${esc(t.color)}"></span><span class="lbl">${esc(t.name)}</span>
        <span class="type-n">${counts[t.id]}</span></button>`;
    }).join('');

  document.getElementById('type-strip').innerHTML = html + whoChipsHTML();
}

function whoChipsHTML(){
  const who = allWho();
  if (!who.length) return '';
  return '<span class="strip-div"></span><span class="strip-label">Who</span>' + who.map(w => {
    const key = w.toLowerCase();
    const on = activeWho === key;
    const n = cues.filter(c => (c.moves || []).some(m => onMove(m, key))).length;
    return `<button class="type-row${on ? ' on' : ''}" style="${on ? 'background:var(--purple);' : ''}"
      onclick="setWho('${esc(key)}')"><span class="lbl">${esc(w)}</span> <span class="type-n">${n}</span></button>`;
  }).join('');
}

function renderPageJump(){
  const sel = document.getElementById('page-jump');
  const pages = [...new Set(cues.filter(c => !isScene(c)).map(c => c.page))]
    .filter(p => p != null).sort((a,b) => a - b);
  const cur = sel.value;
  sel.innerHTML = '<option value="">Page…</option>' +
    pages.map(p => `<option value="${esc(p)}">p. ${esc(p)}</option>`).join('');
  if (pages.map(String).includes(cur)) sel.value = cur;
}

// scrollIntoView would tuck the row under the sticky toolbar, so offset by the
// measured header height.
function jumpToPage(p){
  if (!p) return;
  const row = document.querySelector('tr[data-page="' + CSS.escape(String(p)) + '"]');
  if (!row) return;
  const hdr = document.querySelector('header');
  const off = (hdr ? hdr.offsetHeight : 0) + 8;
  window.scrollTo({ top: row.getBoundingClientRect().top + window.scrollY - off, behavior: 'smooth' });
}

// ── Scroll memory ───────────────────────────────────────────────────────────
// Forty cues into Act 2, losing your place to a refresh or an app-switch is the
// difference between glancing and hunting. Kept per script and per view.
function scrollKey(){ return 'mmt_cuelist_scroll_' + (scriptId || 'none') + '_' + view; }
let scrollTimer = null;
function saveScroll(){ lsSet(scrollKey(), String(Math.round(window.scrollY))); }
window.addEventListener('scroll', () => {
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(saveScroll, 400);
}, { passive: true });
window.addEventListener('pagehide', saveScroll);

// Only ever restores a position that was explicitly queued (boot or a view
// switch) — never on a poll, which would yank the page while it's being read.
function restoreScroll(){
  if (pendingScroll == null) return;
  const y = pendingScroll;
  pendingScroll = null;
  if (!y) return;
  requestAnimationFrame(() => window.scrollTo(0, y));
}

function renderScriptList(err){
  const el = document.getElementById('script-list');
  if (err){ el.innerHTML = `<div class="note">${esc(err)}</div>`; return; }
  if (!scripts.length){ el.innerHTML = '<div class="note">No saved scripts yet.</div>'; return; }
  el.innerHTML = scripts.map(s => `
    <button class="script-opt${s.id === scriptId ? ' sel' : ''}"
            onclick="pickScript('${esc(s.id)}','${esc(String(s.name).replace(/'/g,"\\'"))}')">
      <span class="nm">${esc(cleanShowName(s.name))}</span>
      <span class="dt">${esc(s.date || '')}</span>
    </button>`).join('');
}

// ── Status ──────────────────────────────────────────────────────────────────
function setStatus(text, cls){
  document.getElementById('status').textContent = text;
  document.getElementById('pulse').className = 'pulse' + (cls ? ' ' + cls : '');
}
function stampUpdated(){
  const el = document.getElementById('upd');
  if (!el) return;
  const d = lastOk ? new Date(lastOk) : new Date();
  el.textContent = 'Updated ' +
    d.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' }) +
    ' at ' + d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
}
function tickStatus(){
  if (!lastOk) return;
  const s = Math.round((Date.now() - lastOk) / 1000);
  if (s < 5)       setStatus('live', '');
  else if (s < 90) setStatus('updated ' + s + 's ago', '');
  else             setStatus('updated ' + Math.round(s/60) + 'm ago', 'stale');
}

// Column headers stick below the toolbar, whose height changes with text size,
// chip wrapping and the iPad's safe area — so measure it rather than guess.
function measureHeader(){
  const h = document.querySelector('header');
  if (h) document.documentElement.style.setProperty('--hdr', h.offsetHeight + 'px');
}

// Crops are only a fallback for cues with no typed line, but on a script that
// leans on them they dominate the sheet. Off, each one collapses to a chip that
// reveals just that photo — so a single line can be checked without the rest
// of the page turning back into a contact sheet.
function setPhotos(on){
  showPhotos = !!on;
  lsSet('mmt_cuelist_photos', on ? '1' : '0');
  // Cleared in both directions: individually revealed photos have to collapse
  // when you hide, or "hide all" leaves the ones you'd opened still showing.
  revealed = {};
  document.querySelectorAll('#photo-row button').forEach(b =>
    b.classList.toggle('on', (b.dataset.ph === '1') === showPhotos));
  const btn = document.getElementById('photo-btn');
  if (btn){
    btn.classList.toggle('primary', showPhotos);
    btn.textContent = showPhotos ? 'Photos ✓' : 'Photos';
  }
  render();
}
function revealPhoto(id){ revealed[id] = true; render(); }

function setSize(px){
  document.documentElement.style.setProperty('--ct-fs', px + 'px');
  lsSet('mmt_cuelist_size', String(px));
  document.querySelectorAll('#size-row button').forEach(b =>
    b.classList.toggle('on', parseInt(b.dataset.sz,10) === px));
  measureHeader();
}

// A backstage iPad shouldn't sleep between cues.
async function toggleAwake(){
  const btn = document.getElementById('awake-btn');
  if (wakeLock){
    try { await wakeLock.release(); } catch(e){}
    wakeLock = null; btn.classList.remove('primary'); btn.textContent = 'Awake';
    return;
  }
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => {
      wakeLock = null; btn.classList.remove('primary'); btn.textContent = 'Awake';
    });
    btn.classList.add('primary'); btn.textContent = 'Awake ✓';
  } catch(e){
    btn.textContent = 'No';
    setTimeout(() => { btn.textContent = 'Awake'; }, 1500);
  }
}
async function reacquireWake(){
  const btn = document.getElementById('awake-btn');
  if (!btn.classList.contains('primary') || wakeLock) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
}

// Same shape as toggleDarkMode() in app.html, down to the mmt_theme key — so a
// device that has the dashboard set to dark opens this page dark too.
const THEMES = ['light', 'dark', 'red'];
const THEME_ICON = { light: '☀️', dark: '🌙', red: '🔴' };

function applyTheme(t, persist){
  if (THEMES.indexOf(t) === -1) t = 'light';
  document.documentElement.setAttribute('data-theme', t === 'light' ? '' : t);
  const btn = document.getElementById('theme-toggle');
  if (btn) btn.textContent = THEME_ICON[t];
  document.querySelectorAll('#theme-row button').forEach(b => b.classList.toggle('on', b.dataset.th === t));
  if (persist !== false){
    lsSet('mmt_cuelist_theme', t);
    // Keep the dashboard in step for the two themes it knows about; Red is
    // this page's own, so it leaves mmt_theme alone rather than writing a
    // value app.html would read as light.
    if (t !== 'red') { try { localStorage.setItem('mmt_theme', t); } catch(e){} }
  }
}
function currentTheme(){
  const own = lsGet('mmt_cuelist_theme', '');
  if (THEMES.indexOf(own) !== -1) return own;
  return lsGet('mmt_theme','') === 'dark' ? 'dark' : 'light';   // follow the dashboard
}
function toggleDarkMode(){
  applyTheme(THEMES[(THEMES.indexOf(currentTheme()) + 1) % THEMES.length]);
}

function openSheet(){ document.getElementById('settings').classList.add('open'); }
function closeSheet(){ document.getElementById('settings').classList.remove('open'); }
function openSpikeMap(){
  const q = scriptId ? '?script=' + encodeURIComponent(scriptId) + (scriptName ? '&name=' + encodeURIComponent(scriptName) : '') : '';
  window.open('spike-map.html' + q, '_blank');
}

document.addEventListener('keydown', e => {
  if (document.getElementById('pin-screen').style.display === 'none') return;
  if (e.key >= '0' && e.key <= '9') pinPress(e.key);
  else if (e.key === 'Backspace') pinPress('back');
});

applyTheme(currentTheme(), false);
if (lsGet('mmt_cuelist_ok','') === '1') unlock(); else updateDots();
</script>
