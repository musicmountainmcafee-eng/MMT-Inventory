  for (let i = 1; i <= totalPages; i++) {
    doc.setPage(i);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(150,150,160);
    doc.text('Page ' + i + ' of ' + totalPages, M + TABLE_W, 52, { align: 'right' });
  }

  const safe = showName.replace(/[^a-z0-9]+/gi, '_').replace(/^_|_$/g, '');
  doc.save(safe + '_Set_Changes.pdf');
  toast('Set change plot exported');
}

// ── SHARED EXPORT HELPERS ────────────────────────────────────────────────────
// The header reads off the uploaded script's filename, which carries junk the
// audience for these documents doesn't care about: "The Will Rogers Follies
// Script (1)" is a Drive de-duplication artifact, not a show title. Strip the
// extension, any trailing "(2)", and the words that describe the file rather
// than the production. Looped because they stack — "…Script (1).pdf".
// cleanShowName: the cue sheet has its own (same rules).

// "SCENE CHANGE 12" -> "12". Falls back to the whole label so a change named
// something without digits still exports something.
function changeShortNum(v) {
  const m = String(v || '').match(/(\d+[A-Za-z.]*)\s*$/);
  return m ? m[1] : String(v || '').trim();
}

// ── SET CHANGE PLOT → SPREADSHEET EXPORT ─────────────────────────────────────
// The same document as the printed plot — same columns, same scene bars, same
// block rules and shading, same act-per-page breaks — but as cells you can edit
// after it leaves the dashboard. Deliberately mirrors exportSetChangePlot rather
// than flattening to a database table: the plot's structure IS the information,
// and a change that reads as one block on paper has to read as one block here.

// Grouped exactly the way the PDF groups it: one section per scene marker
// (including scenes with no changes yet — an empty scene bar on the page is how
// you see the gap), one block per SHIFT cue, one row per move.
function setChangeSections() {
  const ordered = cuesInScriptOrder();
  const SCENE_LABELS = sceneLabels();
  const sections = [];
  let cur = null;

  ordered.forEach(c => {
    if (isSceneCue(c)) {
      cur = { label: SCENE_LABELS[c.id] || c.number || '', blocks: [] };
      sections.push(cur);
      return;
    }
    if (c.type !== SHIFT_TYPE_ID) return;   // LX/SFX/FLY belong on the cue sheet
    // Changes placed above the first scene marker still need somewhere to live.
    if (!cur) { cur = { label: '', blocks: [] }; sections.push(cur); }

    // A change with nothing entered yet still exports, so a blank block in the
    // sheet tells you it needs filling rather than silently vanishing.
    const moves = (c.moves && c.moves.length) ? c.moves : [{}];
    cur.blocks.push(moves.map((m, i) => ({
      // Number, cue line and page belong to the change, not the move, so they
      // print once at the top of the block — same as the PDF.
      num:    i === 0 ? changeShortNum(c.number) : '',
      // m.trigger only survives on data a device hasn't migrated yet.
      cue:    String(m.trigger || (i === 0 ? (c.cueLine || '') : '')),
      pg:     i === 0 ? String(c.page || '') : '',
      piece:  String(m.piece  || ''),
      action: String(m.action || ''),
      who:    String(m.who    || ''),
      spike:  spkMoveText(m, showId),
      notes:  String(m.notes  || '')
    })));
  });
  return sections;
}

// Every piece in the show and where it lives at top of show, unless it's been
// turned off in the Presets dialog. A blank location is a gap someone should
// fill, so it exports rather than being hidden.
function presetRowData() {
  return allPieces()
    .map(({ key, piece }) => ({ ...(presets[key] || {}), piece }))
    .filter(r => !r.hidden)
    .map(r => ({ piece: String(r.piece || ''), location: String(r.location || ''), spike: spkMoveText(r, showId), notes: String(r.notes || '') }));
}

// Act number off the front of a scene name: "2-1" or "Act 2, Scene 1". Labels
// with no act in them — PRE-SHOW, INTERMISSION — return null and don't disturb
// the running act, so an intermission bar sits at the end of the act it follows
// instead of triggering a page break of its own.
function actOfSceneLabel(label) {
  const t = String(label || '').trim();
  let m = t.match(/^(\d+)\s*[-–—.:]/);
  if (m) return m[1];
  m = t.match(/^act\s*(\d+)/i);
  return m ? m[1] : null;
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  // Revoking immediately cancels the download in some browsers; give it a beat.
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

// ── On-demand library loaders ───────────────────────────────────────────────
// Anything big and tab-specific loads the first time it's actually needed.

function loadScriptOnce(src, check, cacheRef) {
  if (check()) return Promise.resolve(check());
  if (cacheRef.p) return cacheRef.p;
  cacheRef.p = new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = src;
    el.onload = () => check() ? resolve(check()) : reject(new Error('loaded but missing: ' + src));
    el.onerror = () => { cacheRef.p = null; reject(new Error('failed to load: ' + src)); };
    document.head.appendChild(el);
  });
  return cacheRef.p;
}

// pdf.js — reading and rendering script PDFs (Scripts tab only).
const _pdfjsRef = { p: null };
function loadPdfJS() {
  return loadScriptOnce(
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
    () => (typeof pdfjsLib !== 'undefined' ? pdfjsLib : null),
    _pdfjsRef
  ).then(lib => {
    // Worker path used to be set at the top level; it belongs with the load.
    try { lib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } catch(e) {}
    return lib;
  });
}

// jsPDF — cue sheet, set change plot, and annotated script exports.
const _jspdfRef = { p: null };
function loadJsPDF() {
  return loadScriptOnce(
    'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
    () => (window.jspdf && window.jspdf.jsPDF) || window.jsPDF || null,
    _jspdfRef
  );
}

// Loaded on demand rather than in a <script> tag — it's most of a megabyte and
// this export gets used once a production, not once a session.
let _exceljsPromise = null;
function loadExcelJS() {
  if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
  if (_exceljsPromise) return _exceljsPromise;
  _exceljsPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
    s.onload = () => window.ExcelJS ? resolve(window.ExcelJS) : reject(new Error('ExcelJS missing'));
    s.onerror = () => { _exceljsPromise = null; reject(new Error('ExcelJS failed to load')); };
    document.head.appendChild(s);
  });
  return _exceljsPromise;
}

// Widths are sized to FILL a landscape Letter page rather than to mirror the
// PDF's points. fitToWidth only ever shrinks, never enlarges, so a table
// narrower than the paper just prints narrow — the old 114 units came to 8.7"
// on a 10.2" printable width and left an inch and a half of white down the
// right edge. 132 units lands at 10.04", filling the page with a hair of slack
// so rounding can't trip fitToWidth into scaling the whole sheet down.
//   pixels = round(w * 7) + 5 per column, at 96dpi.
const XLSX_COLS = [
  { key: 'num',    label: '#',      width: 6,  wrap: false, bold: true  },
  { key: 'cue',    label: 'CUE',    width: 25, wrap: true,  bold: false },
  { key: 'pg',     label: 'PG',     width: 6,  wrap: false, bold: false },
  { key: 'piece',  label: 'PIECE',  width: 25, wrap: true,  bold: true  },
  { key: 'action', label: 'ACTION', width: 13, wrap: true,  bold: false },
  { key: 'who',    label: 'WHO',    width: 16, wrap: true,  bold: false },
  // Not 9: ExcelJS treats 9 as its default column width and drops the <col>
  // element entirely, so the column would silently fall back to whatever the
  // reading app defaults to instead of the width set here.
  { key: 'spike',  label: 'SPIKE',  width: 24, wrap: true,  bold: false },
  { key: 'notes',  label: 'NOTES',  width: 27, wrap: true,  bold: false },
];

// Body text. 9.5 came off the PDF, where it sits on a page held at reading
// distance; the spreadsheet gets printed and taped up or carried on the deck,
// so it goes up to 12. Everything else scales off it.
const XL_FS      = 12;    // body cells
const XL_FS_HEAD = 10;    // column headers
const XL_FS_BAR  = 11;    // scene bars

// Same palette as the PDF, as ARGB.
const XL = {
  GRID:   'FFCDCDD6',
  HEAD:   'FFE8E8F0',
  SCENE:  'FF26262E',   // black bar = scene
  RULE:   'FF9696A2',   // grey rule = next change, same scene
  TINT:   'FFEDEEF3',   // every other change, so blocks read as units
  INK:    'FF16161C',
  MUTED:  'FF9696A0',
  HEADFG: 'FF5A5A69'
};

async function exportSetChangeXLSX() {
  const sections = setChangeSections();
  const hasChanges = sections.some(s => s.blocks.length);
  if (!hasChanges) { toast('No set changes to export'); return; }

  const showName = cleanShowName(document.getElementById('show-name').textContent || 'Untitled');
  const safe = showName.replace(/[^a-z0-9]+/gi, '_').replace(/^_|_$/g, '') || 'Show';
  const now = new Date();
  const exportedStr = now.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' })
    + ' at ' + now.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });

  let ExcelJS;
  try {
    toast('Building spreadsheet…');
    ExcelJS = await loadExcelJS();
  } catch (err) {
    // No network, or the CDN is having a day. A CSV still opens in Excel and is
    // still editable — better than sending someone away empty-handed.
    exportSetChangeCSV(sections, safe);
    return;
  }

  const thin   = { style: 'thin',   color: { argb: XL.GRID } };
  const rule   = { style: 'medium', color: { argb: XL.RULE } };
  const titleR = { style: 'medium', color: { argb: XL.INK  } };
  const headB  = { style: 'thin',   color: { argb: 'FF8C8C9B' } };

  const wb = new ExcelJS.Workbook();
  wb.creator = 'MMT Dashboard';
  wb.created = now;

  // Title left, timestamp beneath it, a rule tying the block to the table —
  // then the column header. All four rows repeat at the top of every printed
  // page, the way drawTitle() runs again on each page of the PDF.
  function titleBlock(ws, lastCol, heading, subheading) {
    ws.mergeCells('A1:' + lastCol + '1');
    ws.getCell('A1').value = {
      richText: [
        { font: { bold: true, size: 18, color: { argb: XL.INK }, name: 'Helvetica' }, text: heading },
        { font: { size: 12, color: { argb: XL.MUTED }, name: 'Helvetica' }, text: '   ' + subheading }
      ]
    };
    ws.getRow(1).height = 25;

    ws.mergeCells('A2:' + lastCol + '2');
    ws.getCell('A2').value = 'Updated ' + exportedStr;
    ws.getCell('A2').font = { size: 10, color: { argb: XL.MUTED }, name: 'Helvetica' };
    ws.getRow(2).height = 14;

    // Row 3 is the rule under the title — an empty band carrying a bottom border.
    ws.getRow(3).height = 5;
    for (let i = 1; i <= XLSX_COLS.length; i++) {
      const cell = ws.getRow(3).getCell(i);
      if (cell.col > lastCol.charCodeAt(0) - 64) break;
      cell.border = { bottom: titleR };
    }
  }

  function headerRow(ws, rowNum, labels) {
    const row = ws.getRow(rowNum);
    labels.forEach((label, i) => {
      const cell = row.getCell(i + 1);
      cell.value = label;
      cell.font = { bold: true, size: XL_FS_HEAD, color: { argb: XL.HEADFG }, name: 'Helvetica' };
      cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XL.HEAD } };
      cell.alignment = { vertical: 'middle' };
      cell.border = { top: thin, left: thin, right: thin, bottom: headB };
    });
    row.height = 20;
    return row;
  }

  // A scene bar: black band across the table, white bold caps. Merged, so it
  // stays one band no matter how the columns get resized later.
  function sceneBar(ws, rowNum, label, lastCol) {
    ws.mergeCells('A' + rowNum + ':' + lastCol + rowNum);
    const cell = ws.getCell('A' + rowNum);
    cell.value = String(label || '').toUpperCase();
    cell.font = { bold: true, size: XL_FS_BAR, color: { argb: 'FFFFFFFF' }, name: 'Helvetica' };
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XL.SCENE } };
    cell.alignment = { vertical: 'middle', indent: 1 };
    ws.getRow(rowNum).height = 20;
  }

  // ── Sheet 1: the plot ──────────────────────────────────────────────────────
  const LAST = String.fromCharCode(64 + XLSX_COLS.length);   // 'H'
  const ws = wb.addWorksheet('Set Changes', {
    views: [{ state: 'frozen', ySplit: 4 }],
    pageSetup: {
      orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0,
      printTitlesRow: '1:4',
      margins: { left:0.4, right:0.4, top:0.5, bottom:0.5, header:0.3, footer:0.3 }
    }
  });
  ws.columns = XLSX_COLS.map(c => ({ key: c.key, width: c.width }));
  titleBlock(ws, LAST, showName, 'Set Changes');
  headerRow(ws, 4, XLSX_COLS.map(c => c.label));

  let r = 5;
  let lastAct = null;
  let firstSection = true;

  sections.forEach(sec => {
    const act = actOfSceneLabel(sec.label);
    // Only a move between two KNOWN acts counts. Going from an unnumbered
    // PRE-SHOW into 1-1 isn't an act change and shouldn't burn a page.
    const actBreak = act !== null && lastAct !== null && act !== lastAct;
    if (act !== null) lastAct = act;
    if (actBreak && !firstSection) ws.getRow(r).addPageBreak();

    if (sec.label) { sceneBar(ws, r, sec.label, LAST); r++; }
    firstSection = false;

    let tint = false;
    sec.blocks.forEach((block, bi) => {
      block.forEach((mv, mi) => {
        const row = ws.getRow(r);
        XLSX_COLS.forEach((c, i) => {
          const cell = row.getCell(i + 1);
          cell.value = mv[c.key] || null;
          cell.font = { size: XL_FS, bold: c.bold, name: 'Helvetica' };
          cell.alignment = { vertical: 'top', wrapText: c.wrap };
          cell.border = {
            left: thin, right: thin, bottom: thin,
            // Grey rule between changes inside the same scene; plain grid
            // everywhere else. This is what makes a block read as a block.
            top: (mi === 0 && bi > 0) ? rule : thin
          };
          if (tint) cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XL.TINT } };
        });
        r++;
      });
      tint = !tint;
    });
  });

  // ── Sheet 2: before house opens ────────────────────────────────────────────
  // The PDF gives the presets their own page because they're a standing
  // reference, not part of the running order. Here they get their own tab — a
  // sheet has one set of column widths, and a three-column table doesn't want
  // the plot's eight.
  const presetRows = presetRowData();
  if (presetRows.length) {
    const ps = wb.addWorksheet('Before House Opens', {
      views: [{ state: 'frozen', ySplit: 5 }],
      pageSetup: {
        orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0,
        printTitlesRow: '1:5',
        margins: { left:0.4, right:0.4, top:0.5, bottom:0.5, header:0.3, footer:0.3 }
      }
    });
    ps.columns = [{ key:'piece', width:30 }, { key:'location', width:38 }, { key:'spike', width:32 }, { key:'notes', width:42 }];
    titleBlock(ps, 'D', showName, 'Set Changes');
    sceneBar(ps, 4, 'Before house opens', 'D');
    headerRow(ps, 5, ['PIECE', 'PRESET LOCATION', 'SPIKE', 'NOTES']);

    presetRows.forEach((rec, idx) => {
      const row = ps.getRow(6 + idx);
      ['piece', 'location', 'spike', 'notes'].forEach((k, i) => {
        const cell = row.getCell(i + 1);
        cell.value = rec[k] || null;
        cell.font = { size: XL_FS, bold: i === 0, name: 'Helvetica' };
        cell.alignment = { vertical: 'top', wrapText: i !== 0 };
        cell.border = { top: thin, left: thin, right: thin, bottom: thin };
        if (idx % 2) cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XL.TINT } };
      });
    });
  }

  try {
    const buf = await wb.xlsx.writeBuffer();
    downloadBlob(new Blob([buf], {
      type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
    }), safe + '_Set_Changes.xlsx');
    toast('Set changes exported to Excel');
  } catch (err) {
    exportSetChangeCSV(sections, safe);
  }
}

// Fallback when ExcelJS can't be reached. No bars or shading — a CSV has no
// formatting to give — so the scene rides along in its own column instead, and
// the identifying columns repeat down the block to make up for the lost
// grouping. Opens in Excel, Numbers and Sheets, every cell editable.
function exportSetChangeCSV(sections, safe) {
  const esc = v => {
    const s = String(v == null ? '' : v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [['SCENE'].concat(XLSX_COLS.map(c => c.label)).map(esc).join(',')];
  sections.forEach(sec => {
    sec.blocks.forEach(block => {
      const head = block[0] || {};
      block.forEach(mv => {
        const rec = { ...mv, num: head.num, cue: mv.cue || head.cue, pg: head.pg };
        lines.push([sec.label].concat(XLSX_COLS.map(c => rec[c.key])).map(esc).join(','));
      });
    });
  });
  // BOM so Excel opens it as UTF-8 rather than mangling any curly quotes.
  downloadBlob(new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }),
    safe + '_Set_Changes.csv');
  toast('Offline — exported as CSV instead');
}

async function exportCueSheet() {
  const sorted = cuesInScriptOrder();
  if (!sorted.length) { toast('No cues to export'); return; }
  const showName = document.getElementById('show-name').textContent || 'Untitled';
  const now = new Date();
  const exportedStr = now.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
    + ' at ' + now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

  // Resolve jsPDF the same way the marked-script export does.
  let jsPDFCtor = null;
  try { jsPDFCtor = await loadJsPDF(); } catch (err) {}
  if (!jsPDFCtor) { toast('Could not load PDF library'); return; }

  toast('Building cue sheet PDF…');

  // Preload every cue's line-crop image (Drive URL or local data URL) into a
  // data URL jsPDF can embed, and grab its natural size so we can size the
  // thumbnail without distorting it. Cues with no crop are skipped.
  //
  // NOTE: Google Drive's thumbnail/uc endpoints refuse cross-origin fetch()
  // outright (no Access-Control-Allow-Origin header, confirmed via DevTools)
  // — there is no client-side workaround for that. So remote crops are
  // relayed through the Apps Script backend instead, which already has
  // access to the file and can hand back the bytes as base64 with no CORS
  // restriction (same pattern as loading a script PDF).
  function loadImageAsDataUrl(src) {
    return new Promise(resolve => {
      if (!src) { resolve(null); return; }
      if (src.startsWith('data:')) {
        const img = new Image();
        img.onload = () => resolve({ dataUrl: src, w: img.naturalWidth, h: img.naturalHeight });
        img.onerror = () => resolve(null);
        img.src = src;
        return;
      }
      const fileId = (src.match(/[?&]id=([a-zA-Z0-9_-]+)/) || [])[1];
      if (!fileId) { resolve(null); return; }
      jsonp(SCRIPT_URL + '?action=getDriveImage&fileId=' + fileId + '&_=' + Date.now(), d => {
        if (!d || !d.success || !d.base64) { resolve(null); return; }
        const dataUrl = 'data:' + (d.mimeType || 'image/jpeg') + ';base64,' + d.base64;
        const img = new Image();
        img.onload = () => resolve({ dataUrl, w: img.naturalWidth, h: img.naturalHeight });
        img.onerror = () => resolve(null);
        img.src = dataUrl;
      }, () => resolve(null));
    });
  }
  const cropCache = {};
  await Promise.all(sorted.filter(c => c.lineCrop).map(async c => {
    cropCache[c.id] = await loadImageAsDataUrl(c.lineCrop);
  }));

  // ── Spreadsheet-style layout ───────────────────────────────────────────────
  // Rebuilt from scratch. The old version drew content from two different
  // origins (rowTop and y = rowTop+9) while only advancing one of them, so a
  // row never reserved the height it actually occupied and tall crops leaked
  // into the rows beneath. Here EVERY cell is measured from the row's top edge
  // and rowH is the max of all cells + padding. One origin, no exceptions.
  const doc = new jsPDFCtor({ orientation: 'p', unit: 'pt', format: 'letter' });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();

  const M = 44;                       // page margin
  const PAD = 5;                      // cell padding
  const LEAD = 11;                    // text line height
  const FS = 8.5;                     // body font size
  const MIN_ROW = 22;                 // fits chip + number + the p.NN under it
  const BAND = [236, 236, 242];       // zebra: every other row
  const GRID = [200, 200, 210];       // cell borders
  const HEAD_BG = [232, 232, 240];
  const PURPLE = [83, 74, 183];
  const MARGIN_BOTTOM = 46;

  const COLS = [
    // CUE holds chip + number + page ("LX 12   p.47"), so it needs real width.
    { key: 'number', label: 'CUE',      w: 84  },
    { key: 'action', label: 'ACTION',   w: 92  },
    { key: 'line',   label: 'CUE LINE', w: 186 },
    { key: 'notes',  label: 'NOTES',    w: 162 },
  ];
  const X = []; { let x = M; for (const c of COLS) { X.push(x); x += c.w; } }
  const TABLE_W = COLS.reduce((s, c) => s + c.w, 0);
  // Crop thumbnails live inside the Cue Line cell, so they can never be wider
  // than its inner width — that's what used to push images into Notes.
  const THUMB_MAX_W = COLS[2].w - PAD * 2;
  const THUMB_MAX_H = 84;

  const hexToRgb = hex => {
    const h = (hex || '#999999').replace('#', '');
    return [parseInt(h.slice(0,2),16) || 153, parseInt(h.slice(2,4),16) || 153, parseInt(h.slice(4,6),16) || 153];
  };
  const tint = (rgb, amt) => rgb.map(v => Math.round(v + (255 - v) * amt));

  let y = 0;
  let bandOn = false;

  function drawTitle() {
    y = 54;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(20,20,20);
    doc.text(showName + ' — Cue Sheet', M, y); y += 13;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(140,140,140);
    doc.text('Updated ' + exportedStr, M, y); y += 16;
  }
  function drawHeader() {
    const h = 17;
    doc.setFillColor(...HEAD_BG); doc.rect(M, y, TABLE_W, h, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5); doc.setTextColor(90,90,105);
    COLS.forEach((c, i) => doc.text(c.label, X[i] + PAD, y + 11));
    doc.setDrawColor(...GRID); doc.setLineWidth(0.5);
    COLS.forEach((c, i) => doc.line(X[i], y, X[i], y + h));
    doc.line(M + TABLE_W, y, M + TABLE_W, y + h);
    doc.setDrawColor(140,140,155); doc.setLineWidth(0.9);
    doc.line(M, y + h, M + TABLE_W, y + h);
    y += h;
  }
  // Reserve room before drawing. Anything taller than a full page draws anyway
  // (clipped) rather than looping forever on an empty page.
  function ensureRoom(rowH) {
    if (y + rowH > pageH - MARGIN_BOTTOM && y > 90) {
      doc.addPage();
      drawTitle();
      drawHeader();
      bandOn = false;
      return true;
    }
    return false;
  }

  drawTitle();
  drawHeader();

  // Cues are already in script order (page, then top-to-bottom). Walk them in
  // that order and let SCENE markers divide the sheet: each scene marker draws
  // a divider row, and every cue after it belongs to that scene until the next
  // one. Script page is shown per-cue instead, next to the cue number.
  function drawDivider(label) {
    const h = 15;
    ensureRoom(h + 20);
    doc.setFillColor(...tint(PURPLE, 0.86)); doc.rect(M, y, TABLE_W, h, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5); doc.setTextColor(...PURPLE);
    doc.text(String(label || '').toUpperCase(), M + PAD, y + 10);
    doc.setDrawColor(...GRID); doc.setLineWidth(0.5); doc.rect(M, y, TABLE_W, h);
    y += h;
    bandOn = false;
  }

  // Act/scene numbering is positional, so compute it once up front rather than
  // trusting whatever label was stored when each marker was dropped.
  const SCENE_LABELS = sceneLabels();

  // Anything before the first scene marker still needs a home, otherwise those
  // cues would print with no heading at all.
  if (sorted.length && !isStructuralCue(sorted[0])) drawDivider('Top of Show');

  {
    sorted.forEach(c => {
      if (isSceneCue(c)) { drawDivider(SCENE_LABELS[c.id] || c.number || ''); return; }
      const t = cueTypes.find(x => x.id === c.type);
      const chipColor = t ? hexToRgb(t.color) : [153,153,153];
      const chipLabel = t ? t.name : (c.type || '');

      // Cue Line is TEXT FIRST — the typed line is the source of truth. The
      // cropped script photo is only a fallback for cues that never got one
      // typed in, which is why LX 61/63 still show as images.
      const rawCrop = cropCache[c.id];
      const crop = (rawCrop && rawCrop.dataUrl && rawCrop.w > 0 && rawCrop.h > 0) ? rawCrop : null;
      const useCrop = !c.cueLine && !!crop;

      doc.setFontSize(FS);
      const cells = {
        number: [String(c.number || '')],
        action: doc.splitTextToSize(String(c.action || ''), COLS[1].w - PAD * 2),
        line:   useCrop ? [] : doc.splitTextToSize(String(c.cueLine || ''), COLS[2].w - PAD * 2),
        notes:  doc.splitTextToSize(String(c.notes || c.description || ''), COLS[3].w - PAD * 2),
      };

      let thumbW = 0, thumbH = 0;
      if (useCrop) {
        const s = Math.min(THUMB_MAX_W / crop.w, THUMB_MAX_H / crop.h, 1);
        thumbW = crop.w * s; thumbH = crop.h * s;
      }

      // Row height = tallest cell + padding. Text cells and the thumbnail are
      // measured the same way, from the row top, so neither can overrun.
      const textH = Math.max(
        cells.action.length, cells.line.length, cells.notes.length, 1
      ) * LEAD;
      const rowH = Math.max(textH, thumbH, MIN_ROW) + PAD * 2;

      ensureRoom(rowH);

      if (bandOn) { doc.setFillColor(...BAND); doc.rect(M, y, TABLE_W, rowH, 'F'); }
      bandOn = !bandOn;

      // Cue column: type chip + number, both anchored to the row top.
      // Chip is sized to its own text — a fixed box fits "LX" but not
      // "SPOT OUT", which overran and printed on top of the number.
      doc.setFont('helvetica', 'bold'); doc.setFontSize(5.5);
      const chipW = Math.min(doc.getTextWidth(chipLabel) + 7, 40);
      doc.setFillColor(...chipColor);
      doc.roundedRect(X[0] + PAD, y + PAD, chipW, 9, 4.5, 4.5, 'F');
      doc.setTextColor(255,255,255);
      doc.text(chipLabel, X[0] + PAD + chipW / 2, y + PAD + 6.3, { align: 'center' });

      // The chip already names the type, so drop it from the number itself:
      // "SPOT OUT 2" -> "2". Keeps "SPOT OUT 2" (114pt of text) from being
      // crammed into an 84pt column, where it wrapped onto the page number.
      const shortNum = String(c.number || '').replace(
        new RegExp('^' + String(chipLabel).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*', 'i'), ''
      ) || String(c.number || '');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(FS); doc.setTextColor(20,20,20);
      doc.text(shortNum, X[0] + PAD + chipW + 4, y + PAD + 7.5);
      // Script page is greyed metadata under the number — scene dividers head
      // the sheet now, so the page has to travel with each individual cue.
      doc.setFont('helvetica', 'normal'); doc.setFontSize(6.5); doc.setTextColor(150,150,160);
      doc.text('p.' + (c.page || '?'), X[0] + PAD, y + PAD + 17);

      doc.setFont('helvetica', 'normal'); doc.setFontSize(FS);
      doc.setTextColor(40,40,40);
      if (cells.action.length) doc.text(cells.action, X[1] + PAD, y + PAD + 7);

      if (useCrop) {
        const fmt = /^data:image\/png/i.test(crop.dataUrl) ? 'PNG' : 'JPEG';
        try {
          doc.addImage(crop.dataUrl, fmt, X[2] + PAD, y + PAD, thumbW, thumbH);
        } catch (err) {
          try { doc.addImage(crop.dataUrl, fmt === 'PNG' ? 'JPEG' : 'PNG', X[2] + PAD, y + PAD, thumbW, thumbH); }
          catch (err2) { /* unreadable image — leave the cell empty, row is intact */ }
        }
      } else if (cells.line.length) {
        doc.setTextColor(70,70,70);
        doc.text(cells.line, X[2] + PAD, y + PAD + 7);
      }

      doc.setTextColor(60,60,60);
      if (cells.notes.length) doc.text(cells.notes, X[3] + PAD, y + PAD + 7);

      // Cell borders last, so they sit on top of the band fill.
      doc.setDrawColor(...GRID); doc.setLineWidth(0.4);
      COLS.forEach((col, i) => doc.line(X[i], y, X[i], y + rowH));
      doc.line(M + TABLE_W, y, M + TABLE_W, y + rowH);
      doc.line(M, y + rowH, M + TABLE_W, y + rowH);

      y += rowH;
    });
  }

  // Footer with page numbers
  const pageCount = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pageCount; i++) {
    doc.setPage(i);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(160,160,160);
    doc.text('Music Mountain Theatre', M, pageH - 22);
    doc.text('Page ' + i + ' of ' + pageCount, pageW - M, pageH - 22, { align: 'right' });
  }

  doc.save(showName.replace(/[^a-z0-9]/gi, '_') + '_cue_sheet.pdf');
  toast('Cue sheet PDF downloaded');
}



// ── EDIT MODE ───────────────────────────────────────────────────────────────
// This page is a backstage reference first, so editing is off by default and
// has to be switched on. While it's on, polling stops — a 15-second refresh
// landing mid-edit would wipe what you were typing.
//
// Saving does NOT push this page's whole copy of the show over the Sheet's.
// A day of set changes was lost that way once. Instead it re-reads the Sheet,
// and replaces only the moves of the set changes edited here, and only if
// nobody else has touched those same set changes in the meantime.
let editMode      = false;
let editBaseline  = {};        // cueId -> moves as they were when editing began
let editedCues    = {};        // cueId -> true
let editLoadedRev = null;
let editSaving    = false;
let presetBaseline = {};       // key -> JSON of the preset when editing began
let editedPresets  = {};       // key -> true
let presetSheet    = null;     // { key } while the preset panel is open

function draftKey(){ return 'mmt_cuelist_draft_' + scriptId; }

function saveDraft(){
  try {
    const out = {};
    Object.keys(editedCues).forEach(id => {
      const c = cues.find(x => String(x.id) === String(id));
      if (c) out[id] = c.moves || [];
    });
    const pOut = {};
    Object.keys(editedPresets).forEach(k => { pOut[k] = presets[k] || null; });
    lsSet(draftKey(), JSON.stringify({ at: Date.now(), rev: editLoadedRev, baseline: editBaseline, moves: out,
      presetBaseline, presets: pOut }));
  } catch(e) {}
}
function clearDraft(){ try { localStorage.removeItem(draftKey()); } catch(e) {} }
function getDraft(){ try { return JSON.parse(lsGet(draftKey(), 'null')); } catch(e) { return null; } }

function setEditMode(on){
  if (on && !scriptId) { alert('Pick a script first.'); return; }
  if (!on) { closeMoveSheet(true); closePresetSheet(true); }
  editMode = !!on;
  const btn = document.getElementById('edit-btn');
  if (btn){ btn.textContent = editMode ? 'Done' : 'Edit'; btn.classList.toggle('on', editMode); }
  document.body.classList.toggle('editing', editMode);

  if (editMode){
    editBaseline = {};
    editedCues = {};
    editLoadedRev = loadedRev;
    cues.forEach(c => { if (c.type === SHIFT_TYPE_ID) editBaseline[c.id] = JSON.parse(JSON.stringify(c.moves || [])); });
    presetBaseline = {}; editedPresets = {};
    Object.keys(presets).forEach(k => { presetBaseline[k] = JSON.stringify(presets[k]); });
    if (pollTimer){ clearInterval(pollTimer); pollTimer = null; }
    render();
  } else {
    if (Object.keys(editedCues).length || Object.keys(editedPresets).length) saveMoveEdits();
    else { schedulePoll(); render(); }
  }
}

function mvField(cueId, idx, field, value){
  const c = cues.find(x => String(x.id) === String(cueId));
  if (!c || !c.moves || !c.moves[idx]) return;
  c.moves[idx][field] = value;
  editedCues[cueId] = true;
  saveDraft();
  markDirty();
}

function mvAddRow(cueId){
  const c = cues.find(x => String(x.id) === String(cueId));
  if (!c) return;
  c.moves = c.moves || [];
  c.moves.push({ piece:'', action:'', who:'', spike:'', notes:'' });
  editedCues[cueId] = true;
  saveDraft(); markDirty(); render();
}

function mvDelRow(cueId, idx){
  const c = cues.find(x => String(x.id) === String(cueId));
  if (!c || !c.moves) return;
  const m = c.moves[idx];
  const label = (m && (m.piece || m.action)) || 'this move';
  if (!confirm('Delete ' + label + '?')) return;
  c.moves.splice(idx, 1);
  editedCues[cueId] = true;
  saveDraft(); markDirty(); render();
}

function markDirty(){
  const el = document.getElementById('edit-state');
  if (!el) return;
  const n = Object.keys(editedCues).length + Object.keys(editedPresets).length;
  el.className = 'edit-state dirty';
  el.textContent = n ? n + ' change' + (n !== 1 ? 's' : '') + ' not saved yet' : '';
  measureHeader();
}

// ── The merge ───────────────────────────────────────────────────────────────
// Pure so it can be tested on its own. Applies our edited moves onto whatever
// the Sheet currently holds, one set change at a time, skipping any that
// someone else has altered since we started editing.
function mergeMoveEdits(fresh, baseline, ours){
  const out = JSON.parse(JSON.stringify(fresh));
  const applied = [], conflicts = [];
  out.cues = out.cues || [];
  Object.keys(ours).forEach(id => {
    const target = out.cues.find(c => String(c.id) === String(id));
    if (!target){ conflicts.push({ id, why: 'the set change no longer exists on the Sheet' }); return; }
    const theirs = JSON.stringify(target.moves || []);
    const base   = JSON.stringify(baseline[id] || []);
    if (theirs !== base){ conflicts.push({ id, why: 'someone else changed this set change' }); return; }
    target.moves = JSON.parse(JSON.stringify(ours[id]));
    applied.push(id);
  });
  return { data: out, applied, conflicts };
}

function saveMoveEdits(){
  if (editSaving) return;
  const ids = Object.keys(editedCues);
  const pKeys = Object.keys(editedPresets);
  if (!ids.length && !pKeys.length){ schedulePoll(); render(); return; }
  editSaving = true;

  const el = document.getElementById('edit-state');
  if (el){ el.className = 'edit-state saving'; el.textContent = 'Saving…'; }

  const ours = {};
  ids.forEach(id => {
    const c = cues.find(x => String(x.id) === String(id));
    if (c) ours[id] = JSON.parse(JSON.stringify(c.moves || []));
  });

  jsonp(SCRIPT_URL + '?action=getCueData&scriptId=' + encodeURIComponent(scriptId) + '&_=' + Date.now(), d => {
    if (!d || !d.success || !d.cueData){
      editSaving = false;
      if (el){ el.className = 'edit-state error'; el.textContent = 'Could not reach the Sheet — your edits are kept on this device'; }
      return;
    }
    saveSnap(d.cueData, 'before a cue sheet save');
    const { data, applied, conflicts } = mergeMoveEdits(d.cueData, editBaseline, ours);
    // Presets: each edited piece goes over the Sheet's copy only if nobody
    // else changed that piece since editing began.
    const pApplied = [];
    data.presets = (data.presets && typeof data.presets === 'object') ? data.presets : {};
    pKeys.forEach(k => {
      const theirs = data.presets[k] ? JSON.stringify(normalizePresets({ [k]: data.presets[k] })[k]) : 'null';
      const base = presetBaseline[k] || 'null';
      if (theirs !== base && theirs !== 'null' && base !== 'null'){ conflicts.push({ id: k, why: 'someone else changed the preset for ' + (presets[k] && presets[k].piece || k) }); return; }
      data.presets[k] = JSON.parse(JSON.stringify(presets[k]));
      pApplied.push(k);
    });
    data._rev = (d.cueData._rev || 0) + 1;
    data._savedAt = new Date().toISOString();

    fetch(SCRIPT_URL, {
      method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ action:'saveCueData', scriptId, cueData: data })
    }).then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      editSaving = false;
      applied.forEach(id => { delete editedCues[id]; });
      pApplied.forEach(k => { delete editedPresets[k]; });
      if (conflicts.length){
        // Our version of the clashing changes stays in the draft, so nothing
        // is thrown away — it just isn't pushed over someone else's work.
        if (el){ el.className = 'edit-state error';
          el.textContent = conflicts.length + ' set change' + (conflicts.length !== 1 ? 's' : '') + ' not saved — ' + conflicts[0].why; }
        alert('Saved ' + (applied.length + pApplied.length) + ' change' + ((applied.length + pApplied.length) !== 1 ? 's' : '') + '.\n\n'
          + conflicts.length + ' could not be saved because ' + conflicts[0].why
          + '. Your version is still on this device — reopen Edit to see it.');
      } else {
        clearDraft();
        if (el){ el.className = 'edit-state saved'; el.textContent = 'Saved'; setTimeout(() => { if (el.textContent === 'Saved') el.textContent = ''; }, 2500); }
        editMode = false;
        const btn = document.getElementById('edit-btn');
        if (btn){ btn.textContent = 'Edit'; btn.classList.remove('on'); }
        document.body.classList.remove('editing');
      }
      loadedRev = data._rev;
      schedulePoll(); render();
    }).catch(() => {
      editSaving = false;
      if (el){ el.className = 'edit-state error'; el.textContent = 'Save failed — your edits are safe on this device, try Done again'; }
    });
  }, () => {
    editSaving = false;
    if (el){ el.className = 'edit-state error'; el.textContent = 'Could not reach the Sheet — your edits are kept on this device'; }
  });
}



// ── PRESET PANEL (Before House, edit mode) ──────────────────────────────────
// Same bottom panel as a move: where the piece starts, its spike, notes, and
// whether it prints on the plot. Edits go through presetField, so drafts, the
// unsaved count and the careful save all cover them.
function presetList(){ return allPieces().map(p => p.key); }
function presetEntry(key){
  if (!presets[key]){
    const p = allPieces().find(x => x.key === key);
    presets[key] = { piece: p ? p.piece : key, location: '', notes: '', hidden: false, spikeIds: [], spike: '' };
  }
  const e = presets[key];
  if (!Array.isArray(e.spikeIds)) e.spikeIds = [];
  return e;
}
function openPresetSheet(key){
  if (!editMode) return;
  presetSheet = { key };
  render();
  renderPresetPanel();
  document.getElementById('move-sheet').classList.add('open');
  document.body.classList.add('sheet-open');
  requestAnimationFrame(keepRowVisible);
}
function closePresetSheet(silent){
  if (!presetSheet) return;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  presetSheet = null;
  document.getElementById('move-sheet').classList.remove('open');
  document.body.classList.remove('sheet-open');
  if (!silent) render();
}
function presetField(field, value){
  if (!presetSheet) return;
  const e = presetEntry(presetSheet.key);
  e[field] = value;
  editedPresets[presetSheet.key] = true;
  saveDraft(); markDirty();
  const row = document.querySelector('tr.pr-row[data-key="' + CSS.escape(presetSheet.key) + '"]');
  if (row){
    const tmp = document.createElement('tbody');
    tmp.innerHTML = presetRowHTML({ ...e, key: presetSheet.key }, !row.classList.contains('band'));
    row.replaceWith(tmp.firstElementChild);
  }
}
function presetSpike(id){
  if (!presetSheet) return;
  const cur = (presetEntry(presetSheet.key).spikeIds || []).slice();
  const i = cur.indexOf(id);
  if (i >= 0) cur.splice(i, 1); else cur.push(id);
  presetField('spikeIds', cur);
  const box = document.getElementById('ps-spikes');
  if (box) box.innerHTML = spkPickerHTML(scriptId, cur, 'presetSpike');
}
function presetStep(dir){
  const keys = presetList();
  const at = keys.indexOf(presetSheet.key);
  if (keys[at + dir]) openPresetSheet(keys[at + dir]);
}
function renderPresetPanel(){
  const key = presetSheet.key;
  const e = presetEntry(key);
  const keys = presetList(), at = keys.indexOf(key);
  const inp = (field, ph) => `<input id="ps-${field}" class="ms-in" value="${esc(e[field] || '')}" placeholder="${esc(ph)}"
      autocomplete="off" oninput="presetField('${field}', this.value)">`;
  document.getElementById('ms-body').innerHTML = `
    <div class="ms-head">
      <span class="ms-num" style="font-size:19px">${esc(e.piece || key)}</span>
      <span class="ms-of">· before house · ${at + 1} of ${keys.length}</span>
      <span style="flex:1"></span>
      <button class="ms-icon" aria-label="Previous piece" onclick="presetStep(-1)"${at <= 0 ? ' disabled' : ''}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="ms-icon" aria-label="Next piece" onclick="presetStep(1)"${at >= keys.length - 1 ? ' disabled' : ''}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="ms-grid ms-g2 ms-even">
      <label class="ms-f"><span>Preset location</span>${inp('location', 'e.g. SL wing, upstage')}</label>
      <label class="ms-f"><span>Note</span>${inp('notes', 'Optional')}</label>
    </div>
    <div class="ms-spike-head"><span>Spike</span><a href="${spkMapURL(scriptId, scriptName)}" target="_blank" rel="noopener">Edit spike map ›</a></div>
    <div id="ps-spikes">${spkPickerHTML(scriptId, e.spikeIds, 'presetSpike')}</div>
    <input id="ps-spike" class="ms-in" style="margin:8px 0 6px" value="${esc(e.spike || '')}" placeholder="Other spike, typed (optional)"
      autocomplete="off" oninput="presetField('spike', this.value)">
    <div class="ms-btns">
      <button class="ms-btn${e.hidden ? '' : ' dashed'}" onclick="presetField('hidden', ${!e.hidden}); renderPresetPanel();">${e.hidden ? 'Put back on the plot' : 'Leave off the plot'}</button>
      <span style="flex:1"></span>
      <button class="ms-btn primary" onclick="closePresetSheet()">Close</button>
    </div>`;
}

// ── MOVE SHEET ──────────────────────────────────────────────────────────────
// One move at a time in a panel at the bottom of the screen, so the plot stays
// readable above it. Every keystroke goes through mvField like the old inline
// boxes did, so drafts, the "not saved yet" count and the safe merge on Done
// all work exactly as before. Nothing takes the cursor until you tap a box.
const MOVE_ACTIONS = ['In', 'Out', 'Set', 'Strike', 'Preset', 'Roll down', 'Fly in', 'Fly out', 'On', 'Off'];
let moveSheet = null;   // { cueId, idx, added }

const sheetCue = () => moveSheet && cues.find(x => String(x.id) === moveSheet.cueId);
const blankMove = m => !m || (!m.piece && !m.action && !m.who && !m.spike && !(m.spikeIds || []).length && !m.notes);

// Every move in script order, for the ‹ › arrows.
function allMoveRefs(){
  const out = [];
  cuesInScriptOrder().forEach(c => {
    if (c.type !== SHIFT_TYPE_ID || !matches(c)) return;
    (c.moves || []).forEach((m, i) => out.push({ cueId: String(c.id), idx: i }));
  });
  return out;
}

// A move the sheet created and nobody typed into isn't a change — drop it, and
// if that leaves the set change as it started, it isn't edited either.
function finalizeSheetMove(){
  if (!moveSheet || !moveSheet.added) return;
  const c = sheetCue();
  if (c && c.moves && blankMove(c.moves[moveSheet.idx])){
    c.moves.splice(moveSheet.idx, 1);
    const base = JSON.stringify(editBaseline[c.id] || []);
    if (JSON.stringify(c.moves) === base){ delete editedCues[c.id]; }
    saveDraft(); markDirty();
  }
}

function openMove(cueId, idx, added){
  if (!editMode) return;
  const id = String(cueId);
  if (moveSheet && !(moveSheet.cueId === id && moveSheet.idx === idx)) finalizeSheetMove();
  const c = cues.find(x => String(x.id) === id);
  if (!c) return;
  c.moves = c.moves || [];
  // An empty set change shows a "Tap to add a move" row with nothing behind it.
  if (!c.moves.length){ c.moves.push({ piece:'', action:'', who:'', spike:'', notes:'' }); idx = 0; added = true; }
  if (idx >= c.moves.length) idx = c.moves.length - 1;
  moveSheet = { cueId: id, idx, added: !!added };
  render();
  renderMoveSheet();
  document.getElementById('move-sheet').classList.add('open');
  document.body.classList.add('sheet-open');
  requestAnimationFrame(keepRowVisible);
}

function closeMoveSheet(silent){
  if (!moveSheet) return;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  finalizeSheetMove();
  moveSheet = null;
  const el = document.getElementById('move-sheet');
  if (el) el.classList.remove('open');
  document.body.classList.remove('sheet-open');
  if (!silent) render();
}

// Scroll so the move being edited sits above the sheet, not behind it.
function keepRowVisible(){
  const row = document.querySelector('tr.mv-sel');
  const sheet = document.querySelector('#move-sheet .ms-panel');
  if (!row || !sheet) return;
  const r = row.getBoundingClientRect();
  const top = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hdr')) || 0;
  const limit = window.innerHeight - sheet.offsetHeight - 12;
  if (r.bottom > limit) window.scrollBy(0, r.bottom - limit);
  else if (r.top < top + 8) window.scrollBy(0, r.top - top - 8);
}

function sheetStep(dir){
  const refs = allMoveRefs();
  const at = refs.findIndex(r => r.cueId === moveSheet.cueId && r.idx === moveSheet.idx);
  const next = refs[at + dir];
  if (next) openMove(next.cueId, next.idx);
}

function sheetAddMove(cueId){
  if (!editMode) return;
  const c = cues.find(x => String(x.id) === String(cueId));
  if (!c) return;
  if (moveSheet) finalizeSheetMove();
  moveSheet = null;
  c.moves = c.moves || [];
  // A lone blank placeholder is reused rather than stacking another blank.
  if (c.moves.length && blankMove(c.moves[c.moves.length - 1])) return openMove(c.id, c.moves.length - 1, true);
  c.moves.push({ piece:'', action:'', who:'', spike:'', notes:'' });
  openMove(c.id, c.moves.length - 1, true);
}

function sheetDelete(){
  const c = sheetCue();
  if (!c || !c.moves) return;
  const idx = moveSheet.idx;
  const m = c.moves[idx];
  if (moveSheet.added && blankMove(m)) return closeMoveSheet();
  const label = (m && (m.piece || m.action)) || 'this move';
  if (!confirm('Delete ' + label + '?')) return;
  c.moves.splice(idx, 1);
  editedCues[c.id] = true;
  saveDraft(); markDirty();
  moveSheet.added = false;
  if (c.moves.length) openMove(c.id, Math.min(idx, c.moves.length - 1));
  else closeMoveSheet();
}

function sheetField(field, value){
  if (!moveSheet) return;
  const c = sheetCue();
  if (!c || !c.moves || !c.moves[moveSheet.idx]) return;
  mvField(c.id, moveSheet.idx, field, value);
  if (field === 'action') syncActionPills(value);
  if (field === 'who') syncWhoPills(value);
  // Keep the row under the sheet in step without rebuilding the whole table.
  const row = document.querySelector('tr.mv-sel');
  const m = c.moves[moveSheet.idx];
  if (row){
    row.cells[1].innerHTML = blankMove(m) ? '<span class="mv-empty">Tap to add a move</span>'
      : `<span class="mv-piece">${esc(m.piece || '')}</span>${m.action ? `<span class="mv-act">${esc(m.action)}</span>` : ''}`;
    row.cells[2].textContent = m.who || '';
    row.cells[3].innerHTML = `<span class="mv-spike spk-line">${spkChipsHTML(m, scriptId)}</span>`;
    row.cells[4].innerHTML = m.notes ? `<span class="mv-note">${esc(m.notes)}</span>` : '';
  }
}

// Tap a swatch to add or remove that spike colour on this move.
function sheetSpike(id){
  const c = sheetCue();
  if (!c || !c.moves || !c.moves[moveSheet.idx]) return;
  const m = c.moves[moveSheet.idx];
  const cur = Array.isArray(m.spikeIds) ? m.spikeIds.slice() : [];
  const i = cur.indexOf(id);
  if (i >= 0) cur.splice(i, 1); else cur.push(id);
  mvField(c.id, moveSheet.idx, 'spikeIds', cur);
  const box = document.getElementById('ms-spikes');
  if (box) box.innerHTML = spkPickerHTML(scriptId, cur, 'sheetSpike');
  const row = document.querySelector('tr.mv-sel');
  if (row) {
    row.cells[1].innerHTML = blankMove(m) ? '<span class="mv-empty">Tap to add a move</span>'
      : `<span class="mv-piece">${esc(m.piece || '')}</span>${m.action ? `<span class="mv-act">${esc(m.action)}</span>` : ''}`;
    row.cells[3].innerHTML = `<span class="mv-spike spk-line">${spkChipsHTML(m, scriptId)}</span>`;
  }
}

function sheetPick(field, value){
  const input = document.getElementById('ms-' + field);
  if (!input) return;
  // Tapping the one that's already set clears it.
  const v = input.value.trim().toLowerCase() === String(value).toLowerCase() ? '' : value;
  input.value = v;
  sheetField(field, v);
}
function syncActionPills(v){
  const k = String(v || '').trim().toLowerCase();
  document.querySelectorAll('#ms-actions .ms-pill').forEach(b => b.classList.toggle('on', b.dataset.v.toLowerCase() === k));
}
function syncWhoPills(v){
  const k = String(v || '').trim().toLowerCase();
  document.querySelectorAll('#ms-whos .ms-pill').forEach(b => b.classList.toggle('on', b.dataset.v.toLowerCase() === k));
}

function renderMoveSheet(){
  const c = sheetCue();
  if (!c) return;
  const m = c.moves[moveSheet.idx] || {};
  const t = typeOf(c.type);
  const refs = allMoveRefs();
  const at = refs.findIndex(r => r.cueId === moveSheet.cueId && r.idx === moveSheet.idx);
  const pieces = allPieces().map(p => `<option value="${esc(p.piece)}"></option>`).join('');
  const whos = allWho();
  const inp = (field, ph, extra) => `<input id="ms-${field}" class="ms-in${extra || ''}" value="${esc(m[field] || '')}"
      placeholder="${esc(ph)}" autocomplete="off" oninput="sheetField('${field}', this.value)"${field === 'piece' ? ' list="ms-pieces"' : ''}>`;
  const pill = (field, v, on) => `<button type="button" class="ms-pill${on ? ' on' : ''}" data-v="${esc(v)}"
      onclick="sheetPick('${field}', this.dataset.v)">${esc(v)}</button>`;
  const actKey = String(m.action || '').trim().toLowerCase();
  const whoKey = String(m.who || '').trim().toLowerCase();

  document.getElementById('ms-body').innerHTML = `
    <div class="ms-head">
      <span class="cs-chip" style="background:${esc(t.color)}">${esc(t.name)}</span>
      <span class="ms-num">${esc(shortNumber(c, t.name))}</span>
      <span class="ms-of">· move ${moveSheet.idx + 1} of ${c.moves.length} · p.${esc(c.page || '?')}</span>
      <span style="flex:1"></span>
      <button class="ms-icon" aria-label="Previous move" onclick="sheetStep(-1)"${at <= 0 ? ' disabled' : ''}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="ms-icon" aria-label="Next move" onclick="sheetStep(1)"${at < 0 || at >= refs.length - 1 ? ' disabled' : ''}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="ms-grid ms-g2">
      <label class="ms-f"><span>Piece</span>${inp('piece', 'e.g. Main Curtain', ' strong')}</label>
      <label class="ms-f"><span>Action</span>${inp('action', 'e.g. In')}</label>
    </div>
    <datalist id="ms-pieces">${pieces}</datalist>
    <div class="ms-pills" id="ms-actions">${MOVE_ACTIONS.map(v => pill('action', v, v.toLowerCase() === actKey)).join('')}</div>
    <div class="ms-grid ms-g2 ms-even">
      <label class="ms-f"><span>Who</span>${inp('who', 'Who', ' strong')}</label>
      <label class="ms-f"><span>Note</span>${inp('notes', 'Note')}</label>
    </div>
    ${whos.length ? `<div class="ms-pills" id="ms-whos">${whos.map(v => pill('who', v, v.toLowerCase() === whoKey)).join('')}</div>` : ''}
    <div class="ms-spike-head"><span>Spike</span><a href="${spkMapURL(scriptId, scriptName)}" target="_blank" rel="noopener">Edit spike map ›</a></div>
    <div id="ms-spikes">${spkPickerHTML(scriptId, m.spikeIds, 'sheetSpike')}</div>
    <input id="ms-spike" class="ms-in" style="margin:8px 0 6px" value="${esc(m.spike || '')}" placeholder="Other spike, typed (optional)"
      autocomplete="off" oninput="sheetField('spike', this.value)">
    <div class="ms-btns">
      <button class="ms-btn danger" onclick="sheetDelete()">Delete move</button>
      <button class="ms-btn dashed" onclick="sheetAddMove('${esc(c.id)}')">+ Another move</button>
      <span style="flex:1"></span>
      <button class="ms-btn primary" onclick="closeMoveSheet()">Close</button>
    </div>`;
}

function toggle(id){ if (editMode) return; expanded[id] = !expanded[id]; render(); }

function renderTypeStrip(){
  const counts = {};
  cues.forEach(c => { if (!isScene(c)) counts[c.type] = (counts[c.type] || 0) + 1; });
  const total = cues.filter(c => !isScene(c)).length;

  let html = `<button class="type-row${!activeType ? ' on' : ''}" style="${!activeType ? 'background:var(--purple);' : ''}"
      onclick="setType(null)">All <span class="type-n">${total}</span></button>`;

  html += cueTypes
    .filter(t => t.id !== SCENE_TYPE_ID && counts[t.id])
    .map(t => {
      const on = activeType === t.id;
      return `<button class="type-row${on ? ' on' : ''}" style="${on ? 'background:' + esc(t.color) + ';' : ''}"
        onclick="setType('${esc(t.id)}')">
        <span class="type-color" style="background:${esc(t.color)}"></span><span class="lbl">${esc(t.name)}</span>
        <span class="type-n">${counts[t.id]}</span></button>`;
    }).join('');

  document.getElementById('type-strip').innerHTML = html + whoChipsHTML();
}

function whoChipsHTML(){
  const who = allWho();
  if (!who.length) return '';
  return '<span class="strip-div"></span><span class="strip-label">Who</span>' + who.map(w => {
    const key = w.toLowerCase();
    const on = activeWho === key;
    const n = cues.filter(c => (c.moves || []).some(m => onMove(m, key))).length;
    return `<button class="type-row${on ? ' on' : ''}" style="${on ? 'background:var(--purple);' : ''}"
      onclick="setWho('${esc(key)}')"><span class="lbl">${esc(w)}</span> <span class="type-n">${n}</span></button>`;
  }).join('');
}

function renderPageJump(){
  const sel = document.getElementById('page-jump');
  const pages = [...new Set(cues.filter(c => !isScene(c)).map(c => c.page))]
    .filter(p => p != null).sort((a,b) => a - b);
  const cur = sel.value;
  sel.innerHTML = '<option value="">Page…</option>' +
    pages.map(p => `<option value="${esc(p)}">p. ${esc(p)}</option>`).join('');
  if (pages.map(String).includes(cur)) sel.value = cur;
}

// scrollIntoView would tuck the row under the sticky toolbar, so offset by the
// measured header height.
function jumpToPage(p){
  if (!p) return;
  const row = document.querySelector('tr[data-page="' + CSS.escape(String(p)) + '"]');
  if (!row) return;
  const hdr = document.querySelector('header');
  const off = (hdr ? hdr.offsetHeight : 0) + 8;
  window.scrollTo({ top: row.getBoundingClientRect().top + window.scrollY - off, behavior: 'smooth' });
}

// ── Scroll memory ───────────────────────────────────────────────────────────
// Forty cues into Act 2, losing your place to a refresh or an app-switch is the
// difference between glancing and hunting. Kept per script and per view.
function scrollKey(){ return 'mmt_cuelist_scroll_' + (scriptId || 'none') + '_' + view; }
let scrollTimer = null;
function saveScroll(){ lsSet(scrollKey(), String(Math.round(window.scrollY))); }
window.addEventListener('scroll', () => {
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(saveScroll, 400);
}, { passive: true });
window.addEventListener('pagehide', saveScroll);

// Only ever restores a position that was explicitly queued (boot or a view
// switch) — never on a poll, which would yank the page while it's being read.
function restoreScroll(){
  if (pendingScroll == null) return;
  const y = pendingScroll;
  pendingScroll = null;
  if (!y) return;
  requestAnimationFrame(() => window.scrollTo(0, y));
}

function renderScriptList(err){
  const el = document.getElementById('script-list');
  if (err){ el.innerHTML = `<div class="note">${esc(err)}</div>`; return; }
  if (!scripts.length){ el.innerHTML = '<div class="note">No saved scripts yet.</div>'; return; }
  el.innerHTML = scripts.map(s => `
    <button class="script-opt${s.id === scriptId ? ' sel' : ''}"
            onclick="pickScript('${esc(s.id)}','${esc(String(s.name).replace(/'/g,"\\'"))}')">
      <span class="nm">${esc(cleanShowName(s.name))}</span>
      <span class="dt">${esc(s.date || '')}</span>
    </button>`).join('');
}

// ── Status ──────────────────────────────────────────────────────────────────
function setStatus(text, cls){
  document.getElementById('status').textContent = text;
  document.getElementById('pulse').className = 'pulse' + (cls ? ' ' + cls : '');
}
function stampUpdated(){
  const el = document.getElementById('upd');
  if (!el) return;
  const d = lastOk ? new Date(lastOk) : new Date();
  el.textContent = 'Updated ' +
    d.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' }) +
    ' at ' + d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
}
function tickStatus(){
  if (!lastOk) return;
  const s = Math.round((Date.now() - lastOk) / 1000);
  if (s < 5)       setStatus('live', '');
  else if (s < 90) setStatus('updated ' + s + 's ago', '');
  else             setStatus('updated ' + Math.round(s/60) + 'm ago', 'stale');
}

// Column headers stick below the toolbar, whose height changes with text size,
// chip wrapping and the iPad's safe area — so measure it rather than guess.
function measureHeader(){
  const h = document.querySelector('header');
  if (h) document.documentElement.style.setProperty('--hdr', h.offsetHeight + 'px');
}

// Crops are only a fallback for cues with no typed line, but on a script that
// leans on them they dominate the sheet. Off, each one collapses to a chip that
// reveals just that photo — so a single line can be checked without the rest
// of the page turning back into a contact sheet.
function setPhotos(on){
  showPhotos = !!on;
  lsSet('mmt_cuelist_photos', on ? '1' : '0');
  // Cleared in both directions: individually revealed photos have to collapse
  // when you hide, or "hide all" leaves the ones you'd opened still showing.
  revealed = {};
  document.querySelectorAll('#photo-row button').forEach(b =>
    b.classList.toggle('on', (b.dataset.ph === '1') === showPhotos));
  const btn = document.getElementById('photo-btn');
  if (btn){
    btn.classList.toggle('primary', showPhotos);
    btn.textContent = showPhotos ? 'Photos ✓' : 'Photos';
  }
  render();
}
function revealPhoto(id){ revealed[id] = true; render(); }

function setSize(px){
  document.documentElement.style.setProperty('--ct-fs', px + 'px');
  lsSet('mmt_cuelist_size', String(px));
  document.querySelectorAll('#size-row button').forEach(b =>
    b.classList.toggle('on', parseInt(b.dataset.sz,10) === px));
  measureHeader();
}

// A backstage iPad shouldn't sleep between cues.
async function toggleAwake(){
  const btn = document.getElementById('awake-btn');
  if (wakeLock){
    try { await wakeLock.release(); } catch(e){}
    wakeLock = null; btn.classList.remove('primary'); btn.textContent = 'Awake';
    return;
  }
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => {
      wakeLock = null; btn.classList.remove('primary'); btn.textContent = 'Awake';
    });
    btn.classList.add('primary'); btn.textContent = 'Awake ✓';
  } catch(e){
    btn.textContent = 'No';
    setTimeout(() => { btn.textContent = 'Awake'; }, 1500);
  }
}
async function reacquireWake(){
  const btn = document.getElementById('awake-btn');
  if (!btn.classList.contains('primary') || wakeLock) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
}

// Same shape as toggleDarkMode() in app.html, down to the mmt_theme key — so a
// device that has the dashboard set to dark opens this page dark too.
const THEMES = ['light', 'dark', 'red'];
const THEME_ICON = { light: '☀️', dark: '🌙', red: '🔴' };

function applyTheme(t, persist){
  if (THEMES.indexOf(t) === -1) t = 'light';
  document.documentElement.setAttribute('data-theme', t === 'light' ? '' : t);
  const btn = document.getElementById('theme-toggle');
  if (btn) btn.textContent = THEME_ICON[t];
  document.querySelectorAll('#theme-row button').forEach(b => b.classList.toggle('on', b.dataset.th === t));
  if (persist !== false){
    lsSet('mmt_cuelist_theme', t);
    // Keep the dashboard in step for the two themes it knows about; Red is
    // this page's own, so it leaves mmt_theme alone rather than writing a
    // value app.html would read as light.
    if (t !== 'red') { try { localStorage.setItem('mmt_theme', t); } catch(e){} }
  }
}
function currentTheme(){
  const own = lsGet('mmt_cuelist_theme', '');
  if (THEMES.indexOf(own) !== -1) return own;
  return lsGet('mmt_theme','') === 'dark' ? 'dark' : 'light';   // follow the dashboard
}
function toggleDarkMode(){
  applyTheme(THEMES[(THEMES.indexOf(currentTheme()) + 1) % THEMES.length]);
}

function openSheet(){ document.getElementById('settings').classList.add('open'); }
function closeSheet(){ document.getElementById('settings').classList.remove('open'); }
function openSpikeMap(){
  const q = scriptId ? '?script=' + encodeURIComponent(scriptId) + (scriptName ? '&name=' + encodeURIComponent(scriptName) : '') : '';
  window.open('spike-map.html' + q, '_blank');
}

document.addEventListener('keydown', e => {
  if (document.getElementById('pin-screen').style.display === 'none') return;
  if (e.key >= '0' && e.key <= '9') pinPress(e.key);
  else if (e.key === 'Backspace') pinPress('back');
});

applyTheme(currentTheme(), false);
if (lsGet('mmt_cuelist_ok','') === '1') unlock(); else updateDots();
</script>
