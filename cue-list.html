<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cue Sheet — MMT</title>
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiTU1UIEN1ZSBTaGVldCIsInNob3J0X25hbWUiOiJDdWVzIiwic3RhcnRfdXJsIjoiLi9jdWUtbGlzdC5odG1sIiwiZGlzcGxheSI6InN0YW5kYWxvbmUiLCJiYWNrZ3JvdW5kX2NvbG9yIjoiIzFhMWEyZSIsInRoZW1lX2NvbG9yIjoiIzFhMWEyZSJ9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Global tokens — same values as app.html :root */
  :root {
    --green: #3B6D11; --purple: #534AB7; --blue: #185FA5;
    --purple-light: #EEEDFE; --purple-dark: #3C3489;
    --red: #c0392b;
    --bg: #f8f7f4; --surface: #ffffff;
    --border: rgba(0,0,0,0.1);
    --text: #1a1a1a; --text-muted: #6b6b6b; --text-faint: #aaaaaa;
    --radius: 12px; --radius-sm: 8px;

    /* Cue editor tokens — same values as #scripts-editor in app.html */
    --cue-bg: #1a1a2e; --cue-surface: #232340; --cue-surface2: #2a2a4a;
    --cue-border: rgba(255,255,255,0.1); --cue-border2: rgba(255,255,255,0.06);
    --cue-text: #e4e4ec; --cue-text-muted: #9494ae; --cue-text-faint: #5e5e78;
    --cue-red: #e74c3c; --cue-radius: 10px; --cue-radius-sm: 6px;

    --ct-fs: 12px;           /* cue table base size — driven by the text-size control */
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --hdr: 128px;            /* measured toolbar height */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    background: var(--cue-bg); color: var(--cue-text);
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: contain;
  }
  button, input { font-family: 'DM Sans', sans-serif; color: inherit; }
  button { cursor: pointer; }

  /* ── PIN SCREEN — matches app.html / staff.html / tasks.html ─────────────── */
  .pin-screen {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #1a1a2e 0%, #3C3489 60%, #185FA5 100%);
    background-size: cover; background-position: center;
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
  }
  .pin-screen::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(26,26,46,0.82) 0%, rgba(60,52,137,0.78) 60%, rgba(24,95,165,0.78) 100%);
    z-index: 0;
  }
  .pin-card {
    position: relative; z-index: 1;
    background: white; color: var(--text); border-radius: var(--radius);
    padding: 2rem; width: 300px; text-align: center;
    box-shadow: 0 24px 64px rgba(0,0,0,0.35);
  }
  .pin-logo { width: 80px; margin: 0 auto 1rem; display: block; }
  .pin-title { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .pin-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 1.5rem; }
  .pin-dots { display: flex; justify-content: center; gap: 12px; margin-bottom: 1.5rem; }
  .pin-dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--purple); background: transparent;
    transition: background 0.15s;
  }
  .pin-dot.filled { background: var(--purple); }
  .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pin-btn {
    padding: 14px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--bg);
    font-size: 18px; font-weight: 600; cursor: pointer;
    font-family: 'DM Sans', sans-serif; transition: all 0.1s;
  }
  .pin-btn:hover { background: var(--purple-light); border-color: var(--purple); }
  .pin-btn:active { transform: scale(0.95); }
  .pin-btn.clear { color: var(--red); }
  .pin-error { color: var(--red); font-size: 13px; margin-top: 10px; min-height: 20px; }

  /* ── TOOLBAR — reads like the cue panel header ──────────────────────────── */
  #app { display: none; }
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--cue-surface); border-bottom: 1px solid var(--cue-border);
    padding-top: var(--safe-t);
  }
  .cue-panel-header {
    padding: 12px 16px; display: flex; align-items: center; gap: 10px;
  }
  .cph-title { flex: 1; min-width: 0; }
  .cph-title h3 {
    font-size: 14px; font-weight: 600; margin: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cue-count {
    font-size: 11px; color: var(--cue-text-faint);
    font-family: 'DM Mono', monospace; display: flex; align-items: center; gap: 6px; margin-top: 2px;
  }
  .pulse { width: 6px; height: 6px; border-radius: 50%; background: #2ecc71; flex: none; animation: pulse 2.4s ease-in-out infinite; }
  .pulse.stale { background: #f1c40f; animation: none; }
  .pulse.dead { background: var(--cue-red); animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

  .top-btn {
    flex: none; padding: 7px 12px; border: 1px solid var(--cue-border);
    border-radius: var(--cue-radius-sm); background: none;
    color: var(--cue-text-muted); font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .top-btn:hover { background: var(--cue-surface2); }
  .top-btn.primary { background: var(--purple); color: #fff; border-color: var(--purple); }

  .cue-search { padding: 0 16px 10px; position: relative; }
  .cue-search input {
    width: 100%; padding: 8px 30px 8px 10px;
    border: 1px solid var(--cue-border); border-radius: var(--cue-radius-sm);
    background: var(--cue-surface2); color: var(--cue-text);
    font-size: 13px; -webkit-appearance: none;
  }
  .cue-search input:focus { outline: none; border-color: var(--purple); }
  .cue-search button {
    position: absolute; right: 22px; top: 50%; transform: translateY(-60%);
    background: none; border: none; color: var(--cue-text-faint);
    font-size: 16px; display: none; padding: 2px 6px;
  }

  /* Type filters — the type-manager rows, laid out as a scrolling filter strip */
  .type-strip {
    display: flex; gap: 6px; overflow-x: auto;
    padding: 0 16px 10px; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .type-strip::-webkit-scrollbar { display: none; }
  .type-row {
    flex: none; display: flex; align-items: center; gap: 6px;
    font-size: 12px; padding: 5px 10px;
    border: 1px solid var(--cue-border); border-radius: 999px;
    background: none; color: var(--cue-text-muted); white-space: nowrap;
  }
  .type-row:hover { background: var(--cue-surface2); }
  .type-row.on { color: #fff; border-color: transparent; }
  .type-color { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .type-n { font-family: 'DM Mono', monospace; font-size: 10px; opacity: .75; }

  /* ── CUE TABLE — same rules as #scripts-editor .cue-table ───────────────── */
  .cue-list { padding: 8px; padding-bottom: calc(40px + var(--safe-b)); }
  .cue-table { width: 100%; border-collapse: collapse; font-size: var(--ct-fs); }
  .cue-table th {
    text-align: left; font-size: 0.833em; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.5px; color: var(--cue-text-faint); padding: 6px 8px;
    border-bottom: 1px solid var(--cue-border);
    position: sticky; top: var(--hdr); background: var(--cue-surface); z-index: 5;
  }
  .cue-table td { padding: 7px 8px; border-bottom: 1px solid var(--cue-border2); vertical-align: top; cursor: pointer; }
  .cue-table tr:hover td { background: var(--cue-surface2); }
  .cue-table .ct-type { font-size: 0.75em; font-weight: 700; padding: 2px 6px; border-radius: 4px; color: white; white-space: nowrap; }
  .cue-table .ct-num { font-family: 'DM Mono', monospace; font-weight: 600; font-size: 1em; white-space: nowrap; }
  .cue-table .ct-action { color: var(--cue-text); }
  .cue-table .ct-line { color: var(--cue-text-muted); font-style: italic; font-size: 0.917em; }
  .cue-table .ct-notes { color: var(--cue-text-faint); font-size: 0.917em; }
  .cue-table .ct-pg { font-family: 'DM Mono', monospace; color: var(--cue-text-faint); font-size: 0.917em; }
  .ct-moves { font-size: 0.833em; color: var(--cue-text-faint); font-family: 'DM Mono', monospace; }

  /* Scenes structure the sheet rather than being cues in it — solid bar, as on export. */
  .cue-table tr.scene-row td {
    background: var(--cue-surface); cursor: default;
    padding: 8px; border-top: 1px solid var(--cue-border); border-bottom: 1px solid var(--cue-border);
    font-size: 0.917em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--cue-text-muted);
    box-shadow: inset 4px 0 0 #8e44ad;
  }
  .cue-table tr.scene-row:hover td { background: var(--cue-surface); }
  .scene-pg { float: right; font-family: 'DM Mono', monospace; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--cue-text-faint); }

  /* Expanded detail — set-change moves in the app's mv-grid look */
  tr.detail-row td { background: var(--cue-bg); cursor: default; padding: 10px 12px; }
  tr.detail-row:hover td { background: var(--cue-bg); }
  .detail-box { border: 1px solid var(--cue-border); border-radius: var(--cue-radius-sm); padding: 10px 12px; background: var(--cue-surface); }
  .detail-box img { width: 100%; max-width: 560px; border: 1px solid var(--cue-border); border-radius: var(--cue-radius-sm); display: block; margin-bottom: 8px; }
  table.mv-grid { width: 100%; border-collapse: collapse; font-size: 0.917em; }
  table.mv-grid th { text-align: left; font-size: 0.833em; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--cue-text-faint); padding: 0 6px 4px; }
  table.mv-grid td { padding: 4px 6px; border-bottom: 1px solid var(--cue-border2); vertical-align: top; cursor: default; }
  table.mv-grid tr:last-child td { border-bottom: none; }
  .mv-piece { font-weight: 600; color: var(--cue-text); }
  .mv-who { font-family: 'DM Mono', monospace; color: var(--cue-text-muted); white-space: nowrap; }
  .detail-note { margin-top: 8px; font-size: 0.917em; color: var(--cue-text-muted); }

  tr.changed td { animation: flash 2.6s ease-out; }
  @keyframes flash { 0% { background: rgba(83,74,183,0.35); } 100% { background: transparent; } }

  .cue-empty { padding: 40px 20px; text-align: center; color: var(--cue-text-faint); font-size: 13px; line-height: 1.7; }
  .cue-empty b { display: block; color: var(--cue-text); font-weight: 500; margin-bottom: 4px; }

  /* ── SHEET (script picker + display) — the cue-edit modal look ───────────── */
  .cue-edit-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 500; display: none; align-items: center; justify-content: center; }
  .cue-edit-overlay.open { display: flex; }
  .cue-edit {
    background: var(--cue-surface); color: var(--cue-text); border-radius: var(--cue-radius);
    padding: 24px; width: 90%; max-width: 440px; max-height: 90vh; overflow-y: auto;
  }
  .cue-edit h3 { font-size: 16px; margin: 0 0 14px; }
  .cue-edit label { display: block; font-size: 11px; font-weight: 600; color: var(--cue-text-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .cue-edit .note { font-size: 12px; color: var(--cue-text-muted); margin: -8px 0 16px; line-height: 1.5; }
  .script-opt {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    padding: 10px 12px; margin-bottom: 6px;
    border: 1px solid var(--cue-border); border-radius: var(--cue-radius-sm);
    background: var(--cue-surface2); color: var(--cue-text); font-size: 13px;
  }
  .script-opt.sel { border-color: var(--purple); background: rgba(83,74,183,0.28); }
  .script-opt .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .script-opt .dt { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--cue-text-faint); flex: none; }
  .size-row { display: flex; gap: 6px; margin-bottom: 16px; }
  .size-row button { flex: 1; padding: 10px 0; border: 1px solid var(--cue-border); border-radius: var(--cue-radius-sm); background: var(--cue-surface2); color: var(--cue-text-muted); font-size: 13px; }
  .size-row button.on { border-color: var(--purple); background: rgba(83,74,183,0.28); color: #fff; }
  .cue-edit-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  .cue-edit-btns .top-btn { padding: 6px 14px; font-size: 12px; }

  @media (max-width: 700px) {
    .cue-table .ct-line, .cue-table th.h-line { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<!-- ── PIN ────────────────────────────────────────────────────────────────── -->
<div class="pin-screen" id="pin-screen">
  <div class="pin-card">
    <img class="pin-logo" src="MMT%20Logo.png" alt="MMT" onerror="this.style.display='none'" />
    <div class="pin-title">MMT Cue Sheet</div>
    <div class="pin-subtitle">Enter your PIN to continue</div>
    <div class="pin-dots">
      <div class="pin-dot" id="d0"></div>
      <div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div>
      <div class="pin-dot" id="d3"></div>
    </div>
    <div class="pin-pad">
      <button class="pin-btn" onclick="pinPress('1')">1</button>
      <button class="pin-btn" onclick="pinPress('2')">2</button>
      <button class="pin-btn" onclick="pinPress('3')">3</button>
      <button class="pin-btn" onclick="pinPress('4')">4</button>
      <button class="pin-btn" onclick="pinPress('5')">5</button>
      <button class="pin-btn" onclick="pinPress('6')">6</button>
      <button class="pin-btn" onclick="pinPress('7')">7</button>
      <button class="pin-btn" onclick="pinPress('8')">8</button>
      <button class="pin-btn" onclick="pinPress('9')">9</button>
      <button class="pin-btn clear" onclick="pinClear()">Clear</button>
      <button class="pin-btn" onclick="pinPress('0')">0</button>
      <button class="pin-btn" onclick="pinPress('back')">⌫</button>
    </div>
    <div class="pin-error" id="pin-error"></div>
  </div>
</div>

<!-- ── APP ────────────────────────────────────────────────────────────────── -->
<div id="app">
  <header>
    <div class="cue-panel-header">
      <div class="cph-title">
        <h3 id="show-name">Loading…</h3>
        <div class="cue-count"><span class="pulse" id="pulse"></span><span id="status-count"></span><span id="status">connecting</span></div>
      </div>
      <button class="top-btn" id="awake-btn" onclick="toggleAwake()" title="Keep screen awake">☾</button>
      <button class="top-btn" onclick="openSheet()">Script</button>
    </div>
    <div class="cue-search">
      <input id="search" type="search" placeholder="Search cues, lines, notes…" autocomplete="off"
             autocorrect="off" autocapitalize="off" spellcheck="false" oninput="onSearch()">
      <button id="search-clear" onclick="clearSearch()">×</button>
    </div>
    <div class="type-strip" id="type-strip"></div>
  </header>

  <div class="cue-list" id="cue-list"></div>
</div>

<!-- ── SHEET ──────────────────────────────────────────────────────────────── -->
<div class="cue-edit-overlay" id="sheet" onclick="if(event.target===this) closeSheet()">
  <div class="cue-edit">
    <h3>Script &amp; display</h3>
    <p class="note">This sheet is read-only. Cues are edited in the dashboard and land here within seconds.</p>

    <label>Script</label>
    <div id="script-list"><div class="note">Loading scripts…</div></div>

    <label style="margin-top:18px;">Text size</label>
    <div class="size-row" id="size-row">
      <button data-sz="12" onclick="setSize(12)">Small</button>
      <button data-sz="14" onclick="setSize(14)">Normal</button>
      <button data-sz="17" onclick="setSize(17)">Large</button>
      <button data-sz="20" onclick="setSize(20)">Huge</button>
    </div>

    <div class="cue-edit-btns">
      <button class="top-btn primary" onclick="closeSheet()">Done</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   MMT Cue Sheet — read-only companion to the Scripts tab in app.html

   Data comes from the Apps Script backend (listScripts / getCueData), not
   localStorage, so this works on a device that has never opened the dashboard.
   localStorage holds only an offline fallback and this device's preferences.

   This page never writes to the Sheet. No saveCueData, ever.
   ═══════════════════════════════════════════════════════════════════════════ */

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzVONJuSlGzl04FZCzd3h45V2AsKC3HkqI6eeaujMetaDGkeGctL9IolMkJNBeJA7BaBg/exec';
const CORRECT_PIN = '1483';
const POLL_MS = 15000;

const SCENE_TYPE_ID = 'scene';
const SHIFT_TYPE_ID = 'shift';
const DEFAULT_CUE_TYPES = [
  { id:'lx',       name:'LX',       color:'#e74c3c' },
  { id:'sfx',      name:'SFX',      color:'#3498db' },
  { id:'fly',      name:'FLY',      color:'#2ecc71' },
  { id:'spot',     name:'SPOT',     color:'#f1c40f' },
  { id:'spot_out', name:'SPOT OUT', color:'#e67e22' },
  { id:'shift',    name:'SHIFT',    color:'#34495e' },
  { id:'scene',    name:'SCENE',    color:'#8e44ad' },
];
const RETIRED_CUE_TYPE_IDS = ['intermission'];

let cueTypes    = DEFAULT_CUE_TYPES.slice();
let cues        = [];
let annotations = {};
let scripts     = [];
let scriptId    = null;
let scriptName  = '';
let activeType  = null;
let query       = '';
let expanded    = {};
let lastSig     = {};
let changedIds  = new Set();
let lastOk      = 0;
let pollTimer   = null;
let wakeLock    = null;
let firstPaint  = true;

const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

const isScene = c => c && c.type === SCENE_TYPE_ID;

function lsGet(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

function jsonp(url, onSuccess, onError, timeoutMs){
  const cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random()*1e6);
  const script = document.createElement('script');
  let done = false;
  const timeout = setTimeout(() => { cleanup(); onError && onError('Timeout'); }, timeoutMs || 15000);
  window[cb] = data => { cleanup(); onSuccess(data); };
  function cleanup(){
    if (done) return;
    done = true;
    clearTimeout(timeout);
    delete window[cb];
    if (script.parentNode) script.parentNode.removeChild(script);
  }
  script.onerror = () => { cleanup(); onError && onError('Script load error'); };
  script.src = url + (url.indexOf('?') === -1 ? '?' : '&') + 'callback=' + cb;
  document.head.appendChild(script);
}

// ── PIN — same behaviour as app.html ────────────────────────────────────────
let pinEntry = '';
function updateDots(){
  for (let i = 0; i < 4; i++){
    const d = document.getElementById('d' + i);
    if (d) d.classList.toggle('filled', i < pinEntry.length);
  }
}
function pinPress(val){
  if (val === 'back'){ pinEntry = pinEntry.slice(0,-1); updateDots(); return; }
  if (pinEntry.length >= 4) return;
  pinEntry += val;
  updateDots();
  if (pinEntry.length === 4) setTimeout(checkPin, 120);
}
function pinClear(){ pinEntry = ''; updateDots(); document.getElementById('pin-error').textContent = ''; }
function checkPin(){
  if (pinEntry === CORRECT_PIN){
    lsSet('mmt_cuelist_ok', '1');
    unlock();
  } else {
    document.getElementById('pin-error').textContent = 'Incorrect PIN';
    pinEntry = ''; updateDots();
    setTimeout(() => { document.getElementById('pin-error').textContent = ''; }, 2000);
  }
}
function unlock(){
  document.getElementById('pin-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  start();
}

// ── Boot ────────────────────────────────────────────────────────────────────
function start(){
  setSize(parseInt(lsGet('mmt_cuelist_size','12'),10) || 12);
  scriptId   = lsGet('mmt_cuelist_script', null);
  scriptName = lsGet('mmt_cuelist_scriptname', '');
  if (scriptName) document.getElementById('show-name').textContent = cleanShowName(scriptName);

  renderCachedIfAny();
  loadScripts();
  if (scriptId) fetchCues(true);

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible'){ fetchCues(); schedulePoll(); reacquireWake(); }
    else if (pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  });
  window.addEventListener('focus', () => fetchCues());
  window.addEventListener('resize', measureHeader);
  window.addEventListener('orientationchange', () => setTimeout(measureHeader, 250));
  schedulePoll();
  setInterval(tickStatus, 1000);
}

function schedulePoll(){
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(() => { if (document.visibilityState === 'visible') fetchCues(); }, POLL_MS);
}

// The header reads off the uploaded script's filename, which carries junk the
// audience for this document doesn't care about: "…Script (1)" is a Drive
// de-duplication artifact, not a production title. Same helper as app.html.
function cleanShowName(raw){
  let s = String(raw || '').replace(/\.[a-z0-9]{2,4}$/i, '');
  for (let i = 0; i < 4; i++){
    s = s.replace(/\s*\(\d+\)\s*$/,'')
         .replace(/\s*[-–—]?\s*(final|draft|copy|rev\.?\s*\d*|v\d+)\s*$/i,'')
         .replace(/\s*(script|libretto|pdf)\s*$/i,'');
  }
  return s.trim() || raw || 'Untitled';
}

// ── Data ────────────────────────────────────────────────────────────────────
function loadScripts(){
  jsonp(SCRIPT_URL + '?action=listScripts&_=' + Date.now(), d => {
    if (!d || !d.success || !d.scripts){ renderScriptList('Could not load the script list.'); return; }
    scripts = d.scripts;
    // Nothing pinned on this device yet — take the most recent script, which is
    // the one being worked on. Overridable from the sheet.
    if (!scriptId && scripts.length){
      const newest = scripts.slice().sort((a,b) => new Date(b.date||0) - new Date(a.date||0))[0];
      pickScript(newest.id, newest.name, true);
    }
    renderScriptList();
  }, () => renderScriptList('Could not load the script list.'));
}

function pickScript(id, name, silent){
  scriptId = id; scriptName = name;
  lsSet('mmt_cuelist_script', id);
  lsSet('mmt_cuelist_scriptname', name);
  document.getElementById('show-name').textContent = cleanShowName(name);
  cues = []; annotations = {}; lastSig = {}; expanded = {}; firstPaint = true;
  renderCachedIfAny();
  renderScriptList();
  fetchCues(true);
  if (!silent) closeSheet();
}

function fetchCues(showLoading){
  if (!scriptId) return;
  if (showLoading) setStatus('loading…', 'stale');
  jsonp(SCRIPT_URL + '?action=getCueData&scriptId=' + encodeURIComponent(scriptId) + '&_=' + Date.now(),
    d => {
      if (!d || !d.success || !d.cueData){ setStatus('no cue data', 'stale'); render(); return; }
      applyPayload(d.cueData);
      try { lsSet('mmt_cuelist_cache_' + scriptId, JSON.stringify(d.cueData)); } catch(e){}
      lastOk = Date.now();
      render();
      tickStatus();
    },
    () => setStatus(lastOk ? 'offline — last copy' : 'could not connect', lastOk ? 'stale' : 'dead')
  );
}

function renderCachedIfAny(){
  if (!scriptId) return;
  try {
    const cached = JSON.parse(lsGet('mmt_cuelist_cache_' + scriptId, 'null'));
    if (cached){ applyPayload(cached); render(); setStatus('last saved copy', 'stale'); }
  } catch(e){}
}

function applyPayload(data){
  cueTypes = mergeCueTypes(data.cueTypes);
  const incoming = Array.isArray(data.cues) ? data.cues : [];
  annotations = data.annotations || {};

  // Flash only what moved, and only after the first paint — otherwise the whole
  // sheet strobes on open.
  changedIds = new Set();
  const nextSig = {};
  incoming.forEach(c => {
    const sig = JSON.stringify([c.type, c.number, c.action, c.cueLine, c.notes || c.description, c.page, c.moves]);
    nextSig[c.id] = sig;
    if (!firstPaint && lastSig[c.id] !== sig) changedIds.add(c.id);
  });
  lastSig = nextSig;
  cues = incoming;
  firstPaint = false;
}

function mergeCueTypes(saved){
  const result = (Array.isArray(saved) ? saved : [])
    .filter(t => t && !RETIRED_CUE_TYPE_IDS.includes(t.id));
  DEFAULT_CUE_TYPES.forEach(def => { if (!result.some(t => t.id === def.id)) result.push(def); });
  return result;
}

const typeOf = id => cueTypes.find(t => t.id === id) || { id, name: String(id||'?').toUpperCase(), color:'#7a8496' };

// Canonical cue order, same rule as app.html: page, then top-to-bottom, then
// left-to-right for boxes on the same line. Cues missing geometry sort to the
// end of their page by number.
function cueRectPos(c){
  const a = (annotations[c.page] || []).find(x => x.type === 'cue' && x.cueId === c.id);
  if (!a || !a.rect) return null;
  return { y: a.rect.y, x: a.rect.x };
}
function cuesInScriptOrder(){
  return cues.slice().sort((a,b) => {
    if (a.page !== b.page) return a.page - b.page;
    const pa = cueRectPos(a), pb = cueRectPos(b);
    if (pa && pb){
      if (Math.abs(pa.y - pb.y) > 6) return pa.y - pb.y;
      return pa.x - pb.x;
    }
    if (pa && !pb) return -1;
    if (!pa && pb) return 1;
    return String(a.number||'').localeCompare(String(b.number||''), undefined, { numeric:true });
  });
}

// ── Filtering ───────────────────────────────────────────────────────────────
function haystack(c){
  const parts = [c.number, c.action, c.cueLine, c.notes || c.description, typeOf(c.type).name, 'p' + c.page, 'pg ' + c.page];
  (c.moves || []).forEach(m => parts.push(m.piece, m.action, m.who, m.spike, m.notes));
  return parts.filter(Boolean).join(' ').toLowerCase();
}
function matches(c){
  if (activeType && c.type !== activeType) return false;
  if (!query) return true;
  const h = haystack(c);
  return query.split(/\s+/).filter(Boolean).every(tok => h.includes(tok));
}

function onSearch(){
  query = document.getElementById('search').value.trim().toLowerCase();
  document.getElementById('search-clear').style.display = query ? 'block' : 'none';
  render();
}
function clearSearch(){
  document.getElementById('search').value = '';
  query = '';
  document.getElementById('search-clear').style.display = 'none';
  render();
}
function setType(id){
  activeType = (activeType === id) ? null : id;   // tap again to clear
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── Render ──────────────────────────────────────────────────────────────────
function render(){
  renderTypeStrip();
  const el = document.getElementById('cue-list');

  if (!cues.length){
    el.innerHTML = '<div class="cue-empty"><b>No cues on this script yet.</b>Place cues in the Scripts tab and they appear here.</div>';
    measureHeader();
    return;
  }

  const ordered = cuesInScriptOrder();

  // Group under scene dividers. Scenes structure the sheet rather than being
  // cues in it, so they aren't filtered or counted.
  const groups = [];
  let current = { scene: null, items: [] };
  ordered.forEach(c => {
    if (isScene(c)){
      if (current.scene || current.items.length) groups.push(current);
      current = { scene: c, items: [] };
    } else {
      current.items.push(c);
    }
  });
  groups.push(current);

  let shown = 0, body = '';
  groups.forEach(g => {
    const visible = g.items.filter(matches);
    shown += visible.length;
    if (!visible.length) return;
    if (g.scene){
      body += `<tr class="scene-row"><td colspan="6">${esc(g.scene.number || 'Scene')}
        <span class="scene-pg">p.${esc(g.scene.page)}</span></td></tr>`;
    }
    body += visible.map(cueRow).join('');
  });

  const total = cues.filter(c => !isScene(c)).length;

  if (!shown){
    const what = query ? 'Nothing matches that search.' : 'No ' + esc(typeOf(activeType).name) + ' cues.';
    const how  = query ? 'Try fewer words, or clear the type filter.' : 'Tap the type again for all cues.';
    el.innerHTML = `<div class="cue-empty"><b>${what}</b>${how}</div>`;
  } else {
    el.innerHTML = `<table class="cue-table">
      <thead><tr>
        <th>Type</th><th>#</th><th>Action</th><th class="h-line">Cue Line</th><th>Notes</th><th>Pg</th>
      </tr></thead>
      <tbody>${body}</tbody>
    </table>`;
  }

  document.getElementById('status-count').textContent = shown + ' of ' + total + ' cues ·';
  measureHeader();
}

function cueRow(c){
  const t = typeOf(c.type);
  const notes = c.notes || c.description || '';
  const isShift = c.type === SHIFT_TYPE_ID;
  const nMoves = (c.moves || []).length;
  const open = !!expanded[c.id];
  const hasDetail = (isShift && nMoves > 0) || !!c.lineCrop;

  let row = `<tr data-cue-id="${esc(c.id)}"${changedIds.has(c.id) ? ' class="changed"' : ''}${hasDetail ? ` onclick="toggle('${esc(c.id)}')"` : ''}>
    <td><span class="ct-type" style="background:${esc(t.color)}">${esc(t.name)}</span></td>
    <td class="ct-num">${esc(c.number || '')}</td>
    <td class="ct-action">${esc(c.action || '')}${isShift && nMoves ? ` <span class="ct-moves">${nMoves} move${nMoves !== 1 ? 's' : ''}${open ? ' ▴' : ' ▾'}</span>` : ''}</td>
    <td class="ct-line">${c.cueLine ? esc(c.cueLine) : (c.lineCrop ? '<span style="opacity:0.5;">📷 line</span>' : '')}</td>
    <td class="ct-notes">${esc(notes)}</td>
    <td class="ct-pg">${esc(c.page)}</td>
  </tr>`;

  if (open && hasDetail){
    let inner = '';
    if (c.lineCrop && !/^data:/.test(c.lineCrop)){
      inner += `<img src="${esc(c.lineCrop)}" alt="Script line" onerror="this.style.display='none'">`;
    }
    if (isShift && nMoves){
      inner += `<table class="mv-grid">
        <thead><tr><th>Piece</th><th>Action</th><th>Who</th><th>Spike</th></tr></thead>
        <tbody>${(c.moves || []).map(m => `<tr>
          <td class="mv-piece">${esc(m.piece || '')}</td>
          <td>${esc(m.action || '')}</td>
          <td class="mv-who">${esc(m.who || '')}</td>
          <td class="mv-who">${esc(m.spike || '')}</td>
        </tr>${m.notes ? `<tr><td colspan="4" class="detail-note">${esc(m.notes)}</td></tr>` : ''}`).join('')}</tbody>
      </table>`;
    }
    row += `<tr class="detail-row"><td colspan="6"><div class="detail-box">${inner}</div></td></tr>`;
  }
  return row;
}

function toggle(id){ expanded[id] = !expanded[id]; render(); }

function renderTypeStrip(){
  const counts = {};
  cues.forEach(c => { if (!isScene(c)) counts[c.type] = (counts[c.type] || 0) + 1; });
  const total = cues.filter(c => !isScene(c)).length;

  let html = `<button class="type-row${!activeType ? ' on' : ''}" style="${!activeType ? 'background:var(--purple);' : ''}"
      onclick="setType(null)">All <span class="type-n">${total}</span></button>`;

  html += cueTypes
    .filter(t => t.id !== SCENE_TYPE_ID && counts[t.id])
    .map(t => {
      const on = activeType === t.id;
      return `<button class="type-row${on ? ' on' : ''}" style="${on ? 'background:' + esc(t.color) + ';' : ''}"
        onclick="setType('${esc(t.id)}')">
        <span class="type-color" style="background:${esc(t.color)}"></span>${esc(t.name)}
        <span class="type-n">${counts[t.id]}</span></button>`;
    }).join('');

  document.getElementById('type-strip').innerHTML = html;
}

function renderScriptList(err){
  const el = document.getElementById('script-list');
  if (err){ el.innerHTML = `<div class="note">${esc(err)}</div>`; return; }
  if (!scripts.length){ el.innerHTML = '<div class="note">No saved scripts yet.</div>'; return; }
  el.innerHTML = scripts.map(s => `
    <button class="script-opt${s.id === scriptId ? ' sel' : ''}"
            onclick="pickScript('${esc(s.id)}','${esc(String(s.name).replace(/'/g,"\\'"))}')">
      <span class="nm">${esc(cleanShowName(s.name))}</span>
      <span class="dt">${esc(s.date || '')}</span>
    </button>`).join('');
}

// ── Status line ─────────────────────────────────────────────────────────────
function setStatus(text, cls){
  document.getElementById('status').textContent = text;
  document.getElementById('pulse').className = 'pulse' + (cls ? ' ' + cls : '');
}
function tickStatus(){
  if (!lastOk) return;
  const s = Math.round((Date.now() - lastOk) / 1000);
  if (s < 5)       setStatus('live', '');
  else if (s < 90) setStatus('updated ' + s + 's ago', '');
  else             setStatus('updated ' + Math.round(s/60) + 'm ago', 'stale');
}

// Column headers stick below the toolbar, whose height changes with text size,
// chip wrapping and the iPad's safe area — so measure it rather than guess.
function measureHeader(){
  const h = document.querySelector('header');
  if (h) document.documentElement.style.setProperty('--hdr', h.offsetHeight + 'px');
}

// ── Display prefs ───────────────────────────────────────────────────────────
function setSize(px){
  document.documentElement.style.setProperty('--ct-fs', px + 'px');
  lsSet('mmt_cuelist_size', String(px));
  document.querySelectorAll('#size-row button').forEach(b =>
    b.classList.toggle('on', parseInt(b.dataset.sz,10) === px));
  measureHeader();
}

// A backstage iPad shouldn't sleep between cues.
async function toggleAwake(){
  const btn = document.getElementById('awake-btn');
  if (wakeLock){
    try { await wakeLock.release(); } catch(e){}
    wakeLock = null;
    btn.classList.remove('primary'); btn.textContent = '☾';
    return;
  }
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => {
      wakeLock = null;
      btn.classList.remove('primary'); btn.textContent = '☾';
    });
    btn.classList.add('primary'); btn.textContent = '☀';
  } catch(e){
    btn.textContent = '✕';
    setTimeout(() => { btn.textContent = '☾'; }, 1500);
  }
}
// iOS drops the lock when the app backgrounds; take it again on return.
async function reacquireWake(){
  const btn = document.getElementById('awake-btn');
  if (!btn.classList.contains('primary') || wakeLock) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
}

function openSheet(){ document.getElementById('sheet').classList.add('open'); }
function closeSheet(){ document.getElementById('sheet').classList.remove('open'); }

document.addEventListener('keydown', e => {
  if (document.getElementById('pin-screen').style.display === 'none') return;
  if (e.key >= '0' && e.key <= '9') pinPress(e.key);
  else if (e.key === 'Backspace') pinPress('back');
});

if (lsGet('mmt_cuelist_ok','') === '1') unlock(); else updateDots();
</script>
