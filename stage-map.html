<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stage Map — MMT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--
  STAGE MAP — a top-down map of the stage (both wings and backstage) with the
  show's pieces placed where they sit: one map for Presets, then one for each
  set change (a change only needs the pieces that move; the rest carry on from
  the map before it).

  Opened over the cue sheet (Presets "Map", a set change's "Map") and the
  script page (a SHIFT cue's set change panel), or on its own:
    stage-map.html?script=<driveId>&step=presets|<cueId>

  Saved in the Sheet's KVStore, never in the cue data:
    'stageplan'            the theatre's ground plan: { img:{id,url,w,h}, ppf }
                           (ppf = image pixels per foot, set by tapping two
                           points a known distance apart)
    'stagemap_<scriptId>'  { plan?, pieces:{ key:{name,w,d,shape} },
                             maps:{ presets|<cueId>: { key:{x,y,r} | null } } }
                           x, y in feet from the plan's top-left; r in degrees.
                           null = taken off the map from that step on.
  Saving replays small operations onto a fresh copy of the server's value (as
  spike-map.html does), so two people working at once both keep their changes.
-->
<script>
try {
  var _own = localStorage.getItem('mmt_cuelist_theme');
  var _t = (_own === 'light' || _own === 'dark' || _own === 'red') ? _own : (localStorage.getItem('mmt_theme') === 'dark' ? 'dark' : 'light');
  if (_t !== 'light') document.documentElement.setAttribute('data-theme', 'dark');
} catch (e) {}
</script>
<style>
  :root {
    --bg: #f4f4f5; --surface: #ffffff; --surface-2: #f8f8f9; --border: #e3e3e7; --border-2: #d1d1d7;
    --text: #141416; --text-muted: #6b6b75; --accent: #141416; --accent-ink: #ffffff;
    --sel: #2563eb; --sel-soft: rgba(37,99,235,.14); --move: #c2410c; --plan-bg: #e9e9ec;
    --piece: rgba(255,255,255,.92); --piece-ink: #141416; --piece-line: #141416;
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  }
  [data-theme="dark"] {
    --bg: #0f0f11; --surface: #1b1b1f; --surface-2: #232328; --border: #2e2e34; --border-2: #3a3a42;
    --text: #ececef; --text-muted: #9a9aa3; --accent: #ececef; --accent-ink: #111113;
    --sel: #60a5fa; --sel-soft: rgba(96,165,250,.18); --move: #fb923c; --plan-bg: #26262b;
    --piece: rgba(30,30,34,.92); --piece-ink: #f1f1f3; --piece-line: #f1f1f3;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; font-family: 'DM Sans', system-ui, sans-serif; background: var(--bg); color: var(--text); -webkit-tap-highlight-color: transparent; overflow: hidden; }
  button, input, select { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  .app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: calc(8px + var(--safe-t)) 12px 8px; background: #111113; color: #f4f4f5; }
  header h1 { font-size: 16px; margin: 0 6px 0 0; white-space: nowrap; }
  header .show { font-size: 13px; color: #a1a1aa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }
  .hb { background: rgba(255,255,255,.12); color: #f4f4f5; border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; min-height: 38px; }
  .hb:hover { background: rgba(255,255,255,.2); }
  .hb:focus-visible, .tb:focus-visible, .chip:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
  .hb[disabled] { opacity: .35; cursor: default; }
  .step { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .step select { background: rgba(255,255,255,.12); color: #f4f4f5; border: 0; border-radius: 999px; padding: 8px 12px; font-weight: 600; font-size: 14px; max-width: 46vw; min-height: 38px; }
  .step select option { color: #111; }
  .save { font-size: 12.5px; color: #a1a1aa; min-width: 60px; text-align: right; }
  .save.err { color: #fca5a5; }
  .main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 0; }
  .stage { position: relative; min-width: 0; min-height: 0; background: var(--plan-bg); overflow: hidden; touch-action: none; }
  .stage svg { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }
  .zoom { position: absolute; right: 12px; bottom: calc(12px + var(--safe-b)); display: flex; gap: 6px; }
  .zoom button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border-2); background: var(--surface); font-size: 18px; font-weight: 700; }
  .banner { position: absolute; left: 12px; right: 12px; top: 12px; background: var(--sel); color: #fff; border-radius: 12px; padding: 10px 14px; font-weight: 600; font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; z-index: 5; }
  .banner[hidden] { display: none; }
  .banner input { width: 64px; padding: 6px 8px; border-radius: 8px; border: 0; color: #111; font-weight: 600; }
  .banner button { background: rgba(255,255,255,.22); color: #fff; border: 0; border-radius: 999px; padding: 6px 14px; font-weight: 600; }
  .banner button.pri { background: #fff; color: var(--sel); }
  .side { background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 12px 12px calc(16px + var(--safe-b)); display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .side h2 { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 6px; }
  .side section { display: flex; flex-direction: column; gap: 6px; }
  .note { font-size: 13px; color: var(--text-muted); margin: 0; }
  .plist { display: flex; flex-direction: column; gap: 4px; }
  .prow { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); text-align: left; width: 100%; font-size: 14px; min-height: 42px; }
  .prow:hover { border-color: var(--border-2); }
  .prow.on { border-color: var(--sel); background: var(--sel-soft); }
  .prow b { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prow small { color: var(--text-muted); font-size: 12px; white-space: nowrap; }
  .prow .mv { color: var(--move); font-weight: 700; font-size: 11px; }
  .prow .off { color: var(--text-muted); font-style: italic; }
  .tb { border: 1px solid var(--border-2); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-weight: 600; font-size: 13px; min-height: 36px; }
  .tb.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .tb.warn { color: #b42318; border-color: rgba(180,35,24,.35); }
  .tb[disabled] { opacity: .4; cursor: default; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .field { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--text-muted); }
  .field input, .field select { font-size: 15px; padding: 8px 10px; border: 1px solid var(--border-2); border-radius: 9px; background: var(--surface-2); color: var(--text); min-width: 0; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--border-2); background: var(--surface-2); border-radius: 999px; padding: 6px 11px; font-size: 13px; font-weight: 600; }
  .chip small { font-weight: 500; color: var(--text-muted); margin-left: 4px; }
  details > summary { cursor: pointer; font-weight: 600; font-size: 14px; padding: 6px 0; }
  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .empty-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; max-width: 420px; display: flex; flex-direction: column; gap: 10px; }
  .empty-card h2 { margin: 0; font-size: 18px; }
  .empty-card p { margin: 0; color: var(--text-muted); font-size: 14px; line-height: 1.45; }
  .upl { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 10px 16px; font-weight: 600; cursor: pointer; }
  .toast { position: fixed; left: 50%; bottom: calc(18px + var(--safe-b)); transform: translateX(-50%); background: #111113; color: #fff; padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; z-index: 50; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.on { opacity: 1; }
  .gate { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; }
  /* pieces */
  .pc rect.body, .pc ellipse.body { fill: var(--piece); stroke: var(--piece-line); }
  .pc text { fill: var(--piece-ink); font-family: 'DM Sans', sans-serif; font-weight: 700; pointer-events: none; }
  .pc.moved rect.body, .pc.moved ellipse.body { stroke: var(--move); }
  .pc.inherit { opacity: .62; }
  .pc.sel rect.body, .pc.sel ellipse.body { stroke: var(--sel); }
  .pc { cursor: grab; }
  .ro .pc { cursor: default; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--text-muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 2px solid var(--piece-line); margin-right: 4px; vertical-align: -2px; }
  .legend i.mv { border-color: var(--move); } .legend i.inh { opacity: .55; }
  @media (max-width: 760px) {
    .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 42%); }
    .side { border-left: 0; border-top: 1px solid var(--border); }
    header .show { display: none; }
    .step { margin-left: 0; width: 100%; }
    .step select { flex: 1; max-width: none; }
  }
  #build-tag { position: fixed; bottom: 4px; right: 8px; font-size: 11px; color: #999; z-index: 999; pointer-events: none; background: white; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<div class="gate" id="gate" hidden><div class="empty-card"><h2>Open this from the cue sheet</h2><p>Sign in on the dashboard or the cue sheet first, then open the stage map from Presets or a set change.</p></div></div>
<div class="app" id="app" hidden>
  <header>
    <button class="hb" id="close-btn" onclick="closeMap()" aria-label="Close the stage map">‹ Back</button>
    <h1>Stage map</h1><span class="show" id="show-name"></span>
    <div class="step">
      <button class="hb" id="prev-btn" onclick="stepBy(-1)" aria-label="Previous map">‹</button>
      <select id="step-sel" onchange="goStep(this.value)" aria-label="Which map"></select>
      <button class="hb" id="next-btn" onclick="stepBy(1)" aria-label="Next map">›</button>
    </div>
    <span class="save" id="save-state" aria-live="polite"></span>
  </header>
  <div class="main">
    <div class="stage" id="stage">
      <svg id="svg" aria-label="Stage map"></svg>
      <div class="banner" id="banner" hidden></div>
      <div class="empty" id="empty" hidden></div>
      <div class="zoom"><button onclick="zoomBy(1.25)" aria-label="Zoom in">+</button><button onclick="zoomBy(0.8)" aria-label="Zoom out">−</button><button onclick="fit()" aria-label="Fit the plan" style="font-size:13px">Fit</button></div>
    </div>
    <aside class="side" id="side"></aside>
  </div>
</div>
<div class="toast" id="toast"></div>
<div id="build-tag">10.31 v1</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzVONJuSlGzl04FZCzd3h45V2AsKC3HkqI6eeaujMetaDGkeGctL9IolMkJNBeJA7BaBg/exec';
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const PLAN_KEY = 'stageplan';
const POLL_MS = 30000;
// Stock pieces: [name, width ft, depth ft, shape]. Width runs left-right as placed.
const STOCK = {
  'Platforms & stairs': [['4×8 platform', 8, 4], ['4×4 platform', 4, 4], ['2×8 platform', 8, 2], ['2×4 platform', 4, 2], ['Stair unit, 3 wide', 3, 4], ['Stair unit, 4 wide', 4, 4]],
  'Flats & doors': [['Flat, 2 ft', 2, 0.25], ['Flat, 4 ft', 4, 0.25], ['Flat, 8 ft', 8, 0.25], ['Door unit', 4, 1], ['Window unit', 4, 1]],
  'Furniture': [['Table', 5, 3], ['Round table', 4, 4, 'round'], ['Chair', 1.5, 1.5], ['Armchair', 3, 3], ['Sofa', 7, 3], ['Bed, full', 4.5, 6.5], ['Desk', 5, 2.5], ['Bench', 6, 1.5]],
};

const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 2400); }
function jsonp(url, ok, fail, ms) {
  const cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6), s = document.createElement('script');
  let done = false;
  const t = setTimeout(() => { end(); fail && fail('timeout'); }, ms || 15000);
  window[cb] = d => { end(); ok(d); };
  function end() { if (done) return; done = true; clearTimeout(t); delete window[cb]; if (s.parentNode) s.parentNode.removeChild(s); }
  s.onerror = () => { end(); fail && fail('error'); };
  s.src = url + (url.indexOf('?') === -1 ? '?' : '&') + 'callback=' + cb;
  document.head.appendChild(s);
}

// ── Who's here ─────────────────────────────────────────────────────────────
// Signed in on the cue sheet or the dashboard (same device storage). Crew
// whose scripts are view only see the map but can't change it.
let role = '', who = '';
(function gate() {
  const cl = lsGet('mmt_cuelist_ok', '') === '1';
  const t = parseInt(lsGet('mmt_unlock_time', '0'), 10) || 0;
  const dash = t && Date.now() - t < 30 * 864e5 && lsGet('mmt_user_role', '');
  if (!cl && !dash) { document.getElementById('gate').hidden = false; return; }
  role = cl ? lsGet('mmt_cuelist_role', 'td') : lsGet('mmt_user_role', 'td');
  who = cl ? lsGet('mmt_cuelist_name', '') : lsGet('mmt_user_name', '');
  document.getElementById('app').hidden = false;
})();
function canEdit() {
  if (role !== 'crew') return true;
  try { const p = JSON.parse(lsGet('mmt_crew_perms', 'null')); return !(p && p.edit && p.edit.scripts === false); } catch (e) { return true; }
}

// ── State ──────────────────────────────────────────────────────────────────
const Q = new URLSearchParams(location.search);
const EMBED = window.parent !== window || Q.get('embed') === '1';
let scriptId = Q.get('script') || lsGet('mmt_cur_script_id', '') || (() => { try { return JSON.parse(lsGet('mmt_cur_script', 'null')).id; } catch (e) { return ''; } })();
let showName = Q.get('name') || '';
let cues = [], annotations = {}, presets = {};
let plan = null;              // theatre plan { img, ppf }
let sm = { pieces: {}, maps: {} };
let steps = [{ id: 'presets', label: 'Presets', moves: [] }];
let stepIdx = 0, sel = null, mode = null, scaleA = null;
let pending = { plan: [], map: [] }, saving = false;
const kvKey = () => 'stagemap_' + scriptId;

function load() {
  if (!scriptId) { renderAll(); return; }
  try { const c = JSON.parse(lsGet('mmt_stagemap_cache_' + scriptId, 'null')); if (c) sm = c; } catch (e) {}
  try { const c = JSON.parse(lsGet('mmt_stageplan_cache', 'null')); if (c) plan = c; } catch (e) {}
  let left = 3;
  const done = () => { if (--left === 0) { buildSteps(); const want = Q.get('step'); if (want) { const i = steps.findIndex(s => s.id === want); if (i >= 0) stepIdx = i; } renderAll(); fit(); } };
  jsonp(SCRIPT_URL + '?action=getCueData&scriptId=' + encodeURIComponent(scriptId) + '&_=' + Date.now(), d => {
    const cd = (d && (d.cueData || d.data)) || {};
    cues = Array.isArray(cd.cues) ? cd.cues : []; annotations = cd.annotations || {}; presets = cd.presets || {};
    done();
  }, done);
  jsonp(SCRIPT_URL + '?action=getKV&key=' + PLAN_KEY + '&_=' + Date.now(), d => { if (d && d.value && d.value.img) { plan = d.value; lsSet('mmt_stageplan_cache', JSON.stringify(plan)); } done(); }, done);
  jsonp(SCRIPT_URL + '?action=getKV&key=' + kvKey() + '&_=' + Date.now(), d => { if (d && d.value && typeof d.value === 'object') { sm = norm(d.value); lsSet('mmt_stagemap_cache_' + scriptId, JSON.stringify(sm)); } done(); }, done);
  if (!showName) { const sid = scriptId; jsonp(SCRIPT_URL + '?action=listScripts&_=' + Date.now(), d => { const s = (d && d.scripts || []).find(x => x.id === sid); if (s) { showName = String(s.name || '').replace(/\.pdf$/i, ''); document.getElementById('show-name').textContent = showName; } }); }
}
function norm(v) { v = v || {}; return { plan: v.plan || null, pieces: v.pieces || {}, maps: v.maps || {} }; }
// Presets, then each set change in script order.
function annY(c) { const a = (annotations[c.page] || []).find(x => x && x.type === 'cue' && x.cueId === c.id); return a ? (a.rect ? a.rect.y : a.y || 0) : 0; }
function buildSteps() {
  const sh = cues.filter(c => c.type === 'shift').sort((a, b) => (a.page - b.page) || (annY(a) - annY(b)) || String(a.number || '').localeCompare(String(b.number || ''), undefined, { numeric: true }));
  steps = [{ id: 'presets', label: 'Presets', moves: [] }].concat(sh.map(c => {
    const n = (String(c.number || '').match(/(\d+(?:\.\d+)?[A-Za-z]*)\s*$/) || [])[1] || c.number || '';
    return { id: c.id, label: '#' + n + (c.cueLine ? ' · ' + c.cueLine : '') + (c.page ? ' (pg. ' + c.page + ')' : ''), moves: (c.moves || []).map(m => String(m.piece || '').trim().toLowerCase()).filter(Boolean) };
  }));
}
// Every piece named in a set change, plus pieces added here.
function pieceList() {
  const seen = new Map();
  cues.filter(c => c.type === 'shift').forEach(c => (c.moves || []).forEach(m => { const v = String(m.piece || '').trim(); if (v && !seen.has(v.toLowerCase())) seen.set(v.toLowerCase(), v); }));
  const out = [...seen].map(([key, name]) => ({ key, name, fromSheet: true, def: sm.pieces[key] || null }));
  Object.keys(sm.pieces).forEach(k => { if (!seen.has(k) && sm.pieces[k] && !sm.pieces[k].gone) out.push({ key: k, name: sm.pieces[k].name, fromSheet: false, def: sm.pieces[k] }); });
  return out.sort((a, b) => a.name.localeCompare(b.name));
}
function activePlan() { return (sm.plan && sm.plan.img) ? sm.plan : plan; }
// Where a piece sits at a step: the latest map at or before it that places it.
function posAt(key, i) {
  for (let k = i; k >= 0; k--) { const m = sm.maps[steps[k].id]; if (m && key in m) return m[key] ? { ...m[key], own: k === i } : null; }
  return null;
}

// ── Saving: small operations replayed onto the server's copy ───────────────
function applyMapOp(v, op) {
  v.pieces = v.pieces || {}; v.maps = v.maps || {};
  if (op.t === 'piece') { if (op.v) v.pieces[op.key] = op.v; else delete v.pieces[op.key]; }
  if (op.t === 'pos') { v.maps[op.step] = v.maps[op.step] || {}; if (op.v === undefined) delete v.maps[op.step][op.key]; else v.maps[op.step][op.key] = op.v; }
  if (op.t === 'showplan') v.plan = op.v;
  if (op.t === 'drop') Object.keys(v.maps).forEach(s => { if (v.maps[s]) delete v.maps[s][op.key]; });
}
function op(o) { if (!canEdit()) return; applyMapOp(sm, o); pending.map.push(o); lsSet('mmt_stagemap_cache_' + scriptId, JSON.stringify(sm)); queueSave(); }
function planOp(v) { plan = v; pending.plan.push(v); lsSet('mmt_stageplan_cache', JSON.stringify(plan)); queueSave(); }
function setSave(t, err) { const el = document.getElementById('save-state'); el.textContent = t; el.className = 'save' + (err ? ' err' : ''); }
function queueSave() { setSave('Saving…'); clearTimeout(queueSave._t); queueSave._t = setTimeout(flush, 500); }
function post(key, value) {
  return fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'saveKV', key, value }) })
    .then(r => r.text()).then(t => { let d = null; try { d = JSON.parse(t); } catch (e) {} if (d && d.success === false) throw new Error(d.error || 'Not saved'); });
}
function flush() {
  if (saving) return;
  if (!pending.map.length && !pending.plan.length) { setSave(''); return; }
  saving = true;
  const mapOps = pending.map.slice(), planV = pending.plan.length ? pending.plan[pending.plan.length - 1] : null, planN = pending.plan.length;
  const jobs = [];
  if (planV) jobs.push(post(PLAN_KEY, planV));
  if (mapOps.length) jobs.push(new Promise((res, rej) => jsonp(SCRIPT_URL + '?action=getKV&key=' + kvKey() + '&_=' + Date.now(), d => {
    const fresh = norm(d && d.value && typeof d.value === 'object' ? d.value : {});
    mapOps.forEach(o => applyMapOp(fresh, o));
    fresh._savedAt = new Date().toISOString();
    post(kvKey(), fresh).then(() => { sm = fresh; pending.map.slice(mapOps.length).forEach(o => applyMapOp(sm, o)); res(); }, rej);
  }, rej)));
  Promise.all(jobs).then(() => {
    saving = false; pending.map = pending.map.slice(mapOps.length); pending.plan = pending.plan.slice(planN);
    lsSet('mmt_stagemap_cache_' + scriptId, JSON.stringify(sm));

  svg.setPointerCapture(e.pointerId);

  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), vb: { ...vb } }; drag = null; return; }
  const p = pt(e);
  if (mode === 'scale1' || mode === 'scale2') { drag = { tap: true, sx: e.clientX, sy: e.clientY, p }; return; }
  const g = e.target.closest && e.target.closest('.pc');
  if (g && canEdit()) {
    const key = g.getAttribute('data-key'), at = posAt(key, stepIdx) || { x: 0, y: 0, r: 0 };
    sel = key; drag = { key, ox: p.x - at.x * ppf(), oy: p.y - at.y * ppf(), r: at.r || 0, moved: false, sx: e.clientX, sy: e.clientY };
    draw(); renderSide(); return;
  }
  if (g) { sel = g.getAttribute('data-key'); draw(); renderSide(); return; }
  drag = { pan: true, sx: e.clientX, sy: e.clientY, vb: { ...vb }, moved: false };
});
svg.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y), r = svg.getBoundingClientRect();
    const cx = pinch.vb.x + ((a.x + b.x) / 2 - r.left) / r.width * pinch.vb.w, cy = pinch.vb.y + ((a.y + b.y) / 2 - r.top) / r.height * pinch.vb.h;
    vb = { ...pinch.vb }; zoomBy(d / pinch.d, cx, cy); return;
  }
  if (!drag) return;
  if (drag.pan) { const r = svg.getBoundingClientRect(); vb.x = drag.vb.x - (e.clientX - drag.sx) / r.width * vb.w; vb.y = drag.vb.y - (e.clientY - drag.sy) / r.height * vb.h; setVB(); drag.moved = true; return; }
  if (drag.key) {
    if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 4) return;
    drag.moved = true;
    const p = pt(e), k = ppf(), g = svg.querySelector(`.pc[data-key="${CSS.escape(drag.key)}"]`);
    drag.nx = (p.x - drag.ox) / k; drag.ny = (p.y - drag.oy) / k;
    if (e.shiftKey || lsGet('mmt_stagemap_snap', '1') === '1') { drag.nx = Math.round(drag.nx * 4) / 4; drag.ny = Math.round(drag.ny * 4) / 4; }   // snap to 3"
    if (g) g.setAttribute('transform', `translate(${drag.nx * k} ${drag.ny * k}) rotate(${drag.r})`);
  }
});
function endPtr(e) {
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (!drag) return;
  const d = drag; drag = null;
  if (d.tap && Math.hypot(e.clientX - d.sx, e.clientY - d.sy) < 10) {
    if (mode === 'scale1') { scaleA = d.p; mode = 'scale2'; banner(); draw(); }
    else if (mode === 'scale2') { scaleA.b = d.p; mode = 'scaleN'; banner(); draw(); }
    return;
  }
  if (d.key && d.moved && d.nx != null) { setPos({ x: d.nx, y: d.ny, r: d.r }); draw(); renderSide(); }
  if (d.pan && !d.moved && sel) { sel = null; draw(); renderSide(); }
}
svg.addEventListener('pointerup', endPtr);
svg.addEventListener('pointercancel', endPtr);
svg.addEventListener('wheel', e => { e.preventDefault(); const p = pt(e); zoomBy(e.deltaY < 0 ? 1.15 : 0.87, p.x, p.y); }, { passive: false });
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input, select, textarea')) { if (e.key === 'Enter' && mode === 'scaleN') finishScale(); return; }
  if (e.key === 'Escape') { if (mode) cancelScale(); else if (sel) { sel = null; draw(); renderSide(); } else closeMap(); }
  if (!sel || !canEdit()) return;
  const step = e.shiftKey ? 1 : 0.25, p = posAt(sel, stepIdx);
  const mv = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
  if (mv && p) { e.preventDefault(); setPos({ x: p.x + mv[0], y: p.y + mv[1], r: p.r || 0 }); draw(); }
  if ((e.key === 'r' || e.key === 'R') && p) rot(e.shiftKey ? -15 : 15);
});
window.addEventListener('resize', () => { const c = { x: vb.x + vb.w / 2, y: vb.y + vb.h / 2 }, r = svg.getBoundingClientRect(); vb.h = vb.w * r.height / (r.width || 1); vb.x = c.x - vb.w / 2; vb.y = c.y - vb.h / 2; setVB(); });

function closeMap() {
  if (EMBED) { try { window.parent.postMessage({ mmt: 'stagemap-close' }, location.origin); } catch (e) {} return; }
  if (history.length > 1) history.back(); else location.href = 'cue-list.html';
}
// Someone else's changes, while nobody is mid-drag here.
setInterval(() => {
  if (!scriptId || saving || pending.map.length || drag || document.hidden) return;
  jsonp(SCRIPT_URL + '?action=getKV&key=' + kvKey() + '&_=' + Date.now(), d => {
    if (saving || pending.map.length || drag) return;
    if (d && d.value && typeof d.value === 'object') { const n = norm(d.value); if (JSON.stringify(n) !== JSON.stringify(sm)) { sm = n; lsSet('mmt_stagemap_cache_' + scriptId, JSON.stringify(sm)); draw(); renderSide(); } }
  });
}, POLL_MS);
if (!document.getElementById('app').hidden) load();
</script>
