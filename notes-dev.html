<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Show Notes · DEV</title>
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16161f" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon-192.png" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<!--
  MMT Show Notes — DEV build 10.14 v1

  A sandbox for the structured show-notes page before it goes into app.html.
  It READS the live show list (to know which shows exist) and never writes to
  the live backend. Everything it saves goes through a separate Apps Script
  project (apps-script/ShowNotesDev.gs) into its own Drive folder.
-->
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --surface-2: #fbfaf7;
  --border: rgba(28,25,23,0.11); --border-strong: rgba(28,25,23,0.20);
  --text: #1c1917; --text-muted: #57534e; --text-faint: #78716c;
  --purple: #4f46b8; --purple-dark: #3a3390; --purple-light: #eeedfb;
  --blue: #155e9c; --blue-light: #e8f1fa;
  --green: #3b6d11; --green-light: #edf4e3;
  --amber: #a85c07; --amber-light: #fbf1e3;
  --red: #b02a20; --red-light: #fbeceb;
  --grey-light: #efeeea;
  --radius: 14px; --radius-sm: 10px;
  --ring: 0 0 0 3px rgba(79,70,184,0.28);
  --shadow: 0 1px 2px rgba(28,25,23,0.06), 0 4px 16px rgba(28,25,23,0.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16161f; --surface: #1f1f2c; --surface-2: #242433;
    --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.20);
    --text: #e8e8ef; --text-muted: #a6a6bd; --text-faint: #7f7f98;
    --purple: #9b93f2; --purple-dark: #c2bdf8; --purple-light: #2a2745;
    --blue: #82b8f0; --blue-light: #19284a;
    --green: #8fcf6a; --green-light: #1d3318;
    --amber: #f0b25e; --amber-light: #3a2a14;
    --red: #f08a80; --red-light: #3d1d1b;
    --grey-light: #2a2a38;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16161f; --surface: #1f1f2c; --surface-2: #242433;
  --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.20);
  --text: #e8e8ef; --text-muted: #a6a6bd; --text-faint: #7f7f98;
  --purple: #9b93f2; --purple-dark: #c2bdf8; --purple-light: #2a2745;
  --blue: #82b8f0; --blue-light: #19284a;
  --green: #8fcf6a; --green-light: #1d3318;
  --amber: #f0b25e; --amber-light: #3a2a14;
  --red: #f08a80; --red-light: #3d1d1b;
  --grey-light: #2a2a38;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.45 'DM Sans', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding-bottom: env(safe-area-inset-bottom);
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: none; box-shadow: var(--ring); }
.mono { font-family: 'DM Mono', monospace; }

/* ── top bar ── */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.back { color: var(--text-muted); text-decoration: none; font-size: 14px; padding: 8px 4px; white-space: nowrap; }
.back:hover { color: var(--text); }
.topbar h1 { font-size: 17px; font-weight: 600; margin: 0; white-space: nowrap; }
.dev-badge {
  font: 500 11px 'DM Mono', monospace; letter-spacing: .04em;
  background: var(--amber-light); color: var(--amber);
  padding: 3px 7px; border-radius: 6px;
}
.spacer { flex: 1; }
.sync {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--text-muted); white-space: nowrap;
  background: none; border: 0; padding: 8px 6px; border-radius: 8px;
}
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex: none; }
.sync.busy .dot { background: var(--amber); animation: pulse 1s infinite; }
.sync.err .dot { background: var(--red); }
.sync.demo .dot { background: var(--text-faint); }
@keyframes pulse { 50% { opacity: .35; } }
.sync { min-width: 0; flex: 0 1 auto; }
#sync-text { overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 520px) {
  .topbar { gap: 6px; padding-left: 12px; padding-right: 10px; }
  .back .lbl { display: none; }
  .back { font-size: 18px; padding: 8px 6px; }
  .icon-btn { min-width: 36px; }
}
.icon-btn {
  min-width: 40px; height: 40px; border-radius: 10px; border: 1px solid transparent;
  background: none; color: var(--text-muted); display: inline-grid; place-items: center; font-size: 17px;
}
.icon-btn:hover { background: var(--surface); border-color: var(--border); color: var(--text); }

/* ── layout ── */
.wrap { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 20px; max-width: 1240px; margin: 0 auto; padding: 18px 16px 80px; }
@media (max-width: 879px) { .wrap { grid-template-columns: minmax(0, 1fr); padding-top: 12px; } }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }

.devnote {
  grid-column: 1 / -1;
  font-size: 13px; color: var(--text-muted);
  background: var(--amber-light); border-radius: var(--radius-sm); padding: 9px 12px;
}
.devnote b { color: var(--amber); font-weight: 600; }

/* ── show list ── */
.shows { padding: 8px; align-self: start; position: sticky; top: 78px; max-height: calc(100vh - 96px); overflow: auto; }
.shows h3 { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-faint); margin: 12px 10px 4px; }
.shows h3:first-child { margin-top: 6px; }
.show-btn {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  background: none; border: 0; border-radius: 10px; padding: 9px 10px; min-height: 44px;
}
.show-btn:hover { background: var(--surface-2); }
.show-btn.on { background: var(--purple-light); color: var(--purple-dark); }
.show-btn .nm { flex: 1; min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.show-btn .dt { font-size: 12px; color: var(--text-faint); white-space: nowrap; }
.show-btn.on .dt { color: inherit; opacity: .75; }
.tag { font: 500 10px 'DM Mono', monospace; padding: 2px 5px; border-radius: 5px; background: var(--grey-light); color: var(--text-muted); }
.tag.ms { background: var(--blue-light); color: var(--blue); }
.tag.ct { background: var(--green-light); color: var(--green); }
.legacy { font-size: 12.5px; color: var(--text-faint); padding: 4px 10px 8px; }
.legacy a { color: var(--text-muted); }
details.legacy-list summary { cursor: pointer; list-style: none; }
details.legacy-list summary::-webkit-details-marker { display: none; }
.legacy-row { display: flex; gap: 8px; padding: 6px 10px; font-size: 13px; color: var(--text-muted); }
.legacy-row span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legacy-row a { color: var(--purple); text-decoration: none; white-space: nowrap; }

.show-select { display: none; }
@media (max-width: 879px) {
  .shows { display: none; }
  .show-select { display: block; width: 100%; margin-bottom: 14px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); font-size: 16px; font-weight: 500; }
}

/* ── notebook ── */
.main { min-width: 0; }
.nb-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin: 4px 2px 14px; }
.nb-head h2 { font-size: 26px; line-height: 1.15; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.nb-head .sub { color: var(--text-muted); font-size: 14px; margin-top: 3px; }
.nb-head .acts { margin-left: auto; display: flex; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 0 14px; border-radius: 10px;
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
  font-weight: 500; font-size: 14px; text-decoration: none; white-space: nowrap;
}
.btn:hover { border-color: var(--purple); }
.btn.primary { background: var(--purple); border-color: var(--purple); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #16161f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #16161f; } }
.btn.danger { color: var(--red); }
.btn.ghost { border-color: transparent; background: none; color: var(--text-muted); }
.btn.ghost:hover { color: var(--text); background: var(--surface); border-color: var(--border); }
.btn.sm { min-height: 34px; padding: 0 10px; font-size: 13px; }

.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.search {
  flex: 1 1 220px; min-width: 0; display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0 12px; min-height: 42px;
}
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 16px; padding: 9px 0; }
.search .x { border: 0; background: none; color: var(--text-faint); font-size: 18px; padding: 4px; }
.seg { display: inline-flex; background: var(--grey-light); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: 7px 12px; border-radius: 8px; font-size: 13.5px; color: var(--text-muted); font-weight: 500; min-height: 36px; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
.tab {
  flex: none; display: inline-flex; align-items: center; gap: 7px;
  min-height: 40px; padding: 0 13px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text-muted);
  font-weight: 500; font-size: 14px; white-space: nowrap;
}
.tab:hover { color: var(--text); border-color: var(--border-strong); }
.tab.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.tab .n { font: 500 11px 'DM Mono', monospace; opacity: .7; }
.tab.add { border-style: dashed; color: var(--purple); }

.panel { padding: 18px 18px 8px; }
@media (max-width: 560px) { .panel { padding: 14px 12px 6px; } }
.panel-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.panel-head h3 { margin: 0; font-size: 19px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

.meta { display: grid; grid-template-columns: 70px minmax(0,1fr); gap: 8px 12px; align-items: start; margin-bottom: 14px; }
.meta label { font-size: 12px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: .05em; padding-top: 9px; }
.about {
  width: 100%; resize: none; border: 1px solid transparent; border-radius: 10px;
  background: var(--surface-2); padding: 8px 10px; min-height: 40px; font-size: 15px; line-height: 1.45; overflow: hidden;
}
.about:hover { border-color: var(--border); }
.about:focus { border-color: var(--purple); background: var(--surface); outline: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 40px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  font: 500 12.5px 'DM Mono', monospace; padding: 4px 8px; border-radius: 7px;
  background: var(--blue-light); color: var(--blue);
}
.chip button { border: 0; background: none; color: inherit; opacity: .6; padding: 0 0 0 2px; font-size: 14px; line-height: 1; }
.chip button:hover { opacity: 1; }
.chip-in { border: 1px dashed var(--border-strong); border-radius: 7px; background: none; padding: 5px 8px; width: 92px; font: 500 13px 'DM Mono', monospace; }
.chip-in:focus { border-style: solid; border-color: var(--purple); outline: none; }

.quick { display: flex; gap: 8px; margin: 4px 0 8px; }
.quick input {
  flex: 1; min-width: 0; border: 1px solid var(--border-strong); border-radius: 10px;
  background: var(--surface); padding: 10px 12px; font-size: 16px; min-height: 44px;
}
.quick input:focus { border-color: var(--purple); outline: none; box-shadow: var(--ring); }

/* items */
.items { list-style: none; margin: 0; padding: 0; }
.item { border-top: 1px solid var(--border); }
.item-row { display: flex; gap: 10px; align-items: flex-start; padding: 11px 2px; cursor: pointer; }
.item-row:hover .it-title { color: var(--purple); }
.it-body { flex: 1; min-width: 0; }
.it-title { font-weight: 500; overflow-wrap: anywhere; }
.it-notes { color: var(--text-muted); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
.it-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.it-meta:empty { display: none; }
.where { font: 500 12px 'DM Mono', monospace; padding: 3px 7px; border-radius: 7px; background: var(--grey-light); color: var(--text-muted); }
.item.done .it-title { color: var(--text-faint); text-decoration: line-through; }
.item.done .it-notes { color: var(--text-faint); }
.it-tab { font-size: 12px; color: var(--purple); font-weight: 500; }

.status {
  flex: none; min-width: 74px; height: 28px; border-radius: 8px; border: 0;
  font-size: 12px; font-weight: 600; padding: 0 8px; margin-top: -2px;
}
.st-Idea, .st- { background: var(--grey-light); color: var(--text-muted); }
.st-Planned { background: var(--blue-light); color: var(--blue); }
.st-Building { background: var(--amber-light); color: var(--amber); }
.st-Done { background: var(--green-light); color: var(--green); }
.st-Cut { background: var(--grey-light); color: var(--text-faint); text-decoration: line-through; }
.pending { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); flex: none; margin-top: 9px; }

.editor { padding: 4px 2px 14px 2px; display: grid; gap: 10px; }
.editor .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 560px) { .editor .row2 { grid-template-columns: 1fr; } }
.field { display: grid; gap: 4px; }
.field > span { font-size: 12px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: .05em; }
.field input, .field textarea, .field select {
  width: 100%; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface);
  padding: 9px 11px; font-size: 16px; min-height: 42px;
}
.field textarea { resize: vertical; min-height: 84px; line-height: 1.45; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--purple); outline: none; box-shadow: var(--ring); }
.stat-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.stat-pick button { min-height: 36px; padding: 0 12px; border-radius: 9px; border: 1px solid transparent; font-size: 13px; font-weight: 600; }
.stat-pick button.on { box-shadow: 0 0 0 2px var(--text) inset; }
.ed-acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.done-toggle { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--border); background: none; padding: 12px 2px; color: var(--text-muted); font-size: 13.5px; font-weight: 500; }
.empty { color: var(--text-faint); padding: 18px 2px 20px; font-size: 14px; border-top: 1px solid var(--border); }
.freeform { white-space: pre-wrap; color: var(--text-muted); font-size: 14px; border-top: 1px solid var(--border); padding: 12px 2px; }

.search-group { margin-bottom: 14px; }
.search-group h4 { margin: 0 0 2px; font-size: 13px; color: var(--purple); font-weight: 600; }
mark { background: color-mix(in srgb, var(--amber) 28%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }

/* start / connect */
.hero { padding: 28px 24px; text-align: left; }
.hero h2 { margin: 0 0 6px; font-size: 22px; }
.hero p { margin: 0 0 16px; color: var(--text-muted); max-width: 58ch; }
.hero ol { color: var(--text-muted); padding-left: 20px; margin: 0 0 16px; }
.hero ol li { margin: 4px 0; }
.hero .row { display: flex; gap: 8px; flex-wrap: wrap; }
.hero input[type=url] { flex: 1 1 280px; min-width: 0; border: 1px solid var(--border-strong); border-radius: 10px; padding: 10px 12px; background: var(--surface); font-size: 15px; min-height: 42px; }
.preview-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 18px; }
.preview-tabs span { font-size: 13px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-muted); }
.err-text { color: var(--red); font-size: 13.5px; margin-top: 10px; }

/* menus / toast / banner */
.menu {
  position: fixed; z-index: 50; min-width: 180px; padding: 6px;
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,.18);
}
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 10px 12px; border-radius: 8px; font-size: 14px; }
.menu button:hover { background: var(--surface-2); }
.menu button.danger { color: var(--red); }
.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 14px;
  opacity: 0; pointer-events: none; transition: .2s; z-index: 60; max-width: calc(100vw - 32px);
}
.toast.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
.toast button { background: none; border: 0; color: inherit; font-weight: 600; text-decoration: underline; margin-left: 10px; }
.banner { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--red-light); color: var(--red); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 14px; }
.banner .spacer { flex: 1; }
.loading { color: var(--text-faint); padding: 30px 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header class="topbar">
  <a class="back" href="app.html" aria-label="Back to dashboard">←<span class="lbl"> Dashboard</span></a>
  <h1>Show Notes</h1>
  <span class="dev-badge">DEV</span>
  <span class="spacer"></span>
  <button class="sync" id="sync" onclick="onSyncClick()"><span class="dot"></span><span id="sync-text">…</span></button>
  <button class="icon-btn" title="Connection settings" aria-label="Connection settings" onclick="openConnect()">⚙</button>
  <button class="icon-btn" title="Light / dark" aria-label="Toggle dark mode" onclick="toggleTheme()">◐</button>
</header>

<div class="wrap">
  <div class="devnote" id="devnote"></div>
  <div id="banner" class="banner" hidden></div>
  <aside class="card shows" id="shows" aria-label="Shows"></aside>
  <main class="main" id="main">
    <select class="show-select" id="show-select" aria-label="Show" onchange="pickShow(this.value)"></select>
    <div id="view"><div class="loading">Loading…</div></div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
const BUILD = '10.14 v1';
// Live dashboard backend — used ONLY for reads (show list, existing notes links).
const LIVE_URL = 'https://script.google.com/macros/s/AKfycbzVONJuSlGzl04FZCzd3h45V2AsKC3HkqI6eeaujMetaDGkeGctL9IolMkJNBeJA7BaBg/exec';
const STATUSES = ['Idea', 'Planned', 'Building', 'Done', 'Cut'];
const PLACES = ['SL', 'SR', 'CS', 'US', 'DS', 'USL', 'USR', 'DSL', 'DSR', 'Fly', 'Pit', 'In 1', 'Lobby'];
const PRACTICE = { slug: '_practice', name: 'Practice notebook', type: 'Practice' };
const LS = {
  api: 'mmt_notesdev_api', books: 'mmt_notesdev_books', book: id => 'mmt_notesdev_book_' + id,
  queue: 'mmt_notesdev_queue', last: 'mmt_notesdev_last', tab: 'mmt_notesdev_tab',
};

// ── storage helpers (browser storage can throw in private mode) ──
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function uid() { return 'n' + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 7); }
function slugify(n) { return String(n || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
function legacyKey(sh) { return (sh.type === 'Mainstage' ? 'mainstage_' : 'childrens_') + String(sh.name).replace(/[^a-z0-9]/gi, '_'); }
function fmtDates(a, b) {

// ── transport ──
function jsonp(url, timeoutMs) {
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    const s = document.createElement('script');
    let done = false;
    const t = setTimeout(() => fin(() => reject(new Error('Timed out'))), timeoutMs || 20000);
    function fin(f) { if (done) return; done = true; clearTimeout(t); delete window[cb]; s.remove(); f(); }
    window[cb] = d => fin(() => resolve(d));
    s.onerror = () => fin(() => reject(new Error('Network')));
    s.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    document.head.appendChild(s);
  });
}
async function api(req) {
  if (S.api === 'demo') return Demo.call(req);
  if (!S.api) throw new Error('Not connected');
  const payload = JSON.stringify(req);
  let res;
  if (payload.length < 1500) {
    res = await jsonp(S.api + '?payload=' + encodeURIComponent(payload) + '&_=' + Date.now());
  } else {
    // Long notes: POST. Every long op is an idempotent save, so a retry is safe.
    const r = await fetch(S.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: payload });
    res = await r.json();
  }
  if (!res || !res.ok) { const e = new Error((res && res.error) || 'Server error'); e.server = true; throw e; }
  return res;
}

// ── write queue ──
// Edits show up instantly, go into a queue saved on this device, and are sent
// to the sheet one at a time. If the network drops they wait and retry; they
// are never thrown away silently.
function enqueue(op) {
  op.qid = uid(); op.t = Date.now();
  if (op.action === 'saveItem') {
    // A newer save of the same item replaces a waiting one.
    // Only if nothing after it (a move/delete) depends on that earlier save.
    const i = queue.findIndex(q => !q.sending && q.action === 'saveItem' && q.item.id === op.item.id && q.sheetId === op.sheetId);
    if (i !== -1 && !queue.slice(i + 1).some(q => q.id === op.item.id || (q.item && q.item.id === op.item.id))) queue.splice(i, 1);
  }
  if (op.action === 'setTabMeta') {
    const i = queue.findIndex(q => !q.sending && q.action === 'setTabMeta' && q.gid === op.gid && q.sheetId === op.sheetId);
    if (i !== -1) { const old = queue.splice(i, 1)[0]; if (op.description == null) op.description = old.description; if (op.scenes == null) op.scenes = old.scenes; }
  }
  queue.push(op); saveQueue(); flush();
}
function saveQueue() {
  // Demo edits are never persisted, so they can't leak into the real queue.
  lsSet(LS.queue, queue.filter(q => !String(q.sheetId).startsWith('demo-')).map(q => { const c = { ...q }; delete c.sending; return c; }));
  renderSync();
}
async function flush() {
  if (flushing || !queue.length || !S.api) return;
  flushing = true; clearTimeout(retryTimer); renderSync();
  while (queue.length) {
    const op = queue[0];
    if (op.failed) break;
    op.sending = true;
    const req = { ...op }; delete req.qid; delete req.t; delete req.sending; delete req.failed; delete req.tries;
    try {
      await api(req);
      queue.shift(); retryDelay = 2000; saveQueue();
    } catch (e) {
      op.sending = false;
      op.tries = (op.tries || 0) + 1;
      if (e.server && op.tries >= 3) { op.failed = String(e.message); saveQueue(); showBanner(); }
      else { saveQueue(); retryTimer = setTimeout(flush, retryDelay); retryDelay = Math.min(retryDelay * 2, 30000); }
      break;
    }
  }
  flushing = false; renderSync(); refreshPendingDots();
}
window.addEventListener('online', () => { retryDelay = 2000; flush(); });
function pendingIds() { return new Set(queue.filter(q => q.action === 'saveItem').map(q => q.item.id)); }

function showBanner() {
  const b = document.getElementById('banner');
  const bad = queue.find(q => q.failed);
  if (!bad) { b.hidden = true; return; }
  b.hidden = false;
  b.innerHTML = `<span>A change couldn't be saved to the sheet: <b>${esc(bad.failed)}</b></span><span class="spacer"></span>
    <button class="btn sm" onclick="retryFailed()">Retry</button><button class="btn sm danger" onclick="discardFailed()">Discard it</button>`;
}
function retryFailed() { queue.forEach(q => { delete q.failed; q.tries = 0; }); saveQueue(); showBanner(); flush(); }
function discardFailed() {
  if (!confirm('Throw away the change that failed to save? The sheet keeps its current version.')) return;
  queue = queue.filter(q => !q.failed); saveQueue(); showBanner(); flush(); if (S.book) loadBook(S.book.sheetId, true);
}

function renderSync() {
  const el = document.getElementById('sync'), tx = document.getElementById('sync-text');
  el.className = 'sync';
  if (S.api === 'demo') { el.classList.add('demo'); tx.textContent = 'Demo — not saved'; return; }
  if (!S.api) { el.classList.add('err'); tx.textContent = 'Not connected'; return; }
  const n = queue.length;
  if (queue.some(q => q.failed)) { el.classList.add('err'); tx.textContent = 'Save problem'; return; }
  if (n && (!navigator.onLine || queue.some(q => q.tries))) { el.classList.add('err'); tx.textContent = `Can't reach sheet · ${n} waiting`; el.title = 'Edits are kept on this device and retried automatically. Tap to retry now.'; return; }
  if (n) { el.classList.add('busy'); tx.textContent = `Saving ${n}…`; return; }
  if (S.loadingBook) { el.classList.add('busy'); tx.textContent = 'Loading…'; return; }
  tx.textContent = 'Saved to sheet';
}
function onSyncClick() { if (queue.length) { retryDelay = 2000; flush(); } else if (S.book) loadBook(S.book.sheetId, true); }

async function loadBook(sheetId, force) {

// Lay any not-yet-saved edits over what the server sent, so they don't flicker away.
function applyQueue(book) {
  book = JSON.parse(JSON.stringify(book));
  queue.filter(q => q.sheetId === book.sheetId).forEach(q => {
    const tab = book.tabs.find(t => t.gid === q.gid);
    if (q.action === 'saveItem' && tab) {
      book.tabs.forEach(t => { if (t !== tab) t.items = t.items.filter(i => i.id !== q.item.id); });
      const i = tab.items.findIndex(x => x.id === q.item.id);
      if (i === -1) tab.items.push({ ...q.item }); else tab.items[i] = { ...q.item };
    } else if (q.action === 'deleteItem' && tab) tab.items = tab.items.filter(i => i.id !== q.id);
    else if (q.action === 'moveItem' && tab) {
      const it = tab.items.find(i => i.id === q.id), to = book.tabs.find(t => t.gid === q.toGid);
      if (it && to) { tab.items = tab.items.filter(i => i.id !== q.id); to.items.push(it); }
    } else if (q.action === 'setTabMeta' && tab) {
      if (q.description != null) tab.description = q.description;
      if (q.scenes != null) tab.scenes = q.scenes;
    }
  });
  return book;
}

function busyTyping() { const a = document.activeElement; return a && /INPUT|TEXTAREA/.test(a.tagName) && a.closest('#view'); }

// ── items ──
function quickAdd(ev) {
  ev.preventDefault();
  const inp = ev.target.querySelector('input'); const text = inp.value.trim();
  if (!text) return;
  const t = curTab();
  // "Railing — sturdy, matches drop" → item + notes
  const m = text.match(/^(.+?)\s+[—–-]\s+(.+)$/) || text.match(/^(.+?):\s+(.+)$/);
  const item = { id: uid(), item: m ? m[1] : text, notes: m ? m[2] : '', scenes: '', where: '', status: 'Idea' };
  t.items.push(item);
  enqueue({ action: 'saveItem', sheetId: S.book.sheetId, gid: t.gid, item: { ...item } });
  inp.value = '';
  render(); const again = document.querySelector('.quick input'); if (again) again.focus();
}
function findItem(id) { for (const t of S.book.tabs) { const it = t.items.find(i => i.id === id); if (it) return { t, it }; } return {}; }
function saveItemNow(id) {
  const { t, it } = findItem(id); if (!it) return;
  enqueue({ action: 'saveItem', sheetId: S.book.sheetId, gid: t.gid, item: { ...it } });
}
const _deb = {};
function editField(id, key, val) {
  const { it } = findItem(id); if (!it || it[key] === val) return;
  it[key] = val;
  clearTimeout(_deb[id]); _deb[id] = setTimeout(() => saveItemNow(id), 700);
  refreshRowPreview(id);
}
function flushEdit(id) { if (_deb[id]) { clearTimeout(_deb[id]); delete _deb[id]; saveItemNow(id); } }
function setStatus(id, st) {
  const { it } = findItem(id); if (!it) return;
  it.status = st; flushEdit(id); saveItemNow(id); render();
}
function cycleStatus(ev, id) {
  ev.stopPropagation();
  const { it } = findItem(id); if (!it) return;
  const order = ['Idea', 'Planned', 'Building', 'Done'];
  const i = order.indexOf(it.status || 'Idea');
  const prev = it.status;
  setStatus(id, order[(i + 1) % order.length]);
  if (it.status === 'Done') toast('Marked done', () => setStatus(id, prev));
}
function toggleEdit(id) {
  if (S.editing && S.editing !== id) flushEdit(S.editing);
  S.editing = S.editing === id ? null : id; render();
  if (S.editing) { const f = document.querySelector(`[data-ed="${id}"] [data-k="item"]`); if (f && !('ontouchstart' in window)) f.focus(); }
}
function deleteItem(id) {
  const { t, it } = findItem(id); if (!it) return;
  clearTimeout(_deb[id]);
  t.items = t.items.filter(i => i.id !== id);
  queue = queue.filter(q => !(q.action === 'saveItem' && q.item.id === id && !q.sending));

  });
}

function sceneList(s) { return String(s || '').split(/[,;]+/).map(x => x.trim()).filter(Boolean); }

      <h2>${esc(sh.name)}</h2>
      <p>${lu ? 'This show already has a notes sheet. In the dev build, existing sheets stay as they are. ' : ''}Start a notebook and it becomes a Google Sheet in <b>MMT Show Notes (dev)</b>, with a tab for each section of the show.</p>
      <div class="preview-tabs"><span>General</span><span>Build To-Do</span><span>Production Meetings</span><span>+ add your own (one per setting works well)</span></div>
      <div class="row"><button class="btn primary" id="create-btn" onclick="createBook()">Start notes for this show</button>
      ${lu ? `<a class="btn" href="${esc(lu)}" target="_blank" rel="noopener">Open existing sheet ↗</a>` : ''}</div>
      ${S.connectErr ? `<div class="err-text">Backend problem: ${esc(S.connectErr)}</div>` : ''}</div>`;
    return;
  }
  if (!S.book) {
    v.innerHTML = S.bookErr ? `<div class="card hero"><h2>Couldn't open the notebook</h2><p>${esc(S.bookErr)}</p><button class="btn" onclick="S.bookErr='';loadBook('${esc(b.sheetId)}',true)">Try again</button></div>` : '<div class="loading">Opening notebook…</div>';
    return;
  }
  const t = curTab();
  const counts = tab => tab.items.filter(i => !isClosed(i)).length;
  let h = `<div class="nb-head"><div><h2>${esc(sh.name)}</h2><div class="sub">${esc(sh.type === 'Practice' ? 'Practice notebook' : sh.start ? sh.type + ' · ' + fmtDates(sh.start, sh.end) : 'Notebook')}</div></div>
    <div class="acts"><a class="btn" href="${esc(S.book.url)}" target="_blank" rel="noopener">Open in Sheets ↗</a></div></div>
    <div class="toolbar">
      <label class="search"><span aria-hidden="true">⌕</span><span class="sr">Search</span><input id="q" type="search" placeholder="Search every tab" value="${esc(S.q)}" oninput="onSearch(this.value)">${S.q ? '<button class="x" aria-label="Clear search" onclick="onSearch(\'\')">×</button>' : ''}</label>
      <div class="seg" role="group" aria-label="Filter">
        <button class="${S.filter === 'open' ? 'on' : ''}" onclick="setFilter('open')">Open</button>
        <button class="${S.filter === 'all' ? 'on' : ''}" onclick="setFilter('all')">All</button>
      </div>
    </div>
    <nav class="tabs" aria-label="Tabs">${S.book.tabs.map(x => `<button class="tab ${!S.q && x.gid === S.tabGid ? 'on' : ''}" onclick="setTab(${x.gid})">${esc(x.title)}${x.format === 'notes' ? `<span class="n">${counts(x)}</span>` : ''}</button>`).join('')}
      <button class="tab add" onclick="addTab()">+ Tab</button></nav>`;
  h += S.q ? searchHTML() : (t ? tabHTML(t) : '');
  v.innerHTML = h;
  v.querySelectorAll('.about').forEach(autosize);
  // Keep the active tab visible in the strip without scrolling the page.
  const on = v.querySelector('.tab.on'), strip = v.querySelector('.tabs');
  if (on && strip && (on.offsetLeft + on.offsetWidth > strip.clientWidth)) strip.scrollLeft = on.offsetLeft - 16;
  v.querySelectorAll('textarea[data-k]').forEach(autosize);
}
function isClosed(i) { return i.status === 'Done' || i.status === 'Cut'; }
function setFilter(f) { S.filter = f; render(); }
let _qt;
function onSearch(v) {
  S.q = v; clearTimeout(_qt);
  _qt = setTimeout(() => { const pos = document.getElementById('q'); const sel = pos && pos.selectionStart; render(); const q = document.getElementById('q'); if (q) { q.focus(); try { q.setSelectionRange(sel, sel); } catch (e) {} } }, v ? 120 : 0);
}

function tabHTML(t) {
  const pend = pendingIds();
  let h = `<section class="card panel"><div class="panel-head"><h3>${esc(t.title)}</h3>
    <button class="icon-btn" aria-label="Tab options" onclick="tabMenu(event)">⋯</button></div>`;
  if (t.format !== 'notes') {
    return h + `<p class="legacy" style="padding:0">This tab was typed freeform in Sheets, so it's shown as text. Edit it in Sheets, or move its lines into a new tab here.</p>
      <div class="freeform">${esc((t.lines || []).join('\n'))}</div></section>`;
  }
  h += `<div class="meta">
      <label for="about">About</label>
      <textarea id="about" class="about" rows="1" placeholder="What this section is: look, feel, placement, references…" oninput="autosize(this);editAbout(this.value)">${esc(t.description)}</textarea>
      <label>Scenes</label>
      <div class="chips">${sceneList(t.scenes).map((s, i) => `<span class="chip">${esc(s)}<button aria-label="Remove ${esc(s)}" onclick="removeScene(${i})">×</button></span>`).join('')}
        <input class="chip-in" placeholder="+ A1S5" aria-label="Add scene" onkeydown="addScene(event)" onblur="addScene(event)" autocapitalize="characters"></div>
    </div>
    <form class="quick" onsubmit="quickAdd(event)"><input placeholder="Add an item…  (try “Railing — sturdy, matches drop”)" aria-label="Add an item" enterkeyhint="done"><button class="btn primary">Add</button></form>`;
  const open = t.items.filter(i => !isClosed(i)), closed = t.items.filter(isClosed);
  const list = S.filter === 'all' ? t.items : open;
  h += `<ul class="items">${list.map(i => itemHTML(i, pend)).join('')}</ul>`;
  if (!t.items.length) h += `<div class="empty">Nothing here yet. Add the first item above.</div>`;
  else if (!list.length) h += `<div class="empty">Everything on this tab is done.</div>`;
  if (S.filter === 'open' && closed.length) {
    const showing = S.showDone[t.gid];
    h += `<button class="done-toggle" onclick="S.showDone[${t.gid}]=!S.showDone[${t.gid}];render()">${showing ? '▾' : '▸'} Done or cut (${closed.length})</button>`;
    if (showing) h += `<ul class="items">${closed.map(i => itemHTML(i, pend)).join('')}</ul>`;
  }
  return h + '</section>';
}
function itemHTML(i, pend, tabTitle, q) {
  const hl = s => q ? highlight(s, q) : esc(s);
  const meta = sceneList(i.scenes).map(s => `<span class="chip">${esc(s)}</span>`).join('') + (i.where ? `<span class="where">${esc(i.where)}</span>` : '');
  let h = `<li class="item ${isClosed(i) ? 'done' : ''}" data-id="${esc(i.id)}">
    <div class="item-row" onclick="toggleEdit('${esc(i.id)}')">
      <button class="status st-${esc(i.status || '')}" onclick="cycleStatus(event,'${esc(i.id)}')" title="Tap to advance status">${esc(i.status || 'Idea')}</button>
      <div class="it-body">${tabTitle ? `<div class="it-tab">${esc(tabTitle)}</div>` : ''}<div class="it-title">${hl(i.item || '(untitled)')}</div>${i.notes ? `<div class="it-notes">${hl(i.notes)}</div>` : ''}<div class="it-meta">${meta}</div></div>
      ${pend.has(i.id) ? '<span class="pending" title="Saving…"></span>' : ''}
    </div>`;
  if (S.editing === i.id) h += editorHTML(i);
  return h + '</li>';
}
function editorHTML(i) {
  const id = esc(i.id);
  const tabs = S.book.tabs.filter(t => t.format === 'notes');
  const cur = findItem(i.id).t;
  return `<div class="editor" data-ed="${id}">
    <label class="field"><span>Item</span><input data-k="item" value="${esc(i.item)}" oninput="editField('${id}','item',this.value)" onblur="flushEdit('${id}')"></label>
    <label class="field"><span>Notes</span><textarea data-k="notes" oninput="autosize(this);editField('${id}','notes',this.value)" onblur="flushEdit('${id}')">${esc(i.notes)}</textarea></label>
    <div class="row2">
      <label class="field"><span>Scenes</span><input data-k="scenes" value="${esc(i.scenes)}" placeholder="A1S5, A2S3" autocapitalize="characters" oninput="editField('${id}','scenes',this.value)" onblur="flushEdit('${id}')"></label>
      <label class="field"><span>Where</span><input data-k="where" list="places" value="${esc(i.where)}" placeholder="SL, US, Fly…" oninput="editField('${id}','where',this.value)" onblur="flushEdit('${id}')"></label>
    </div>
    <div class="field"><span>Status</span><div class="stat-pick">${STATUSES.map(s => `<button type="button" class="st-${s} ${i.status === s ? 'on' : ''}" onclick="setStatus('${id}','${s}')">${s}</button>`).join('')}</div></div>
    <div class="ed-acts">
      <label class="field" style="flex:1 1 200px"><span>Tab</span><select onchange="moveItem('${id}',this.value)">${tabs.map(t => `<option value="${t.gid}" ${t === cur ? 'selected' : ''}>${esc(t.title)}</option>`).join('')}</select></label>
      <span class="spacer" style="flex:1"></span>
      <button class="btn danger sm" onclick="deleteItem('${id}')">Delete</button>
      <button class="btn sm" onclick="toggleEdit('${id}')">Done editing</button>
    </div>
    <datalist id="places">${PLACES.map(p => `<option value="${p}">`).join('')}</datalist>
  </div>`;
}
function refreshRowPreview(id) {
  const li = document.querySelector(`.item[data-id="${CSS.escape(id)}"]`); if (!li) return;
  const { it } = findItem(id);
  const t = li.querySelector('.it-title'); if (t) t.textContent = it.item || '(untitled)';
  let n = li.querySelector('.it-notes');
  if (it.notes) { if (!n) { n = document.createElement('div'); n.className = 'it-notes'; t.after(n); } n.textContent = it.notes; } else if (n) n.remove();
  const m = li.querySelector('.it-meta');
  if (m) m.innerHTML = sceneList(it.scenes).map(s => `<span class="chip">${esc(s)}</span>`).join('') + (it.where ? `<span class="where">${esc(it.where)}</span>` : '');
}
function refreshPendingDots() {
  if (!S.book || busyTyping()) return;
  const pend = pendingIds();
  document.querySelectorAll('.item[data-id]').forEach(li => {
    const has = pend.has(li.dataset.id), dot = li.querySelector('.pending');
    if (!has && dot) dot.remove();
  });
}
function highlight(s, q) {
  const e = esc(s); const qe = esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return qe ? e.replace(new RegExp('(' + qe + ')', 'ig'), '<mark>$1</mark>') : e;
}
function searchHTML() {
  const q = S.q.trim().toLowerCase(); const pend = pendingIds();
  let n = 0, h = '<section class="card panel">';
  S.book.tabs.forEach(t => {
    const hitsTab = (t.title + ' ' + t.description + ' ' + t.scenes).toLowerCase().includes(q);
    const items = (t.items || []).filter(i => (S.filter === 'all' || !isClosed(i)) &&
      [i.item, i.notes, i.scenes, i.where, i.status].join(' ').toLowerCase().includes(q));
    const lines = (t.lines || []).filter(l => l.toLowerCase().includes(q));
    if (!items.length && !hitsTab && !lines.length) return;
    n += items.length + lines.length + (hitsTab ? 1 : 0);
    h += `<div class="search-group"><h4><a href="#" onclick="setTab(${t.gid});return false" style="color:inherit">${esc(t.title)} →</a></h4>`;
    if (hitsTab && t.description) h += `<div class="it-notes" style="padding:4px 2px 8px">${highlight(t.description, S.q.trim())}</div>`;
    h += `<ul class="items">${items.map(i => itemHTML(i, pend, null, S.q.trim())).join('')}</ul>`;
    if (lines.length) h += `<div class="freeform">${lines.map(l => highlight(l, S.q.trim())).join('\n')}</div>`;
    h += '</div>';
  });
  if (!n) h += `<div class="empty" style="border:0">No matches for “${esc(S.q)}”${S.filter === 'open' ? ' in open items. <a href="#" onclick="setFilter(\'all\');return false">Search done items too</a>' : ''}.</div>`;
  return h + '</section>';
}
function autosize(el) { el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; }

// ── menus / toast ──
function tabMenu(ev) {
  ev.stopPropagation(); closeMenu();
  const m = document.createElement('div'); m.className = 'menu'; m.id = 'menu';
  m.innerHTML = `<button onclick="closeMenu();renameTab()">Rename tab</button><button class="danger" onclick="closeMenu();deleteTab()">Delete tab…</button>`;
  document.body.appendChild(m);
  const r = ev.currentTarget.getBoundingClientRect();
  m.style.top = (r.bottom + 6) + 'px'; m.style.left = Math.max(8, Math.min(r.right - m.offsetWidth, innerWidth - m.offsetWidth - 8)) + 'px';
}
function closeMenu() { const m = document.getElementById('menu'); if (m) m.remove(); }
document.addEventListener('click', e => { if (!e.target.closest('#menu')) closeMenu(); });
let _tt;
function toast(msg, undo) {
  const t = document.getElementById('toast');
  t.innerHTML = esc(msg) + (undo ? '<button id="undo">Undo</button>' : '');
  if (undo) document.getElementById('undo').onclick = () => { undo(); t.classList.remove('show'); };
  t.classList.add('show'); clearTimeout(_tt); _tt = setTimeout(() => t.classList.remove('show'), undo ? 5000 : 3000);
}

// ── connect ──
function connectHTML() {
  return `<div class="card hero">
    <h2>Connect the dev backend</h2>
    <p>This page saves to its own Apps Script project, so the live dashboard backend is never touched. One-time setup from a laptop:</p>
    <ol>
      <li>Go to <b>script.google.com</b> → New project, name it “MMT Show Notes DEV”.</li>
      <li>Paste in <a href="https://github.com/musicmountainmcafee-eng/MMT-Inventory/blob/main/apps-script/ShowNotesDev.gs" target="_blank" rel="noopener">apps-script/ShowNotesDev.gs</a> and save.</li>
      <li>Deploy → New deployment → Web app. Execute as <b>Me</b>, access <b>Anyone</b>. Authorize.</li>
      <li>Paste the Web app URL (ends in <span class="mono">/exec</span>) below.</li>
    </ol>
    <div class="row"><input type="url" id="api-url" placeholder="https://script.google.com/macros/s/…/exec" value="${S.api && S.api !== 'demo' ? esc(S.api) : ''}">
      <button class="btn primary" onclick="saveConnect()">Connect</button></div>
    <div class="row" style="margin-top:10px"><button class="btn ghost" onclick="useDemo()">Or try it with sample notes (nothing saved)</button></div>
    <div class="err-text" id="connect-err">${esc(S.connectErr || '')}</div>
  </div>`;
}
function openConnect() { const prev = S.api; S.api = ''; S._prevApi = prev; render(); }
async function saveConnect() {
  const url = document.getElementById('api-url').value.trim();
  const err = document.getElementById('connect-err');
  if (!/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec/.test(url)) { err.textContent = 'That doesn’t look like an Apps Script web app URL (it should end in /exec).'; return; }
  err.textContent = 'Checking…';
  S.api = url;
  try {
    const r = await api({ action: 'ping' });
    lsSet(LS.api, url); S.connectErr = '';
    toast('Connected · backend ' + r.version);
    await loadIndex(); flush();
  } catch (e) { S.api = ''; err.textContent = 'Couldn’t reach it: ' + e.message + '. Check the deployment allows “Anyone”.'; }
}
function useDemo() { S.api = 'demo'; S.books = Demo.books(); if (!S.slug) S.slug = 'its-a-wonderful-life'; pickShow(S.slug === PRACTICE.slug || bookFor(S.slug) ? S.slug : 'its-a-wonderful-life'); }

// ── demo backend: same actions, in memory, seeded with sample notes ──
const Demo = (() => {
  let gid = 1;
  const it = (item, notes = '', scenes = '', where = '', status = 'Idea') => ({ id: uid(), item, notes, scenes, where, status });
  const tab = (title, description, scenes, items) => ({ gid: gid++, title, description, scenes, items, format: 'notes' });
  const books = {
    'demo-iawl': { sheetId: 'demo-iawl', url: 'https://docs.google.com/spreadsheets/', name: "It's a Wonderful Life — Show Notes", tabs: [
      tab('Build To-Do', 'Shop list for the build.', '', [
        it('Bridge piece', 'Sturdy railing that matches the drop', 'A2S6, A2S7, A2S9', 'DS', 'Planned'),
        it('3 sleds on wheels', '', '', '', 'Building'),
        it('Bailey loan counter', 'Use Matilda table with windows + forced perspective. How many windows?', 'A1S9', 'SR'),
        it('Back wall for office', 'Urinetown style, with forced perspective', '', 'US'),
        it('2 fly-in banner signs', '“Bedford Hall High Class of 1928” and “Welcome to Bailey Park”', '', 'Fly'),
        it('New letters for bank unit'),
        it('Two Christmas trees', 'One for the square, one for the house'),
        it('Get 3D printer working', '', '', '', 'Done'),
      ]),
      tab('Production Meetings', 'Questions and answers from production meetings.', '', [
        it('Snow', 'Only during the bridge setups'),
        it('Working bike', '', '', '', 'Planned'),
        it('Fly in Christmas swag'),
        it('Town drop ties into pieces', 'Play with forced perspective on all pieces'),
        it('Prologues', 'Both in front of main curtain. Fog. All heaven in front of main, SL if possible', 'A1S1A, A1S5A, A1S9A', 'In 1'),
      ]),
      tab('Bridge', 'Feel small and alone. Railing like he’s on a bridge, big feeling. The only time it snows.', 'A2S6, A2S7, A2S9', [
        it('Railing', 'Sturdy', '', 'DS', 'Planned'),
        it('Bench', '“A hut outside bridge”, same drop. Not needed A2S9; set it when we set the bridge.', 'A2S7', ''),
      ]),
      tab("Potter's Office", 'Should feel like Scrooge in the 1930s. Play with perspective so the wall isn’t flat across the top.', 'A1S11, A2S5', [
        it('Partner desk', 'On wheels?'), it('Big old wheelchair', 'John Dwyer'), it('Guest chair', 'On wheels or bentwood'),
        it('Rolling wall', 'Urinetown style with perspective', '', 'US'),
      ]),
      tab('Upstage Unit', 'Could be drop, back wall, or LED wall. Act 1 looks like still moving in; lived-in by Act 2.', 'A1S12, A2S4, A2S10', [
        it('Landing with stairs', 'Center stairs facing center, small platform, stairs off SR (à la Annie)'),
        it('Upright piano', 'Maybe covered with a drop for Act 1'), it('Couch', 'Covered with boxes for Act 1'), it('Christmas tree', 'Act 2 only'),
      ]),
    ] },
  };
  const index = [{ slug: 'its-a-wonderful-life', name: "It's a Wonderful Life", sheetId: 'demo-iawl', url: books['demo-iawl'].url }];
  const delay = v => new Promise(r => setTimeout(() => r(JSON.parse(JSON.stringify({ ok: true, ...v }))), 220));
  const B = id => { if (!books[id]) throw Object.assign(new Error('Not found'), { server: true }); return books[id]; };
  const T = (id, g) => B(id).tabs.find(t => t.gid === Number(g));
  return {
    books: () => index.slice(),
    call(r) {
      switch (r.action) {
        case 'ping': return delay({ version: 'demo' });
        case 'listBooks': return delay({ books: index });
        case 'createBook': {
          const id = 'demo-' + r.slug;
          books[id] = { sheetId: id, url: 'https://docs.google.com/spreadsheets/', name: r.name, tabs: ['General', 'Build To-Do', 'Production Meetings'].map(t => tab(t, '', '', [])) };
          const b = { slug: r.slug, name: r.name, sheetId: id, url: books[id].url }; index.push(b); return delay({ book: b });
        }
        case 'getBook': return delay(B(r.sheetId));
        case 'addTab': { const t = tab(r.title, '', '', []); B(r.sheetId).tabs.push(t); return delay({ tab: t }); }
        case 'renameTab': T(r.sheetId, r.gid).title = r.title; return delay({ title: r.title });
        case 'deleteTab': B(r.sheetId).tabs = B(r.sheetId).tabs.filter(t => t.gid !== Number(r.gid)); return delay({});
        case 'setTabMeta': { const t = T(r.sheetId, r.gid); if (r.description != null) t.description = r.description; if (r.scenes != null) t.scenes = r.scenes; return delay({}); }
        case 'saveItem': { const t = T(r.sheetId, r.gid); const i = t.items.findIndex(x => x.id === r.item.id); if (i === -1) t.items.push({ ...r.item }); else t.items[i] = { ...r.item }; return delay({ id: r.item.id }); }
        case 'deleteItem': { const t = T(r.sheetId, r.gid); t.items = t.items.filter(x => x.id !== r.id); return delay({}); }
        case 'moveItem': { const f = T(r.sheetId, r.gid), to = T(r.sheetId, r.toGid); const x = f.items.find(i => i.id === r.id); f.items = f.items.filter(i => i.id !== r.id); to.items.push(x); return delay({}); }
      }
      return Promise.reject(new Error('Unknown action'));
    },
  };
})();

// ── boot ──
(function boot() {
  const qs = new URLSearchParams(location.search);
  if (qs.get('demo') === '1') S.api = 'demo';
  if (S.api === 'demo') { S.books = Demo.books(); queue = []; }
  readShows();
  const last = qs.get('show') || lsGet(LS.last, '') || (S.api === 'demo' ? 'its-a-wonderful-life' : '');
  if (last && (S.shows.some(s => s.slug === last) || last === PRACTICE.slug || bookFor(last))) pickShow(last); else render();
  if (S.api && S.api !== 'demo') { loadIndex().then(() => { if (S.slug && !S.book && bookFor(S.slug)) pickShow(S.slug); }); flush(); }
  // If the show list wasn't cached yet, a show may only become pickable once it arrives.
  if (S.api === 'demo' && !S.slug) pickShow('its-a-wonderful-life');
})();
</script>
