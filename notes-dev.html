<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Show Notes · DEV</title>
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16161f" media="(prefers-color-scheme: dark)">
<link rel="icon" href="notes-icon-192.png" />
<link rel="manifest" href="notes.webmanifest" />
<link rel="apple-touch-icon" href="notes-icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="MMT Notes" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<!--
  MMT Show Notes — DEV build 10.14 v8

  A sandbox for the show-notes page before it goes into app.html.
  It READS the live show list (to know which shows exist) and never writes to
  the live backend. Everything it saves goes through a separate Apps Script
  project (apps-script/ShowNotesDev.gs) into its own Drive folder.

  Every tab is flexible: its fields (About, Scenes…) and its columns are
  whatever you make them. Rows, columns and tabs can be dragged to reorder.
-->
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --surface-2: #fbfaf7;
  --border: rgba(28,25,23,0.11); --border-strong: rgba(28,25,23,0.20);
  --text: #1c1917; --text-muted: #57534e; --text-faint: #78716c;
  --purple: #4f46b8; --purple-dark: #3a3390; --purple-light: #eeedfb;
  --blue: #155e9c; --blue-light: #e8f1fa;
  --green: #3b6d11; --green-light: #edf4e3;
  --amber: #a85c07; --amber-light: #fbf1e3;
  --red: #b02a20; --red-light: #fbeceb;
  --grey-light: #efeeea;
  --on-accent: #fff;
  --radius: 14px; --radius-sm: 10px;
  --ring: 0 0 0 3px rgba(79,70,184,0.28);
  --shadow: 0 1px 2px rgba(28,25,23,0.06), 0 4px 16px rgba(28,25,23,0.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16161f; --surface: #1f1f2c; --surface-2: #242433;
    --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.20);
    --text: #e8e8ef; --text-muted: #a6a6bd; --text-faint: #7f7f98;
    --purple: #9b93f2; --purple-dark: #c2bdf8; --purple-light: #2a2745;
    --blue: #82b8f0; --blue-light: #19284a;
    --green: #8fcf6a; --green-light: #1d3318;
    --amber: #f0b25e; --amber-light: #3a2a14;
    --red: #f08a80; --red-light: #3d1d1b;
    --grey-light: #2a2a38; --on-accent: #16161f;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16161f; --surface: #1f1f2c; --surface-2: #242433;
  --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.20);
  --text: #e8e8ef; --text-muted: #a6a6bd; --text-faint: #7f7f98;
  --purple: #9b93f2; --purple-dark: #c2bdf8; --purple-light: #2a2745;
  --blue: #82b8f0; --blue-light: #19284a;
  --green: #8fcf6a; --green-light: #1d3318;
  --amber: #f0b25e; --amber-light: #3a2a14;
  --red: #f08a80; --red-light: #3d1d1b;
  --grey-light: #2a2a38; --on-accent: #16161f;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.45 'DM Sans', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding-bottom: env(safe-area-inset-bottom);
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: none; box-shadow: var(--ring); }
.mono { font-family: 'DM Mono', monospace; }

/* ── top bar ── */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.back { color: var(--text-muted); text-decoration: none; font-size: 14px; padding: 8px 4px; white-space: nowrap; }
.back:hover { color: var(--text); }
.topbar h1 { font-size: 17px; font-weight: 600; margin: 0; white-space: nowrap; }
.dev-badge { font: 500 11px 'DM Mono', monospace; letter-spacing: .04em; background: var(--amber-light); color: var(--amber); padding: 3px 7px; border-radius: 6px; }
.spacer { flex: 1; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); white-space: nowrap; background: none; border: 0; padding: 8px 6px; border-radius: 8px; min-width: 0; flex: 0 1 auto; }
#sync-text { overflow: hidden; text-overflow: ellipsis; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex: none; }
.sync.busy .dot { background: var(--amber); animation: pulse 1s infinite; }
.sync.err .dot { background: var(--red); }
.sync.demo .dot { background: var(--text-faint); }
@keyframes pulse { 50% { opacity: .35; } }
.icon-btn { min-width: 40px; height: 40px; border-radius: 10px; border: 1px solid transparent; background: none; color: var(--text-muted); display: inline-grid; place-items: center; font-size: 17px; }
.icon-btn:hover { background: var(--surface); border-color: var(--border); color: var(--text); }
@media (max-width: 520px) {
  .topbar { gap: 6px; padding-left: 12px; padding-right: 10px; }
  .back .lbl { display: none; }
  .back { font-size: 18px; padding: 8px 6px; }
  .icon-btn { min-width: 36px; }
}

/* ── layout ── */
.wrap { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 20px; max-width: 1400px; margin: 0 auto; padding: 18px 16px 80px; }
.wrap.wide { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 879px) { .wrap { grid-template-columns: minmax(0, 1fr); padding-top: 12px; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.devnote { grid-column: 1 / -1; font-size: 13px; color: var(--text-muted); background: var(--amber-light); border-radius: var(--radius-sm); padding: 9px 12px; }
.devnote b { color: var(--amber); font-weight: 600; }
.banner { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--red-light); color: var(--red); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 14px; }
.banner .spacer { flex: 1; }
.banner a { color: inherit; font-weight: 600; }

/* ── show list ── */
.shows { padding: 8px; align-self: start; position: sticky; top: 78px; max-height: calc(100vh - 96px); overflow: auto; }
.wrap.wide .shows { display: none; }
.shows h3 { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-faint); margin: 12px 10px 4px; }
.shows h3:first-child { margin-top: 6px; }
.show-btn { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; border-radius: 10px; padding: 9px 10px; min-height: 44px; }
.show-btn:hover { background: var(--surface-2); }
.show-btn.on { background: var(--purple-light); color: var(--purple-dark); }
.show-btn .nm { flex: 1; min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.show-btn .dt { font-size: 12px; color: var(--text-faint); white-space: nowrap; }
.show-btn.on .dt { color: inherit; opacity: .75; }
.tag { font: 500 10px 'DM Mono', monospace; padding: 2px 5px; border-radius: 5px; background: var(--grey-light); color: var(--text-muted); }
.tag.ms { background: var(--blue-light); color: var(--blue); }
.tag.ct { background: var(--green-light); color: var(--green); }
.legacy { font-size: 12.5px; color: var(--text-faint); padding: 4px 10px 8px; }
details.legacy-list summary { cursor: pointer; list-style: none; }
details.legacy-list summary::-webkit-details-marker { display: none; }
.legacy-row { display: flex; gap: 8px; padding: 6px 10px; font-size: 13px; color: var(--text-muted); }
.legacy-row span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legacy-row a { color: var(--purple); text-decoration: none; white-space: nowrap; }
.show-select { display: none; }
@media (max-width: 879px) {
  .shows { display: none; }
  .show-select { display: block; width: 100%; margin-bottom: 14px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); font-size: 16px; font-weight: 500; }
}

/* ── notebook head / toolbar ── */
.main { min-width: 0; }
.nb-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin: 4px 2px 14px; }
.nb-head h2 { font-size: 26px; line-height: 1.15; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.nb-head .sub { color: var(--text-muted); font-size: 14px; margin-top: 3px; }
.nb-head .acts { margin-left: auto; display: flex; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-weight: 500; font-size: 14px; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--purple); }
.btn.primary { background: var(--purple); border-color: var(--purple); color: var(--on-accent); }
.btn.danger { color: var(--red); }
.btn.ghost { border-color: transparent; background: none; color: var(--text-muted); }
.btn.ghost:hover { color: var(--text); background: var(--surface); border-color: var(--border); }
.btn.sm { min-height: 34px; padding: 0 10px; font-size: 13px; }
.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.search { flex: 1 1 220px; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0 12px; min-height: 42px; }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 16px; padding: 9px 0; }
.search .x { border: 0; background: none; color: var(--text-faint); font-size: 18px; padding: 4px; }
.seg { display: inline-flex; background: var(--grey-light); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: 7px 12px; border-radius: 8px; font-size: 13.5px; color: var(--text-muted); font-weight: 500; min-height: 36px; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

/* ── tabs ── */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
.tab { flex: none; display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); font-weight: 500; font-size: 14px; white-space: nowrap; touch-action: pan-x; user-select: none; -webkit-user-select: none; }
.tab:hover { color: var(--text); border-color: var(--border-strong); }
.tab.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.tab .n { font: 500 11px 'DM Mono', monospace; opacity: .7; }
.tab.add { border-style: dashed; color: var(--purple); }
.tab.drop-hover { outline: 2px dashed var(--purple); outline-offset: 2px; color: var(--purple); }

/* ── panel ── */
.panel { padding: 16px 18px 10px; }
@media (max-width: 560px) { .panel { padding: 14px 12px 8px; } }
@media (max-width: 879px) { #wide-btn { display: none; } }
.panel-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.panel-head h3 { margin: 0; font-size: 19px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: text; }

/* fields */
.fields { display: grid; grid-template-columns: 140px minmax(0, 1fr) 30px; gap: 4px 10px; align-items: start; margin-bottom: 8px; }
.f-label { border: 1px solid transparent; background: none; border-radius: 8px; padding: 8px 6px; width: 100%; min-width: 0; text-overflow: ellipsis; font-size: 12px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: .05em; }
.f-label:hover { border-color: var(--border); }
.f-label:focus { border-color: var(--purple); outline: none; color: var(--text); }
.f-val { width: 100%; resize: none; border: 1px solid transparent; border-radius: 10px; background: var(--surface-2); padding: 7px 10px; min-height: 38px; font-size: 15px; line-height: 1.45; overflow: hidden; }
.f-val:hover { border-color: var(--border); }
.f-val:focus { border-color: var(--purple); background: var(--surface); outline: none; }
.f-x { border: 0; background: none; color: var(--text-faint); width: 30px; height: 36px; border-radius: 8px; font-size: 16px; opacity: 0; }
.fields > div:hover .f-x, .f-x:focus, .touch .f-x { opacity: 1; }
.f-row { display: contents; }
.f-row:hover .f-x { opacity: 1; }
.add-link { border: 0; background: none; color: var(--purple); font-size: 13.5px; font-weight: 500; padding: 6px 4px; border-radius: 8px; }
.add-link:hover { background: var(--purple-light); }
.panel-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 4px 0 10px; }

/* ── grid view ── */
.grid-wrap { overflow-x: auto; margin: 0 -18px; padding: 0 18px 4px; -webkit-overflow-scrolling: touch; }
@media (max-width: 560px) { .grid-wrap { margin: 0 -12px; padding: 0 12px 4px; } }
table.grid { border-collapse: separate; border-spacing: 0; table-layout: fixed; }
table.grid th, table.grid td { border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); padding: 0; vertical-align: top; }
table.grid tr > :last-child { border-right: 0; }
table.grid th { background: var(--surface-2); text-align: left; position: relative; border-top: 1px solid var(--border); }
table.grid th:first-child { border-top-left-radius: 8px; }
table.grid th:last-child { border-top-right-radius: 8px; }
.th-btn { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: none; padding: 8px 10px; font-size: 12.5px; font-weight: 600; color: var(--text-muted); text-align: left; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; min-height: 36px; }
.th-btn:hover { color: var(--text); }
.th-btn .caret { margin-left: auto; opacity: 0; font-size: 10px; }
.th-btn:hover .caret, .touch .th-btn .caret { opacity: .6; }
.add-col { width: 44px; }
.add-col button { width: 100%; min-height: 36px; border: 0; background: none; color: var(--purple); font-size: 18px; }
td.handle { width: 30px; text-align: center; color: var(--text-faint); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
td.handle span { display: block; padding: 9px 0; opacity: .35; font-size: 13px; letter-spacing: -2px; }
tr:hover td.handle span, .touch td.handle span { opacity: 1; }
th.handle-h { width: 30px; }
textarea.cell, input.cell { display: block; width: 100%; border: 0; background: transparent; resize: none; padding: 8px 10px; font-size: 14.5px; line-height: 1.4; min-height: 37px; overflow: hidden; border-radius: 0; }
textarea.cell:focus, input.cell:focus { outline: none; box-shadow: inset 0 0 0 2px var(--purple); background: var(--surface); }
td.st input.cell { font-weight: 600; font-size: 13px; }
td.st-Idea, td.st-, td.st-x { background: transparent; }
td.st-Idea input, td.st- input, td.st-x input { color: var(--text-muted); }
td.st-Planned { background: var(--blue-light); } td.st-Planned input { color: var(--blue); }
td.st-Building { background: var(--amber-light); } td.st-Building input { color: var(--amber); }
td.st-Done { background: var(--green-light); } td.st-Done input { color: var(--green); }
td.st-Cut input { color: var(--text-faint); text-decoration: line-through; }
tr.closed textarea.cell { color: var(--text-faint); }
tr.flash td, li.flash { animation: flash 1.6s; }
@keyframes flash { from { background: var(--amber-light); } }
.add-row { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--purple); font-weight: 500; font-size: 14px; padding: 10px 8px; border-radius: 8px; margin-top: 2px; }
.add-row:hover { background: var(--purple-light); }
.hint { color: var(--text-faint); font-size: 12.5px; padding: 2px 4px 6px; }
.dragging { opacity: .4; }
.drop-line { position: fixed; z-index: 70; background: var(--purple); border-radius: 2px; pointer-events: none; }

/* ── list view ── */
.quick { display: flex; gap: 8px; margin: 2px 0 8px; }
.quick input { flex: 1; min-width: 0; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface); padding: 10px 12px; font-size: 16px; min-height: 44px; }
.quick input:focus { border-color: var(--purple); outline: none; box-shadow: var(--ring); }
.items { list-style: none; margin: 0; padding: 0; }
.item { border-top: 1px solid var(--border); }
.item-row { display: flex; gap: 8px; align-items: flex-start; padding: 10px 0; }
.grip { flex: none; width: 24px; align-self: stretch; display: grid; place-items: start center; padding-top: 4px; color: var(--text-faint); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; font-size: 13px; letter-spacing: -2px; opacity: .45; }
.item:hover .grip, .touch .grip { opacity: 1; }
.it-body { flex: 1; min-width: 0; cursor: pointer; }
.it-title { font-weight: 500; overflow-wrap: anywhere; }
.it-body:hover .it-title { color: var(--purple); }
.it-line { color: var(--text-muted); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
.it-line b { font-weight: 600; color: var(--text-faint); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; margin-right: 6px; }
.item.closed .it-title { color: var(--text-faint); text-decoration: line-through; }
.item.closed .it-line { color: var(--text-faint); }
.it-tab { font-size: 12px; color: var(--purple); font-weight: 500; }
.status { flex: none; min-width: 74px; height: 28px; border-radius: 8px; border: 0; font-size: 12px; font-weight: 600; padding: 0 8px; }
.st-Idea, .st-, .st-x { background: var(--grey-light); color: var(--text-muted); }
.st-Planned { background: var(--blue-light); color: var(--blue); }
.st-Building { background: var(--amber-light); color: var(--amber); }
.st-Done { background: var(--green-light); color: var(--green); }
.st-Cut { background: var(--grey-light); color: var(--text-faint); text-decoration: line-through; }
.pending { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); flex: none; margin-top: 9px; }
.editor { padding: 2px 0 14px 32px; display: grid; gap: 10px; }
@media (max-width: 560px) { .editor { padding-left: 0; } }
.field { display: grid; gap: 4px; }
.field > span { font-size: 12px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: .05em; }
.field input, .field textarea, .field select { width: 100%; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface); padding: 9px 11px; font-size: 16px; min-height: 42px; }
.field textarea { resize: none; min-height: 42px; line-height: 1.45; overflow: hidden; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--purple); outline: none; box-shadow: var(--ring); }
.ed-acts { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.done-toggle { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--border); background: none; padding: 12px 2px; color: var(--text-muted); font-size: 13.5px; font-weight: 500; }
.empty { color: var(--text-faint); padding: 16px 2px 18px; font-size: 14px; border-top: 1px solid var(--border); }
.freeform { white-space: pre-wrap; color: var(--text-muted); font-size: 14px; border-top: 1px solid var(--border); padding: 12px 2px; }
.search-group { margin-bottom: 14px; }
.search-group h4 { margin: 0 0 2px; font-size: 13px; color: var(--purple); font-weight: 600; }
mark { background: color-mix(in srgb, var(--amber) 28%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }

/* start / connect */
.hero { padding: 28px 24px; }
.hero h2 { margin: 0 0 6px; font-size: 22px; }
.hero p { margin: 0 0 16px; color: var(--text-muted); max-width: 58ch; }
.hero ol { color: var(--text-muted); padding-left: 20px; margin: 0 0 16px; }
.hero ol li { margin: 4px 0; }
.hero .row { display: flex; gap: 8px; flex-wrap: wrap; }
.hero input[type=url] { flex: 1 1 280px; min-width: 0; border: 1px solid var(--border-strong); border-radius: 10px; padding: 10px 12px; background: var(--surface); font-size: 15px; min-height: 42px; }
.preview-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 18px; }
.preview-tabs span { font-size: 13px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-muted); }
.err-text { color: var(--red); font-size: 13.5px; margin-top: 10px; }

/* menus / toast */
.menu { position: fixed; z-index: 80; min-width: 190px; max-height: 70vh; overflow: auto; padding: 6px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 10px 12px; border-radius: 8px; font-size: 14px; }

  font-size: 11px; color: var(--text-faint); background: var(--surface); padding: 2px 6px; border-radius: 4px; }
</style>

<body>
<header class="topbar">
  <a class="back" href="app.html" aria-label="Back to dashboard">←<span class="lbl"> Dashboard</span></a>
  <h1>Show Notes</h1>
  <span class="dev-badge">DEV</span>
  <span class="spacer"></span>
  <button class="sync" id="sync" onclick="onSyncClick()"><span class="dot"></span><span id="sync-text">…</span></button>
  <button class="btn sm primary" id="install-btn" hidden onclick="installApp()">Install app</button>
  <button class="icon-btn" id="wide-btn" title="Hide show list" aria-label="Hide show list" onclick="toggleWide()">⇔</button>

<div class="wrap" id="wrap">

  <div id="banner" class="banner" hidden></div>
  <div id="app-hint" class="devnote" hidden></div>

  </main>
</div>
<datalist id="statuses"><option value="Idea"><option value="Planned"><option value="Building"><option value="Done"><option value="Cut"></datalist>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="build-tag">10.14 v8</div>

<script>
'use strict';
const BUILD = '10.14 v8';
const NEED_API = 2;      // features the page can't work without
const NEED_BUILD = 3;    // newest backend; an older one is told to update itself
// Live dashboard backend — used ONLY for reads (show list, existing notes links).
const LIVE_URL = 'https://script.google.com/macros/s/AKfycbzVONJuSlGzl04FZCzd3h45V2AsKC3HkqI6eeaujMetaDGkeGctL9IolMkJNBeJA7BaBg/exec';
// The dev notes backend (its own Apps Script project). Built in so every device
// connects without setup; ⚙ can still point a device somewhere else.
const DEFAULT_API = 'https://script.google.com/macros/s/AKfycbzKRs8fDvx_gs-aX2ZIeJ6LCKOUJIvmsrcVczhcJWzWgjs0Chseb_xwH0fHpjOHAPEe/exec';
const STATUS_CYCLE = ['Idea', 'Planned', 'Building', 'Done'];
const PRACTICE = { slug: '_practice', name: 'Practice notebook', type: 'Practice' };
const LS = {
  api: 'mmt_notesdev_api', books: 'mmt_notesdev_books', book: id => 'mmt_notesdev2_book_' + id,
  queue: 'mmt_notesdev_q2', last: 'mmt_notesdev_last', tab: 'mmt_notesdev_tab', view: 'mmt_notesdev_view', wide: 'mmt_notesdev_wide',
};
if ('ontouchstart' in window) document.documentElement.classList.add('touch');

// ── small helpers ──
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function uid() { return 'n' + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 7); }
function slugify(n) { return String(n || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
function legacyKey(sh) { return (sh.type === 'Mainstage' ? 'mainstage_' : 'childrens_') + String(sh.name).replace(/[^a-z0-9]/gi, '_'); }
function fmtDates(a, b) {
  if (!a) return '';
  const o = { month: 'short', day: 'numeric' };
  const d1 = new Date(a + 'T12:00'), d2 = b ? new Date(b + 'T12:00') : null;
  return d1.toLocaleDateString(undefined, o) + (d2 ? '–' + d2.toLocaleDateString(undefined, o) : '');
}
const lc = s => String(s || '').trim().toLowerCase();
function colName(tab, k) { return tab.columns.find(c => lc(c) === lc(k)) || null; }
function uniqueName(list, name, skip) {
  const low = list.filter(x => x !== skip).map(lc); let t = name, n = 2;
  while (low.includes(lc(t)) || lc(t) === 'id') t = name + ' ' + (n++);
  return t;
}
function statusCol(tab) { return colName(tab, 'status'); }
// Columns other than Status, in order. The first one is the row's title in list view.
function textCols(tab) { const sc = statusCol(tab); return tab.columns.filter(c => c !== sc); }
function isClosed(tab, it) { const s = statusCol(tab); const v = s ? lc(it.v[s]) : ''; return v === 'done' || v === 'cut'; }
function stClass(v) { const m = { idea: 'Idea', planned: 'Planned', building: 'Building', done: 'Done', cut: 'Cut' }; return 'st-' + (m[lc(v)] || (v ? 'x' : '')); }

// ── theme / layout prefs ──
(function () { try { const t = localStorage.getItem('mmt_theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('mmt_theme', next); } catch (e) {}
}
function toggleWide() { S.wide = !S.wide; lsSet(LS.wide, S.wide); applyWide(); }
function applyWide() {
  document.getElementById('wrap').classList.toggle('wide', !!S.wide);
  const b = document.getElementById('wide-btn'); b.title = S.wide ? 'Show the show list' : 'Hide show list (more room for the grid)';
}

// ── state ──
const S = {
  api: lsGet(LS.api, '') || DEFAULT_API, apiLevel: null,
  shows: [], legacy: {}, books: lsGet(LS.books, []),
  slug: '', book: null, tabGid: null, editing: null,
  filter: 'all', q: '', showDone: {}, view: lsGet(LS.view, innerWidth >= 880 ? 'grid' : 'list'),
  wide: lsGet(LS.wide, false), loadingBook: false, connectErr: '', bookErr: '', needsReload: false,
};
let queue = lsGet(LS.queue, []);
let flushing = false, retryTimer = null, retryDelay = 2000;

// ════════════════════════════════════════════════════════════════════════════
// The one place that knows how each change alters a notebook. The page uses it
// to show an edit instantly; the demo backend uses it as its "server".
// It mirrors what ShowNotesDev.gs does to the real sheet.
// ════════════════════════════════════════════════════════════════════════════
function applyOp(book, op) {
  const tab = book.tabs.find(t => String(t.gid) === String(op.gid));
  const find = id => tab && tab.items.findIndex(i => i.id === id);
  const insertAt = (t, item, beforeId) => {
    const b = beforeId ? t.items.findIndex(i => i.id === beforeId) : -1;
    if (b === -1) t.items.push(item); else t.items.splice(b, 0, item);
  };
  const ensureCols = (t, values) => Object.keys(values).forEach(k => { if (!colName(t, k) && String(values[k]) !== '') { t.columns.push(k); t.items.forEach(i => { i.v[k] = ''; }); } });
  switch (op.action) {
    case 'saveItem': {
      ensureCols(tab, op.values || {});
      let i = find(op.id), it;
      if (i === -1) { it = { id: op.id, v: {} }; tab.columns.forEach(c => it.v[c] = ''); insertAt(tab, it, op.beforeId); }
      else it = tab.items[i];
      Object.keys(op.values || {}).forEach(k => { const c = colName(tab, k); if (c) it.v[c] = op.values[k]; });
      break;
    }
    case 'deleteItem': { const i = find(op.id); if (i > -1) tab.items.splice(i, 1); break; }
    case 'moveItem': {
      const i = find(op.id); if (i === -1) break;
      const it = tab.items.splice(i, 1)[0];
      const to = op.toGid == null ? tab : book.tabs.find(t => String(t.gid) === String(op.toGid));
      if (to === tab) { insertAt(tab, it, op.beforeId); break; }
      const vals = {}; tab.columns.forEach(c => { if (it.v[c] !== '' && it.v[c] != null) vals[c] = it.v[c]; });
      ensureCols(to, vals);
      const n = { id: it.id, v: {} }; to.columns.forEach(c => n.v[c] = ''); Object.keys(vals).forEach(k => n.v[colName(to, k)] = vals[k]);
      insertAt(to, n, op.beforeId);
      break;
    }
    case 'addColumn': {
      const name = uniqueName(tab.columns, op.name);
      tab.columns.splice(op.index == null ? tab.columns.length : op.index, 0, name);
      tab.items.forEach(i => i.v[name] = '');
      break;
    }
    case 'renameColumn': {
      const from = colName(tab, op.from); if (!from) break;
      const to = uniqueName(tab.columns, op.to, from);
      tab.columns[tab.columns.indexOf(from)] = to;
      tab.items.forEach(i => { const v = i.v[from]; delete i.v[from]; i.v[to] = v == null ? '' : v; });
      break;
    }
    case 'deleteColumn': {
      const c = colName(tab, op.name); if (!c || tab.columns.length < 2) break;
      tab.columns.splice(tab.columns.indexOf(c), 1); tab.items.forEach(i => delete i.v[c]);
      break;
    }
    case 'moveColumn': {
      const c = colName(tab, op.name); if (!c) break;
      tab.columns.splice(tab.columns.indexOf(c), 1); tab.columns.splice(Math.min(op.index, tab.columns.length), 0, c);
      break;
    }
    case 'setField': {
      const f = tab.fields.find(x => lc(x.label) === lc(op.label));
      if (f) f.value = op.value; else tab.fields.push({ label: op.label, value: op.value });
      break;
    }
    case 'renameField': {
      const f = tab.fields.find(x => lc(x.label) === lc(op.from));
      if (f) f.label = op.to; else tab.fields.push({ label: op.to, value: '' });
      break;
    }
    case 'deleteField': tab.fields = tab.fields.filter(x => lc(x.label) !== lc(op.label)); break;
    case 'moveTab': { const i = book.tabs.indexOf(tab); book.tabs.splice(i, 1); book.tabs.splice(op.index, 0, tab); break; }
    case 'renameTab': tab.title = op.title; break;
    case 'deleteTab': book.tabs.splice(book.tabs.indexOf(tab), 1); break;
  }
}

// ── transport ──
function jsonp(url, timeoutMs) {
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    const s = document.createElement('script');
    let done = false;
    const t = setTimeout(() => fin(() => reject(new Error('Timed out'))), timeoutMs || 20000);
    function fin(f) { if (done) return; done = true; clearTimeout(t); delete window[cb]; s.remove(); f(); }
    window[cb] = d => fin(() => resolve(d));
    s.onerror = () => fin(() => reject(new Error('Network')));
    s.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    document.head.appendChild(s);
  });
}
// Requests go out WITHOUT Google sign-in cookies (credentials: 'omit'). The
// backend is open to "Anyone", and a browser signed into several Google
// accounts otherwise gets "Sorry, unable to open the file at this time".
// JSONP (which always sends cookies) is the fallback, chosen once per page
// load by a harmless read, so a write is never sent twice by two methods.
async function getJSON(url, timeoutMs) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), timeoutMs || 20000);
  try {
    const r = await fetch(url, { credentials: 'omit', cache: 'no-store', redirect: 'follow', signal: ctl.signal });
    return await r.json();
  } catch (e) { throw new Error(e.name === 'AbortError' ? 'Timed out' : 'Network'); }
  finally { clearTimeout(t); }
}
const SAFE_TO_RETRY = new Set(['ping', 'listBooks', 'getBook']);
async function api(req, timeoutMs) {
  if (S.api === 'demo') return Demo.call(req);
  if (!S.api) throw new Error('Not connected');
  const payload = JSON.stringify(req);
  let res;
  if (payload.length < 1500) {
    const url = S.api + '?payload=' + encodeURIComponent(payload) + '&_=' + Date.now();
    if (S.via === 'jsonp') res = await jsonp(url, timeoutMs);
    else {
      try { res = await getJSON(url, timeoutMs); S.via = 'fetch'; }
      catch (e) {
        if (S.via === 'fetch' || !SAFE_TO_RETRY.has(req.action) || e.message === 'Timed out') throw e;
        res = await jsonp(url, timeoutMs); S.via = 'jsonp';
      }
    }
  } else {
    // Long text: POST. Long ops are cell saves, which are safe to repeat.
    const r = await fetch(S.api, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: payload });
    res = await r.json();
  }
  if (!res || !res.ok) { const e = new Error((res && res.error) || 'Server error'); e.server = true; throw e; }
  return res;
}

// ── change queue ──
// Every edit shows instantly, is saved on this device, and is sent to the
// sheet in order. If the network drops, edits wait and retry. Nothing is
// thrown away without asking.
function change(op) {
  op.sheetId = S.book.sheetId;
  applyOp(S.book, op);
  enqueue(op);
  cacheBook();
}
function enqueue(op) {
  op.qid = uid();
  const last = queue[queue.length - 1];
  // Typing into the same row: fold into the waiting save instead of queueing another.
  if (op.action === 'saveItem' && last && !last.sending && last.action === 'saveItem' && last.id === op.id &&
      last.gid === op.gid && last.sheetId === op.sheetId) {
    Object.assign(last.values, op.values);
  } else queue.push(op);
  saveQueue(); flush();
}
function saveQueue() {
  lsSet(LS.queue, queue.filter(q => !String(q.sheetId).startsWith('demo-')).map(q => { const c = { ...q }; delete c.sending; return c; }));
  renderSync();
}
const STRUCTURAL = new Set(['renameTab', 'deleteTab', 'moveItem', 'addColumn', 'renameColumn', 'deleteColumn', 'moveColumn', 'renameField', 'deleteField', 'moveTab', 'deleteItem']);
async function flush() {
  if (flushing || !queue.length || !S.api) return;
  if (S.apiLevel != null && S.apiLevel < NEED_API) { renderSync(); return; }
  flushing = true; clearTimeout(retryTimer); renderSync();
  while (queue.length) {
    const op = queue[0];
    if (op.failed) break;
    op.sending = true;
    const req = { ...op }; ['qid', 'sending', 'failed', 'tries'].forEach(k => delete req[k]);
    try {
      await api(req);
      queue.shift(); retryDelay = 2000;
      if (STRUCTURAL.has(op.action)) S.needsReload = true;
      saveQueue();
    } catch (e) {
      op.sending = false; op.tries = (op.tries || 0) + 1;
      if (e.server && op.tries >= 3) { op.failed = String(e.message); saveQueue(); showBanner(); }
      else { saveQueue(); retryTimer = setTimeout(flush, retryDelay); retryDelay = Math.min(retryDelay * 2, 30000); }
      break;
    }
  }
  flushing = false; renderSync(); refreshPendingDots();
  // After moves/renames, re-read the sheet once so the page matches it exactly.
  if (!queue.length && S.needsReload && S.book && S.api !== 'demo') { S.needsReload = false; loadBook(S.book.sheetId); }
}
window.addEventListener('online', () => { retryDelay = 2000; flush(); });
function pendingIds() { return new Set(queue.filter(q => q.action === 'saveItem').map(q => q.id)); }
function showBanner() {
  const b = document.getElementById('banner');
  if (S.api && S.api !== 'demo' && S.backend && !S.backend.selfUpdate) {
    b.hidden = false;
    const gh = 'https://github.com/musicmountainmcafee-eng/MMT-Inventory/blob/main/apps-script/';
    b.innerHTML = `<span><b>One last paste, then the backend updates itself.</b>${S.apiLevel < NEED_API ? ' Your edits are kept on this device until it’s done.' : ''} On a laptop, in the MMT Show Notes DEV script:<br>① turn on “Google Apps Script API” at <a href="https://script.google.com/home/usersettings" target="_blank" rel="noopener">script.google.com/home/usersettings</a><br>② Project Settings → tick “Show appsscript.json”, then replace it with <a href="${gh}appsscript.json" target="_blank" rel="noopener">appsscript.json</a><br>③ replace the code with <a href="${gh}ShowNotesDev.gs" target="_blank" rel="noopener">ShowNotesDev.gs</a>, save<br>④ pick <b>setup</b> in the function menu → Run → allow<br>⑤ Deploy → Manage deployments → ✎ → New version → Deploy.</span>
      <span class="spacer"></span><button class="btn sm" onclick="checkApi(true)">Check again</button>`;
    return;
  }
  if (S.apiLevel != null && S.apiLevel < NEED_API && S.api !== 'demo') {
    b.hidden = false;
    b.innerHTML = `<span><b>The Apps Script needs updating</b> for this version of the page. Paste the new <a href="https://github.com/musicmountainmcafee-eng/MMT-Inventory/blob/main/apps-script/ShowNotesDev.gs" target="_blank" rel="noopener">ShowNotesDev.gs</a>, then Deploy → Manage deployments → ✎ → Version: New version → Deploy. Your edits are kept until then.</span>
      <span class="spacer"></span><button class="btn sm" onclick="checkApi(true)">Check again</button>`;
    return;
  }
  const bad = queue.find(q => q.failed);
  if (!bad && S.updateErr) {
    b.hidden = false;
    b.innerHTML = `<span>The backend couldn't update itself: <b>${esc(S.updateErr)}</b> Everything still saves; this only matters for new features.</span>
      <span class="spacer"></span><button class="btn sm" onclick="selfUpdate()">Try again</button>`;
    return;
  }
  if (!bad) { b.hidden = true; return; }
  b.hidden = false;
  b.innerHTML = `<span>A change couldn't be saved to the sheet: <b>${esc(bad.failed)}</b></span><span class="spacer"></span>
    <button class="btn sm" onclick="retryFailed()">Retry</button><button class="btn sm danger" onclick="discardFailed()">Discard it</button>`;
}
function retryFailed() { queue.forEach(q => { delete q.failed; q.tries = 0; }); saveQueue(); showBanner(); flush(); }
function discardFailed() {
  if (!confirm('Throw away the change that failed to save? The sheet keeps its current version.')) return;
  queue = queue.filter(q => !q.failed); saveQueue(); showBanner(); flush();
  if (S.book) loadBook(S.book.sheetId, true);
}
function renderSync() {
  const el = document.getElementById('sync'), tx = document.getElementById('sync-text');
  el.className = 'sync'; el.title = '';
  if (S.api === 'demo') { el.classList.add('demo'); tx.textContent = 'Demo — not saved'; return; }
  if (!S.api) { el.classList.add('err'); tx.textContent = 'Not connected'; return; }
  const n = queue.length;
  if (S.updating) { el.classList.add('busy'); tx.textContent = 'Updating backend…'; return; }
  if (S.apiLevel != null && S.apiLevel < NEED_API) { el.classList.add('err'); tx.textContent = n ? `Update script · ${n} waiting` : 'Update script'; return; }
  if (queue.some(q => q.failed)) { el.classList.add('err'); tx.textContent = 'Save problem'; return; }
  if (n && (!navigator.onLine || queue.some(q => q.tries))) { el.classList.add('err'); tx.textContent = `Can't reach sheet · ${n} waiting`; el.title = 'Edits are kept on this device and retried automatically. Tap to retry now.'; return; }
  if (n) { el.classList.add('busy'); tx.textContent = `Saving ${n}…`; return; }
  if (S.loadingBook) { el.classList.add('busy'); tx.textContent = 'Loading…'; return; }
  tx.textContent = 'Saved to sheet';
}
function onSyncClick() { if (queue.length) { retryDelay = 2000; flush(); } else if (S.book) loadBook(S.book.sheetId, true); }
async function ping() { const r = await api({ action: 'ping' }); S.apiLevel = r.api || 1; S.backend = { build: r.build || 0, selfUpdate: !!r.selfUpdate, version: r.version }; return r; }
async function checkApi(manual) {
  if (!S.api || S.api === 'demo') return;
  try { await ping(); }
  catch (e) { if (manual) toast("Couldn't reach the script: " + e.message); flush(); return; }   // flush keeps retrying
  if (S.backend.selfUpdate && S.backend.build < NEED_BUILD) await selfUpdate();
  showBanner(); renderSync();
  if (S.apiLevel >= NEED_API) { flush(); if (manual) toast('Script is up to date'); if (S.book) loadBook(S.book.sheetId, true); }
}
// The backend pulls its newest code from GitHub and redeploys itself (same URL).
async function selfUpdate() {
  if (S.updating) return;
  S.updating = true; S.updateErr = ''; renderSync();
  try {
    const r = await api({ action: 'selfUpdate' }, 90000);
    if (r.updated) {
      for (let i = 0; i < 4; i++) {           // the new deployment is live within a few seconds
        await new Promise(res => setTimeout(res, 1500 * (i + 1)));
        try { await ping(); } catch (e) {}
        if (S.backend.build >= r.to) break;
      }
      toast('Backend updated itself to build ' + S.backend.build);
    } else if (S.backend.build < NEED_BUILD) {
      // GitHub can take a few minutes to serve a fresh push; try again later.
      S.updateErr = (r.reason || 'Not updated') + '. Will try again shortly.';
      setTimeout(() => checkApi(), 5 * 60000);
    }
  } catch (e) { S.updateErr = e.message; }
  finally { S.updating = false; renderSync(); showBanner(); }
}

// ── live show list (read-only) ──
function readShows() {
  const st = lsGet('mmt_shows', null), d = lsGet('mmt_data', null);
  if (d && d.showNotes) S.legacy = d.showNotes;
  if (st && Array.isArray(st.mainstage)) setShows(st);
  jsonp(LIVE_URL + '?action=getKV&key=showlist&_=' + Date.now()).then(r => {
    let v = r && r.value; if (typeof v === 'string') { try { v = JSON.parse(v); } catch (e) { v = null; } }

  try {
    const r = await ping();
    lsSet(LS.api, url); S.connectErr = ''; S._prevApi = '';
    toast('Connected · backend ' + r.version);
    await loadIndex();
    if (S.backend.selfUpdate && S.backend.build < NEED_BUILD) await selfUpdate();
    flush(); showBanner();
    if (S.slug) pickShow(S.slug);
  } catch (e) { S.api = ''; err.textContent = 'Couldn’t reach it: ' + e.message + '. Check the deployment allows “Anyone”.'; }
}
function useDemo() { S.api = 'demo'; S._prevApi = ''; S.apiLevel = NEED_API; S.books = Demo.books(); queue = queue.filter(q => !String(q.sheetId).startsWith('demo-')); pickShow('its-a-wonderful-life'); }

// ── demo backend: same actions, in memory, using applyOp ──
const Demo = (() => {
  let gid = 1;
  const COLS = ['Item', 'Notes', 'Scenes', 'Where', 'Status'];
  const row = (Item, Notes = '', Scenes = '', Where = '', Status = 'Idea') => ({ id: uid(), v: { Item, Notes, Scenes, Where, Status } });
  const tab = (title, about, scenes, items, cols) => ({ gid: gid++, title, fields: [{ label: 'About', value: about }, { label: 'Scenes', value: scenes }], columns: (cols || COLS).slice(), items, format: 'notes' });
  const books = {
    'demo-iawl': { sheetId: 'demo-iawl', url: 'https://docs.google.com/spreadsheets/', name: "It's a Wonderful Life — Show Notes", tabs: [
      tab('Build To-Do', 'Shop list for the build.', '', [
        row('Bridge piece', 'Sturdy railing that matches the drop', 'A2S6, A2S7, A2S9', 'DS', 'Planned'),
        row('3 sleds on wheels', '', '', '', 'Building'),
        row('Bailey loan counter', 'Use Matilda table with windows + forced perspective. How many windows?', 'A1S9', 'SR'),
        row('Back wall for office', 'Urinetown style, with forced perspective', '', 'US'),
        row('2 fly-in banner signs', '“Bedford Hall High Class of 1928” and “Welcome to Bailey Park”', '', 'Fly'),
        row('New letters for bank unit'), row('Two Christmas trees', 'One for the square, one for the house'),
        row('Get 3D printer working', '', '', '', 'Done'),
      ]),
      tab('Production Meetings', 'Questions and answers from production meetings.', '', [
        row('Snow', 'Only during the bridge setups'), row('Working bike', '', '', '', 'Planned'), row('Fly in Christmas swag'),
        row('Town drop ties into pieces', 'Play with forced perspective on all pieces'),
        row('Prologues', 'Both in front of main curtain. Fog. All heaven in front of main, SL if possible', 'A1S1A, A1S5A, A1S9A', 'In 1'),
      ]),
      tab('Bridge', 'Feel small and alone. Railing like he’s on a bridge, big feeling. The only time it snows.', 'A2S6, A2S7, A2S9', [
        row('Railing', 'Sturdy', '', 'DS', 'Planned'),
        row('Bench', '“A hut outside bridge”, same drop. Not needed A2S9; set it when we set the bridge.', 'A2S7'),
      ]),
      tab("Potter's Office", 'Should feel like Scrooge in the 1930s. Play with perspective so the wall isn’t flat across the top.', 'A1S11, A2S5', [
        row('Partner desk', 'On wheels?'), row('Big old wheelchair', 'John Dwyer'), row('Guest chair', 'On wheels or bentwood'),
        row('Rolling wall', 'Urinetown style with perspective', '', 'US'),
      ]),
      tab('Upstage Unit', 'Could be drop, back wall, or LED wall. Act 1 looks like still moving in; lived-in by Act 2.', 'A1S12, A2S4, A2S10', [
        row('Landing with stairs', 'Center stairs facing center, small platform, stairs off SR (à la Annie)'),
        row('Upright piano', 'Maybe covered with a drop for Act 1'), row('Couch', 'Covered with boxes for Act 1'), row('Christmas tree', 'Act 2 only'),
      ]),
    ] },
  };
  const index = [{ slug: 'its-a-wonderful-life', name: "It's a Wonderful Life", sheetId: 'demo-iawl', url: books['demo-iawl'].url }];
  const reply = v => new Promise(r => setTimeout(() => r(JSON.parse(JSON.stringify({ ok: true, ...v }))), 200));
  const B = id => { if (!books[id]) throw Object.assign(new Error('Not found'), { server: true }); return books[id]; };
  return {
    books: () => index.slice(),
    call(r) {
      switch (r.action) {
        case 'ping': return reply({ version: 'demo', api: NEED_API, build: NEED_BUILD, selfUpdate: true });
        case 'listBooks': return reply({ books: index });
        case 'createBook': {
          const id = 'demo-' + r.slug;
          books[id] = { sheetId: id, url: 'https://docs.google.com/spreadsheets/', name: r.name, tabs: ['General', 'Build To-Do', 'Production Meetings'].map(t => tab(t, '', '', [])) };
          const b = { slug: r.slug, name: r.name, sheetId: id, url: books[id].url }; index.push(b); return reply({ book: b });
        }
        case 'getBook': return reply(B(r.sheetId));
        case 'addTab': {
          const t = tab(r.title, '', '', [], r.columns); t.fields = (r.fields || ['About', 'Scenes']).map(l => ({ label: l, value: '' }));
          const bk = B(r.sheetId); if (r.index == null) bk.tabs.push(t); else bk.tabs.splice(r.index, 0, t); return reply({ tab: t });
        }
        default: applyOp(B(r.sheetId), r); return reply({});
      }
    },
  };
})();

// ── home-screen app ──
// The notes page has its own manifest (notes.webmanifest), so it installs as
// "MMT Notes" with its own icon, separate from the dashboard app.
let _installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); _installEvt = e; document.getElementById('install-btn').hidden = false; });
window.addEventListener('appinstalled', () => { document.getElementById('install-btn').hidden = true; hideAppHint(true); toast('Installed. Open “MMT Notes” from your home screen.'); });
async function installApp() {
  if (!_installEvt) return;
  _installEvt.prompt();
  try { await _installEvt.userChoice; } catch (e) {}
  _installEvt = null; document.getElementById('install-btn').hidden = true;
}
// Opened as the notes app (its start_url has ?app=notes) — remember for this session.
function inNotesApp() {
  try {
    if (new URLSearchParams(location.search).get('app') === 'notes') sessionStorage.setItem('mmt_notes_app', '1');
    return sessionStorage.getItem('mmt_notes_app') === '1';
  } catch (e) { return false; }
}
// Running full-screen but not as the notes app means a link opened us inside the
// dashboard app. Offer a way out to Chrome, where "Install app" works.
function showAppHint() {
  const standalone = ['standalone', 'fullscreen', 'minimal-ui'].some(m => matchMedia('(display-mode: ' + m + ')').matches) || navigator.standalone;
  if (!standalone || inNotesApp() || lsGet('mmt_notes_hint_off', false)) return;
  const el = document.getElementById('app-hint');
  const android = /Android/i.test(navigator.userAgent);
  const here = location.host + location.pathname;
  el.hidden = false;
  el.innerHTML = `<b>Want Notes as its own app?</b> This opened inside the dashboard app. ` +
    (android ? `<a href="intent://${esc(here)}#Intent;scheme=https;package=com.android.chrome;end">Open in Chrome</a>, then tap <b>Install app</b> at the top.`
             : `Open <span class="mono">${esc(here)}</span> in your browser, then use its “Add to Home Screen”.`) +
    ` <a href="#" onclick="hideAppHint(true);return false" style="margin-left:8px">Dismiss</a>`;
}
function hideAppHint(forever) { document.getElementById('app-hint').hidden = true; if (forever) lsSet('mmt_notes_hint_off', true); }
if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }

// ── stay current ──
// The dashboard's offline cache shows the saved copy of this page first, so a
// new build would only appear on the open after next. Instead: ask GitHub which
// build is current (api.github.com isn't cached), and if it's newer, fetch the
// new page, put it in the cache, and reload once.
async function stayCurrent() {
  if (!('caches' in window)) return;
  try {
    const r = await fetch('https://api.github.com/repos/musicmountainmcafee-eng/MMT-Inventory/contents/notes-version.json?ref=main',
      { headers: { Accept: 'application/vnd.github.raw' }, cache: 'no-store' });
    if (!r.ok) return;
    const want = (await r.json()).build;
    if (!want || want === BUILD) return;
    const guard = 'mmt_notes_reloaded_for';
    try { if (sessionStorage.getItem(guard) === want) return; } catch (e) {}
    // A query the cache hasn't seen goes to the network; that's the new page.
    const res = await fetch(location.pathname + '?b=' + encodeURIComponent(want), { cache: 'reload' });
    const html = await res.clone().text();
    if (!html.includes("const BUILD = '" + want + "'")) return;   // GitHub Pages hasn't published it yet
    const urls = [location.pathname, location.pathname + location.search, location.pathname + '?app=notes'];
    for (const name of await caches.keys()) {
      const c = await caches.open(name);
      for (const u of urls) if (await c.match(u)) await c.put(u, res.clone());
    }
    try { sessionStorage.setItem(guard, want); } catch (e) {}
    if (busyTyping() || queue.length || Object.keys(_pend).length) { toast('Update ' + want + ' is ready. It loads next time you open Notes.'); return; }
    location.reload();
  } catch (e) {}
}

// ── boot ──
(function boot() {
  document.getElementById('build-tag').textContent = BUILD;   // one source for the version
  showAppHint();
  setTimeout(stayCurrent, 1500);
  const qs = new URLSearchParams(location.search);
  if (qs.get('demo') === '1') S.api = 'demo';
  if (S.api === 'demo') { S.books = Demo.books(); S.apiLevel = NEED_API; }
  readShows();
  const last = qs.get('show') || lsGet(LS.last, '') || (S.api === 'demo' ? 'its-a-wonderful-life' : '');
  if (S.api === 'demo') pickShow(bookFor(last) || last === PRACTICE.slug ? last : 'its-a-wonderful-life');
  else if (last && (S.shows.some(s => s.slug === last) || last === PRACTICE.slug || bookFor(last))) pickShow(last);
  else render();
  if (S.api && S.api !== 'demo') { checkApi(); loadIndex().then(() => { if (S.slug && !S.book && bookFor(S.slug)) pickShow(S.slug); }); }
})();
</script>
